<style>
:root{
  /* Carnet : papier crème, encre bleue, intercalaires de couleur par onglet */
  --bg:#f7f4ec;--surface:#fffdf7;--surface2:#efe9dc;--text:#25211a;--muted:#736a5b;--line:#e3dbc9;--line2:#ece5d6;
  --accent:#2f6fb3;--on-accent:#fff;--accent-soft:rgba(47,111,179,.11);--todaybg:rgba(47,111,179,.09);--todayc:rgba(47,111,179,.17);
  --sec:#2f6fb3;--k-ag:#2f6fb3;--k-tk:#4d7c0f;--k-bd:#be185d;--k-rp:#c2410c;--k-vy:#0e7490;--k-co:#0f766e;--margin:rgba(214,74,74,.28);
  --serif:"New York",ui-serif,"Iowan Old Style",Charter,"Bitstream Charter",Georgia,serif;
  --danger:#d92d20;--warn:#f59e0b;--shadow:0 10px 40px rgba(16,24,40,.22);--scale:1;
}
html[data-theme=dark]{
  --bg:#15130f;--surface:#1e1b16;--surface2:#29251e;--text:#f2ede2;--muted:#a99f8d;--line:#3a3429;--line2:#2b2720;
  --accent:#7fb2e8;--on-accent:#0d1520;--accent-soft:rgba(127,178,232,.15);--todaybg:rgba(127,178,232,.12);--todayc:rgba(127,178,232,.22);
  --k-ag:#7fb2e8;--k-tk:#9ccc5a;--k-bd:#f17bb0;--k-rp:#fb923c;--k-vy:#4fc3d9;--k-co:#5eead4;--margin:rgba(240,110,110,.22);
  --danger:#ff6b5f;--shadow:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(17px*var(--scale)*var(--dev,1));-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
.ic{width:1.45rem;height:1.45rem;flex:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:calc(1500px*var(--dev,1));margin:0 auto;background:var(--bg);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* header */
#top{display:flex;align-items:center;gap:.15rem;padding:calc(env(safe-area-inset-top,0px) + .55rem) .6rem .5rem .95rem;background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-family:var(--serif);font-style:italic;font-size:1.45rem;font-weight:700;letter-spacing:-.01em;line-height:1.12}
.ttl small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.nav{display:flex;align-items:center;gap:.1rem}
.ib{width:2.7rem;height:2.7rem;border-radius:.8rem;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.ib:active,.pill:active{background:var(--surface2)}
.pill{padding:.45rem .8rem;border:1.5px solid var(--line);border-radius:999px;font-weight:700;font-size:.82rem}

@media(max-width:560px){
  #top{display:grid;grid-template-columns:1fr auto auto auto auto;row-gap:.35rem;padding-bottom:.55rem}
  #top>#gearbtn{grid-column:4;grid-row:1}
  #top>.ib[data-act=help]{grid-column:3;grid-row:1}
  #top>.ib[data-act=print]{grid-column:2;grid-row:1}
  .nav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:3.2rem 1fr 3.2rem;gap:.5rem}
  .nav .ib{background:var(--surface2);width:auto}
  .nav .pill{text-align:center;display:grid;place-items:center;height:2.7rem;font-size:.95rem}
}
/* body */
#body{flex:1;display:flex;min-height:0;position:relative}
#main{flex:1;min-width:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#main.fixed{overflow:hidden}
#side{display:none;width:21rem;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto}
@media(min-width:900px){#body.has-side #side{display:block}}
#fab{position:absolute;right:1rem;bottom:1rem;width:3.7rem;height:3.7rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(47,91,234,.4);z-index:20}
#fab .ic{width:1.8rem;height:1.8rem;stroke-width:2.4}
#body.nofab #fab{display:none}
@media(min-width:900px){#body.has-side #fab{right:22.2rem}}

/* tabs */
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem 0 .4rem;color:var(--muted);text-align:center}
#tabs em{font-style:normal;font-size:.72rem;font-weight:700}
#tabs button.on{color:var(--accent)}
#tabs button .ic{width:1.6rem;height:1.6rem}

/* banners */
#banner:empty{display:none}
.bn{display:flex;align-items:center;gap:.4rem .6rem;flex-wrap:wrap;margin:.45rem .7rem 0;padding:.45rem .7rem;border-radius:.9rem;font-size:.8rem;background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1.5px solid var(--warn)}
.bn span{flex:1 1 10rem}
.bn.demo{background:var(--accent-soft);border-color:var(--accent)}
.bn button{font-weight:800;color:var(--accent);padding:.3rem .5rem}

/* time grid */
.tg-wrap{height:100%;overflow:auto;position:relative;background:var(--surface);-webkit-overflow-scrolling:touch}
.tg{min-width:var(--tgmin,0);--hw:3.1rem;position:relative}
.tg-top{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-row{display:grid;grid-template-columns:var(--hw) repeat(var(--cols),minmax(0,1fr))}
.gut{position:sticky;left:0;background:var(--surface);z-index:4}
.dh{display:flex;flex-direction:column;align-items:center;padding:.35rem 0 .3rem;border-left:1px solid var(--line);color:var(--muted);font-size:.78rem;font-weight:700;text-transform:capitalize}
.dh b{font-size:1.25rem;line-height:1.4;width:2.1rem;height:2.1rem;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.dh.today{color:var(--accent)}
.dh.today b{background:var(--accent);color:var(--on-accent)}
.adc{border-left:1px solid var(--line);padding:.2rem .15rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.adchip{display:block;width:100%;padding:.15rem .4rem;border-radius:.4rem;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:4px solid var(--c);font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adlab{font-size:.68rem;color:var(--muted);font-weight:700;padding:.35rem .3rem 0 0;text-align:right}
.tg-body{display:grid;grid-template-columns:var(--hw) repeat(var(--cols),minmax(0,1fr));height:calc(var(--hh)*24)}
.tg-hours{position:sticky;left:0;z-index:4;background:var(--surface)}
.tg-hours span{position:absolute;right:.45rem;transform:translateY(-50%);font-size:.72rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% var(--hh),100% calc(var(--hh)/2)}
.tg-col.today{background-color:var(--todaybg)}
.ev{position:absolute;overflow:hidden;border-radius:.6rem;padding:.25rem .45rem;background:var(--surface2);background:color-mix(in srgb,var(--c) 17%,var(--surface));border-left:5px solid var(--c);font-size:.88rem;line-height:1.2;min-height:calc(var(--hh)*.4);z-index:2}
.ev b{display:block;font-weight:720;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;color:var(--muted);font-size:.78em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sm{display:flex;gap:.4rem;align-items:baseline;white-space:nowrap}
.ev.sm b{flex:0 1 auto}.ev.sm .tt{font-size:.76em;color:var(--muted);font-weight:600}
.wk .ev{font-size:.78rem;padding:.2rem .3rem;border-left-width:4px}
.nowline{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:3;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444}

/* week list (phone) */
.wl{padding:.4rem .7rem 6rem}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;margin:.55rem 0;overflow:hidden}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wd-h{display:flex;align-items:center;gap:.7rem;width:100%;padding:.6rem .85rem;border-bottom:1px solid var(--line2)}
.wd-n{font-size:1.5rem;font-weight:800;line-height:1;min-width:2.2rem}
.wd.today .wd-n{color:var(--accent)}
.wd-w{flex:1;font-weight:700;text-transform:capitalize}
.wd-w small{display:block;color:var(--muted);font-weight:600;font-size:.76rem;text-transform:none}
.wd-add{color:var(--accent);width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:.7rem}
.wd .empty{padding:.7rem .85rem;margin:0}

/* rows */
.row{display:flex;align-items:stretch;gap:.7rem;width:100%;padding:.65rem .85rem}
.row+.row{border-top:1px solid var(--line2)}
.row:active{background:var(--surface2)}
.rt{width:3.7rem;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rt b.ad{font-size:.8rem;color:var(--muted);padding-top:.1rem}
.rt b{display:block;font-weight:780;font-size:1rem}
.rt small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.row .bar{width:.3rem;border-radius:.2rem;background:var(--c);flex:none}
.rx{flex:1;min-width:0}
.rx b{display:block;font-size:1.05rem;font-weight:740;line-height:1.25}
.rx small{display:flex;align-items:center;gap:.25rem;color:var(--muted);font-size:.84rem;font-weight:600;margin-top:.1rem}
.rx small .ic{width:.9rem;height:.9rem}
.empty{color:var(--muted);font-weight:600;padding:1rem;margin:0}

/* month */
.mo{padding:.4rem .5rem .5rem}
.mo-h,.mo-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-h span{text-align:center;font-size:.78rem;color:var(--muted);font-weight:750;padding:.4rem 0;text-transform:capitalize}
.mo-g{border-top:1px solid var(--line);background:var(--surface);border-radius:1rem;overflow:hidden;border:1px solid var(--line)}
.mc{min-height:4.6rem;border-top:1px solid var(--line2);border-left:1px solid var(--line2);padding:.25rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:0}
.mc:nth-child(-n+7){border-top:0}.mc:nth-child(7n+1){border-left:0}
.mc .n{width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:1rem}
.mc.today .n{background:var(--accent);color:var(--on-accent)}
.mc.sel{background:var(--accent-soft)}
.mc.out{opacity:.38}
.mc.we .n{color:var(--muted)}
.mc.today.we .n{color:var(--on-accent)}
.mbars{width:100%;display:flex;flex-direction:column;gap:3px;padding:0 .15rem}
.mbar{display:block;height:.38rem;border-radius:.2rem;background:var(--c)}
.mbar span{display:none}
.mmore{font-size:.7rem;color:var(--muted);font-weight:800;text-align:center}
@media(min-width:700px){
  .mo{padding:.6rem .9rem 1rem}
  .mc{min-height:7.4rem;align-items:stretch;padding:.3rem .3rem}
  .mc .n{align-self:flex-start;width:1.9rem;height:1.9rem;font-size:.95rem}
  .mbars{padding:0;gap:2px}
  .mbar{height:auto;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:4px solid var(--c);border-radius:.3rem;padding:.08rem .3rem;font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar span{display:inline}
  .mmore{text-align:left;padding-left:.3rem}
}
.dl{background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;margin:.7rem .5rem 6rem;overflow:hidden}
.dl-h{display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;border-bottom:1px solid var(--line2)}
.dl-h>div{flex:1}.dl-h b{display:block;font-size:1.1rem}.dl-h small{color:var(--muted);font-weight:600}
.dl .btn.blk{width:calc(100% - 1.4rem);margin:.5rem .7rem .7rem}
#main .dl.inmain{display:block}
@media(min-width:900px){#body.has-side #main .dl.inmain{display:none}}

/* month 2 : titres dans les cases */
.mo2{display:flex;flex-direction:column;height:100%;min-height:calc(var(--rows)*5rem + 2.2rem);background:var(--surface)}
.mo2-h,.mw-bg,.mw-fg{display:grid;grid-template-columns:1.5rem repeat(7,minmax(0,1fr))}
.mo2-h{position:sticky;top:0;z-index:2;background:var(--surface);padding:.4rem 0 .3rem;border-bottom:1px solid var(--line);font-size:.74rem;color:var(--muted);font-weight:750;text-align:center;text-transform:capitalize}
.mw{position:relative;flex:1 1 0;min-height:5rem;border-top:1px solid var(--line)}
.mw:first-of-type{border-top:0}
.mw-bg{position:absolute;inset:0}
.mw-fg{position:absolute;inset:0;grid-template-rows:1.5rem;grid-auto-rows:min-content;align-content:start;pointer-events:none;overflow:hidden}
.wn{font-size:.62rem;color:var(--muted);font-weight:700;padding:.35rem 0 0 .25rem}
.bgc{border-left:1px solid var(--line2);display:block;width:100%;height:100%}
.bgc.out{background:var(--surface2)}
.bgc.sel{background:var(--accent-soft)}
.bgc.today{background:var(--todayc);box-shadow:inset 0 0 0 2px var(--accent);border-radius:.35rem}
.mn.today{box-shadow:0 0 0 3px var(--todayc)}
.mn{justify-self:end;align-self:start;font-size:.78rem;font-weight:750;line-height:1.25;padding:.05rem .3rem;margin:.12rem .12rem 0 0;border-radius:999px;min-width:1.45rem;text-align:center}
.mn.today{background:var(--accent);color:var(--on-accent)}
.mn.out{color:var(--muted);opacity:.65}
.mhid{justify-self:start;align-self:start;font-size:.62rem;color:var(--muted);font-weight:800;padding:.3rem 0 0 .25rem}
.mband{display:block;font-style:normal;font-size:calc(.7rem*var(--bsc,1));line-height:1.46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 1px 1px}
.mband{font-weight:700;padding:0 .3rem;border-radius:.3rem;background:var(--c);color:var(--ink)}
.mband.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.mband.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.mcol{display:flex;flex-direction:column;gap:1px;min-width:0;margin:0 .5px;align-self:start;overflow:hidden}
.mcol.l1 .ei{display:none}
.ml{font-style:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--ln,1);white-space:normal;overflow:hidden;overflow-wrap:break-word;word-break:normal;-webkit-hyphens:manual;hyphens:manual;margin:0;font-weight:650;line-height:1.25;padding:0 .06rem 0 .14rem;border-left:2.5px solid var(--c);border-radius:.15rem;background:rgba(127,127,127,.13);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ml em{font-style:normal;color:var(--muted);font-weight:600}
@media(min-width:700px){.mband{font-size:calc(.8rem*var(--bsc,1))}.mn{font-size:.9rem}}
#body.mview #fab{width:3.1rem;height:3.1rem;right:.7rem;bottom:.7rem}
#body.mview #fab .ic{width:1.5rem;height:1.5rem}
@media(min-width:900px){#body.has-side.mview #fab{right:22rem}}

/* side panel */
.sp{padding:1rem}
.sp h3{margin:1rem 0 .4rem;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem}
.mini-h b{font-size:1.05rem;text-transform:capitalize}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini span.w{font-size:.7rem;color:var(--muted);font-weight:700;padding:.2rem 0;text-transform:capitalize}
.mini button{height:2.1rem;border-radius:50%;font-size:.88rem;font-weight:650;position:relative}
.mini button.out{opacity:.35}
.mini button.today{background:var(--accent);color:var(--on-accent)}
.mini button.sel:not(.today){background:var(--accent-soft);color:var(--accent)}
.mini button i{position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mini button.today i{background:var(--on-accent)}
.sp .dl{margin:.4rem 0 0}

/* sheets & dialogs */
#sheet:empty,#dlg:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.dlgov{z-index:80;align-items:center}
.sh{background:var(--surface);width:100%;max-width:40rem;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:1.4rem 1.4rem 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
.sh.full{height:92vh;height:92dvh}
.dlgbox{border-radius:1.3rem;max-width:26rem;margin:1rem;width:calc(100% - 2rem);padding:1.1rem}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:1.4rem;max-height:88vh}.sh.full{height:auto;max-height:90vh}}
.sh-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;color:var(--muted);font-weight:700;font-size:.85rem}
.sh-h .sp1{flex:1}
.sh h2{margin:.1rem 0 .5rem;font-size:1.5rem;line-height:1.2;letter-spacing:-.01em}
.sh h3{margin:1rem 0 .35rem;font-size:1rem}
.cdot{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.x{width:2.5rem;height:2.5rem;border-radius:.8rem;display:grid;place-items:center}
.info{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;border-top:1px solid var(--line2)}
.info .ic{color:var(--muted);margin-top:.1rem}
.info div{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.info b{display:block}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.btn{padding:.75rem 1rem;border-radius:.95rem;font-weight:750;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-align:center}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.blk{display:flex;width:100%;margin-top:.5rem}
.btn.sm{padding:.45rem .75rem;font-size:.85rem}
.btn .ic{width:1.15rem;height:1.15rem}
.grow{flex:1}

/* forms */
.fld{margin:.85rem 0}
.lbl{display:block;font-size:.76rem;color:var(--muted);font-weight:750;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:.85rem;padding:.7rem .8rem;min-height:2.9rem;color:var(--text)}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.in.big{font-size:1.25rem;font-weight:700}
textarea.in{min-height:5rem;resize:vertical}

/* search */

/* toast */
#toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:calc(100% - 2rem);max-width:26rem}

#printzone{display:none}
.mp{display:flex;flex-direction:column;height:190mm;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#2a241c}

.mp-g>.mp-k:first-child{background:none}
.mp-d{text-align:center;padding:6px 2px;border-radius:10px;background:#f4ece0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.mp-d b{display:block;font-size:12pt}.mp-d span{font-size:9.5pt;color:#6b5f4f}
.mp-d.we,.mp-w.we .mp-c{background:#eef4fb}.mp-d.td{background:#c0682e;color:#fff}.mp-d.td span{color:#fff}
.mp-w{min-height:0;display:flex}.mp-w.td .mp-c{border-color:#c0682e;border-width:2px}

.mp-c.mp-e{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f6f1e9 6px,#f6f1e9 12px);border-style:dashed}
.mp-i{font-size:22pt;line-height:1}.mp-c b{font-size:11pt;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.mp-c small{font-size:8.5pt;color:#6b5f4f;white-space:nowrap}.mp-c em{font-style:normal;font-size:8.5pt;font-weight:700;padding:1px 7px;border-radius:999px;background:#fff;border:1.5px solid var(--c);color:#2a241c}
.mp-f{text-align:right;font-size:8pt;color:#8a7f70;margin-top:5px}
/* mise en page des impressions (écran = capture PDF, papier = @media print) */
.pz h1{font-size:20pt;margin:0 0 .5rem;font-weight:800}.pz h1 small{font-size:12pt;font-weight:600;color:#444;margin-left:.4rem}

.pz .pr-e{margin:.2rem 0;color:#666}

.pz .pr-t{flex:0 0 3.4rem;font-size:10.5pt}.pz .pr-t small{display:block;font-weight:500;color:#444}
.pz .pr-b{flex:0 0 5px;align-self:stretch;border-radius:3px;background:var(--c)}
.pz .pr-x{flex:1;min-width:0}.pz .pr-x small{display:block;color:#333;font-size:9.5pt}.pz .pr-n{white-space:pre-line;color:#444}
.pz .mo2{display:flex;flex-direction:column;height:166mm;min-height:0}
.pz .mo2-h{position:static;padding:.2rem 0;border-bottom:1.5px solid #000;color:#000}
.pz .mw{flex:1 1 0;min-height:0;overflow:hidden;border-top:1px solid #8a8f98}
.pz .mcol{font-size:8pt!important}
.pz .mo2.big .mcol{font-size:10pt!important}.pz .mo2.big .mband{font-size:10.5pt}
.pz .mhid{font-size:8pt}
.pz .mband{border:1px solid rgba(0,0,0,.4)}
.pz .ml{background:#fff;border:1px solid #bbb;border-left:3px solid var(--c);color:#000}
.pz .mband,.pz .ml{font-size:8.5pt}.pz .mn{font-size:10pt}
.pz .bgc.sel,.pz .bgc.today{background:none;box-shadow:none}
.pzshot{position:absolute;left:-30000px;top:0;background:#fff;color:#000;box-sizing:border-box;padding:10mm;font-size:11pt;line-height:1.3;--bg:#fff;--surface:#fff;--surface2:#eef0f4;--text:#000;--muted:#444;--line:#8a8f98;--line2:#c9ccd2;--accent:#2f5bea;--on-accent:#fff;--accent-soft:rgba(47,91,234,.1)}
.pzshot.land{width:297mm;height:210mm}.pzshot.port{width:210mm;height:297mm}
@media print{
 html{font-size:17px!important}
 html,body{height:auto!important;background:#fff!important;color:#000!important;overflow:visible!important}
 #app,#sheet,#dlg,#toast{display:none!important}
 #printzone{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11pt;line-height:1.3;
  --bg:#fff;--surface:#fff;--surface2:#eef0f4;--text:#000;--muted:#444;--line:#8a8f98;--line2:#c9ccd2;--accent:#2f5bea;--on-accent:#fff;--accent-soft:rgba(47,91,234,.1);color:#000;background:#fff}
}

.icorow{display:flex;flex-direction:column;gap:.5rem}
.icoin{width:5rem;text-align:center;font-size:1.5rem;padding:.35rem}
.icos{gap:.35rem}
.chip.ico{padding:.3rem .5rem;font-size:1.3rem;min-width:2.6rem;justify-content:center}

.mo2.fort .mband{font-size:calc(.66rem*var(--bsc,1))}

@media(min-width:700px){.mo2.fort .mband{font-size:calc(.9rem*var(--bsc,1))}}
#tabs em{white-space:nowrap}

.mn{white-space:nowrap}

/* choisir quoi envoyer */
.selbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}

/* ===== Adaptation à l'appareil : téléphone, tablette, ordinateur, grand écran ===== */

@media(min-width:1700px){:root{--dev:1.18}}
@media(min-width:2200px){:root{--dev:1.35}}
/* grande tablette / ordinateur : onglets en colonne à gauche */
@media(min-width:1000px) and (min-height:560px){
  #app{display:grid;grid-template-columns:5.4rem minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  #top{grid-column:2;grid-row:1}
  #banner{grid-column:2;grid-row:2}
  #body{grid-column:2;grid-row:3}
  #tabs{grid-column:1;grid-row:1/-1;flex-direction:column;justify-content:flex-start;gap:.25rem;border-top:0;border-right:1px solid var(--line);padding:.8rem .35rem}
  #tabs button{flex:none;padding:.75rem 0 .6rem;border-radius:.9rem}
  #tabs button.on{background:var(--accent-soft)}
  #tabs em{font-size:.74rem}
}
/* souris : survol */
@media(hover:hover) and (pointer:fine){
  .ib:hover,.pill:hover,#tabs button:hover{background:var(--surface2)}
  #tabs button.on:hover{background:var(--accent-soft)}
  .btn:hover{filter:brightness(.97)}
  .selrow:hover,.rowx:hover{background:var(--surface2)}
}
/* réglages : une seule colonne centrée sur grand écran (les colonnes CSS dédoublaient des cartes sur iPad) */
@media(min-width:900px){
  .sgrid{max-width:46rem;margin:0 auto;padding:0 .8rem}
}
/* intercalaires des listes à l'horizontale sur iPad et ordinateur : le nom se lit en entier */
@media(min-width:900px){
  body .co-tabs{width:9.5rem}

  body .co-tab.on{width:100%}
  body .co-tn{white-space:normal;overflow-wrap:anywhere;line-height:1.2;padding-right:1.6rem}.co-tw{white-space:normal;line-height:1.2}
  body .co-tc{position:absolute;top:.45rem;right:.4rem}
  body .co-tadd{align-items:center;min-height:2.2rem}
}
/* petits écrans en paysage : on gagne de la hauteur */
@media(max-height:480px) and (orientation:landscape){
  #top{padding-top:calc(env(safe-area-inset-top,0px) + .25rem);padding-bottom:.25rem}
  #tabs button{padding:.25rem 0 .2rem}#tabs em{display:none}
}

<script>

const ICS_FILE='agenda.ics';
const CHANGELOG=[
 {v:'2.17.0',d:'31/10/2026',items:[
  '📅 Catégories communes : quand tu partages une catégorie (Réglages → Catégories), elle apparaît chez l’autre avec son nom et sa couleur (« 📥 de Damien »), ses rendez-vous s’affichent comme les siens, et il ou elle peut en ajouter, modifier ou supprimer : tout revient chez toi. Vous partagez ainsi un vrai agenda à deux, dans les deux sens.',

  '🔒 Les rendez-vous « Privé », les notes et les rappels restent toujours sur ton téléphone.']},
 {v:'2.16.1',d:'31/10/2026',items:[
  '📱 iPad : les Réglages s’affichent sur une seule colonne bien rangée (avant, sur iPad, des cartes apparaissaient en double ou coupées).',

 {v:'2.16.0',d:'31/10/2026',items:[
  '🧳 Programme du voyage en grille horaire : de 7 h à 23 h, en cases de 30 minutes (matin, après-midi, soir colorés). Touche une case pour ajouter une activité et choisis sa durée (2 h = 4 cases). Fais glisser un bloc pour le déplacer (même sur un autre jour), tire la poignée du bas pour changer la durée, touche-le pour le modifier. Deux activités en même temps se mettent côte à côte. Les repas apparaissent en léger.',

  '🖨 Impression du voyage : la grille horaire de tous les jours, avec les listes (☑ pris / ☐ reste) et les infos, sur une page A4 en paysage.']},
 {v:'2.15.1',d:'31/10/2026',items:[
  '🧳 Programme du voyage : les étapes avec heure se rangent dans la bonne case (avant 12 h → Matin, 12 h–18 h → Après-midi, après 18 h → Soir). « ＋ Ajouter » dans une case ouvre la même fenêtre complète : heure (facultative), quoi, détails. Plusieurs choses possibles par case.']},
 {v:'2.15.0',d:'31/10/2026',items:[
  '🧳 Voyage : dans le Programme, « ＋ Étape à une heure précise » (09:30 Visite du château, 12:30 Pique-nique…), avec une note. Les étapes s’affichent dans l’ordre des heures, aussi dans l’agenda.',

  '🖨 Tâches : « Imprimer » propose « La semaine en agenda » : une page A4 en paysage avec les 7 jours et leurs tâches (y compris celles qui reviennent), plus les tâches en retard et sans date. Tu choisis la semaine.',

 {v:'2.14.4',d:'31/10/2026',items:[
  '🎂 Vue mois : en touchant un jour, la fenêtre affiche maintenant les anniversaires (prénom et âge), les tâches, les repas et les voyages de ce jour, plus seulement les rendez-vous.']},
 {v:'2.14.3',d:'31/10/2026',items:[
  '🎨 Les couleurs de l’agenda sont toujours celles des catégories (l’option « Calendrier Outlook » est retirée, elle prêtait à confusion).',

 {v:'2.14.2',d:'31/10/2026',items:[
  '🎨 Couleurs des catégories : touche la pastille de couleur pour choisir dans une palette AgenDam (plus fiable que la roue de couleurs de l’iPhone, qui ne prévenait pas toujours l’appli). La couleur change aussitôt partout : agenda, choix de catégorie, rendez-vous.',
  '🎨 Si « Couleur des événements » est réglé sur « Calendrier Outlook », un message l’indique dans Catégories, avec un bouton pour revenir aux couleurs des catégories.']},
 {v:'2.14.1',d:'31/10/2026',items:[

 {v:'2.14.0',d:'31/10/2026',items:[
  '📅 Agenda partagé (famille connectée) : dans le partage avec une personne, « 📅 Agenda » : rien, certaines catégories, ou tout. Option « Occupé » pour ne montrer que les créneaux, sans les détails. Ses rendez-vous apparaissent dans ton agenda à sa couleur, avec son prénom, en lecture seule (« Copier dans mon agenda » si besoin). Les notes ne sont jamais envoyées.',

 {v:'2.13.0',d:'31/10/2026',items:[
  '🍽 Recettes plus belles : des cartes avec photo (ou une grande icône colorée), rangées par 🥗 Entrées, 🍲 Plats, 🍰 Desserts, 🥂 Apéro, 🥐 Petit-déj et triables 🥕 Végétarien, 🥩 Viande, 🐟 Poisson. L’appli devine toute seule pour tes recettes ; tu peux corriger dans « Modifier ».',

 {v:'2.12.6',d:'31/10/2026',items:[
  '🍽 Recettes importées : le nombre de personnes change bien les quantités, même quand le site écrit l’ingrédient à l’envers (« Chocolat noir - 200 grammes », « Oeufs - 3 », « Farine : 50 g »). Les recettes déjà importées sont corrigées toutes seules. Attention : les quantités écrites dans les étapes ne changent pas, un message le rappelle quand tu changes le nombre de personnes.',

 {v:'2.12.5',d:'31/10/2026',items:[

 {v:'2.12.4',d:'31/10/2026',items:[

 {v:'2.12.2',d:'31/10/2026',items:[
  '📜 Suivi par groupe : en haut du Suivi, « Tous les groupes / 👪 Famille / 💼 Travail… / 🙋 Perso » pour ne voir que ce qui a été fait dans un groupe. ⚙ range chaque liste dans un groupe (sinon l’appli devine d’après qui fait les tâches). L’export Excel indique le groupe.']},
 {v:'2.12.1',d:'31/10/2026',items:[
  '📑 Listes sur le côté : la rangée de boutons en haut de Tâches est réduite (prénoms + « ⋯ Plus »), le Suivi ne répète plus les listes : plus de place pour les tâches.',
  '🗑 Suivi : chaque ligne peut être supprimée définitivement, et « Supprimer les tâches archivées » fait le ménage d’un coup.',
  '🎬 Mode démo complet : tâches, courses, recettes, menu, anniversaires et voyage d’exemple.']},
 {v:'2.12.0',d:'31/10/2026',items:[
  '👥 Une tâche peut être confiée à plusieurs personnes : la première qui la fait la coche.',
  '✓ Qui a fait quoi : quand quelqu’un coche une tâche, son prénom et l’heure s’affichent (« ✓ par Morgann 31 oct. 18:30 »). Après avoir coché : « 📝 Ajouter une note » (ex. « fait avec Paul »).',
  '📜 Nouvel onglet « Suivi » dans Tâches : l’historique de tout ce qui a été fait, par qui, quand, avec les notes, par liste et par personne. Exportable pour Excel. Les tâches qui reviennent gardent aussi leur historique.',
  '🗄 « Archiver les tâches faites » : elles quittent les listes mais restent dans le Suivi.']},
 {v:'2.11.0',d:'31/10/2026',items:[
  '🎉 Cartes d’anniversaire plus belles : 8 décors (Ballons, Guirlande, Gâteau, Fleurs, Arc-en-ciel, Bulles, Étoiles, Chic), un cadre, et le titre au choix (Joyeux anniversaire, Bon anniversaire, Happy birthday, Bonne fête).',
  '📷 Avec une photo : 5 mises en page (Rond, Cœur, Carré, Polaroïd, Plein écran) et 5 effets (Normal, Vif, Chaud, Noir et blanc, Sépia).']},
 {v:'2.10.2',d:'31/10/2026',items:[
  '🔗 Importer une recette, beaucoup plus simple sur iPhone : dans Safari, Partager ⬆️ → Copier, puis dans AgenDam « 🔗 Importer avec un lien » → « 📋 Coller le lien ». AgenDam lit la recette tout seul (nom, portions, temps, ingrédients, étapes). Plus besoin du favori.']},
 {v:'2.10.1',d:'31/10/2026',items:[
  '📑 Tâches : les listes (Maison, Perso…) passent aussi en intercalaires sur le côté, comme les courses.',
  '⚙ Réglages → Affichage → « Listes (Tâches et Courses) » : sur le côté (intercalaires) ou en haut (boutons), au choix.']},
 {v:'2.10.0',d:'31/10/2026',items:[
  '👪🎉 Plusieurs groupes connectés en parallèle : Famille, Amis, Coloc… « ＋ Nouveau groupe », chacun avec son code d’invitation. Ce que tu reçois d’un groupe n’est jamais renvoyé à un autre.',
  '⚙ Réglages : « Famille et contacts » et « Famille connectée » sont réunis dans une seule carte, plus claire : qui utilise ce téléphone, tes contacts, puis tes groupes et leurs membres.',
  '🗑 Une personne retirée peut maintenant être supprimée définitivement de la liste.']},
 {v:'2.9.1',d:'31/10/2026',items:[
  '📑 Courses comme un carnet : tes listes sont des intercalaires sur le côté droit. Chaque intercalaire porte le nom de la liste et de la personne avec qui elle est partagée (👥 Morgann) ou de qui elle vient (📥), dans sa couleur.',
  '📒 Ma liste type plus rapide : produits sur 2 colonnes, lettres A B C… sur le côté pour sauter directement, rangement A → Z, par rayon ou « ⭐ Les plus achetés ».']},
 {v:'2.9.0',d:'31/10/2026',items:[
  '🛒 Courses repensées : deux onglets, « 🛒 À acheter » (la liste actuelle) et « 📒 Ma liste type » (tous tes produits habituels, de A à Z). Dans la liste type, un toucher ajoute l’article à la liste choisie, un second le retire. Recherche, ajout par collage depuis Notes, ✏️ Modifier pour retirer un produit.',
  '📒 Ta liste est très longue ? « Tout ranger dans ma liste type » : la liste à acheter redevient vide.',
  '🛒 Plusieurs listes de courses (Leclerc, Marché, Pharmacie…) : « ＋ Nouvelle liste ». « 👥 Partager » choisit avec qui chaque liste est partagée. En haut, « Avec : Morgane » montre les listes partagées avec elle ou lui.',
  '🛒 Un onglet Courses rien que pour elles, en bas : Agenda · Tâches · Courses · Repas · Anniv. · Voyages. Les courses ne se mélangent plus aux tâches.',
  '⚙ Réglages → Affichage → Onglets en bas : cache ceux dont tu ne te sers pas.',
  '💻 L’appli s’adapte à l’écran : sur iPhone une colonne ; sur tablette à l’horizontale et sur ordinateur, les onglets passent sur le côté et l’écran se remplit mieux. Courses : « À acheter » et « Ma liste type » côte à côte. Tâches, anniversaires, menu de la semaine et recettes : en plusieurs colonnes.']},
 {v:'2.8.1',d:'31/10/2026',items:[
  '🔄 Messages de mise à jour plus précis : « Morgane a mis à jour 🛒 Courses : ajouté « lait », coché « Pain » », avec un bouton « Voir » qui ouvre directement la bonne liste.',
  '🛒 Les courses rapides (⭐ habituels, 📋 listes types, 🔁 refaire mes dernières courses) s’affichent aussi dans Tâches → Courses, plus seulement dans Repas → Courses.']},
 {v:'2.8.0',d:'31/10/2026',items:[
  '🔒 Famille connectée : c’est toi qui choisis, pour chaque personne, ce que tu partages avec elle (courses, tâches : toutes ou seulement les siennes, repas, anniversaires, voyages). Au départ, rien n’est partagé. Chacun fait pareil de son côté.',
  '👥 Réglages → Famille connectée : la liste des personnes connectées, ce que tu leur partages et ce qu’elles te partagent. « Choisir » pour changer, « Retirer » pour couper : ce que tu avais partagé disparaît de son téléphone.',
  'Ce que tu partages avec une personne est chiffré avec une clé à vous deux : les autres membres et le serveur ne peuvent pas le lire.',
  '🎂 Anniversaires : « ☑ Sélectionner », touche ceux que tu veux, puis « 📤 Envoyer » ou « 🔄 Partager avec… » quelqu’un de ta famille connectée (par exemple, les anniversaires de ses copains). Dans « Choisir », Anniversaires : aucun, certains ou tous.',
  '📱 Plusieurs appareils (iPhone, iPad, Android, ordinateur) : rejoins la famille avec le code depuis ton autre appareil, puis coche « C’est un autre appareil à moi » : tout se synchronise entre tes appareils.',
  '🔢 Code d’invitation : « Juste le code par SMS » envoie un SMS qui ne contient que le code. Et dans « Rejoindre avec un code », on peut coller tout le message reçu : l’appli trouve le code toute seule.']},
 {v:'2.7.1',d:'31/10/2026',items:[
  '🔢 Rejoindre la famille connectée avec un code (ex. K7P4-9QX2), directement dans l’appli de l’écran d’accueil : plus besoin de lien qui s’ouvre dans Safari. Réglages → Famille et contacts → « 🔢 Code d’invitation » pour le donner, « 🔢 Rejoindre avec un code » pour le taper. Valable 7 jours.']},
 {v:'2.7.0',d:'31/10/2026',items:[
  '🔄 Famille connectée : tes listes (tâches, courses, menus, recettes, anniversaires, voyages) se mettent à jour toutes seules chez ta famille, à l’ouverture de l’appli et toutes les minutes quand elle est ouverte. Réglages → Famille et contacts → « Créer notre famille connectée », puis invite tes proches avec le lien. Sans compte.',
  '🔒 Chiffré de bout en bout : le petit serveur ne garde que des données illisibles. La clé ne voyage que dans le lien d’invitation. L’agenda (rendez-vous) reste sur chaque téléphone.']},
 {v:'2.6.0',d:'31/10/2026',items:[
  '🛒 Courses rapides : « ⭐ Mes habituels », les articles que tu achètes le plus, se remplissent tout seuls. Un toucher ajoute, un second retire.',
  '📋 Listes types (courses de la semaine, apéro, barbecue…) : crée-les en collant ta liste depuis Notes, ou « Enregistrer comme liste type ». Un toucher les ajoute aux courses, tu décoches ce que tu as déjà.',
  '🔁 « Refaire mes dernières courses » remet ce que tu as acheté la dernière fois (après « Vider le chariot »).',
  'Quand tu tapes un article, l’appli te propose ceux que tu as déjà achetés. Boutons − / + pour changer la quantité.']},
 {v:'2.5.5',d:'31/10/2026',items:[
  '📤 Le bouton « Envoyer » est maintenant toujours visible en haut de l’écran, en couleur, dans Tâches, Anniversaires, Repas (menu, recettes, courses) et Voyages. Il envoie ce que tu as sous les yeux.']},
 {v:'2.5.4',d:'31/10/2026',items:[
  'Avant le premier envoi ou la première invitation, l’appli te demande à qui est ce téléphone (pour ne plus signer avec un mauvais prénom). Dans chaque envoi, un bouton « Envoyé au nom de… : changer » permet de corriger tout de suite.']},
 {v:'2.5.3',d:'31/10/2026',items:[
  '👪 « Inviter ma famille » (Réglages → Famille et contacts) : envoie par SMS le lien de l’appli et les 3 étapes pour l’installer et vous relier.',
  'Fiche de présentation entièrement refaite pour l’organisateur, avec un guide « Partager avec sa famille » en 3 étapes.']},
 {v:'2.5.2',d:'31/10/2026',items:[
  '📤 Un seul bouton « Envoyer » partout (tâches, courses, menu, recettes, anniversaires, voyages). En haut, tes proches enregistrés dans Famille et contacts : « 💬 SMS à … » en un geste.',
  'Le message envoyé contient le texte lisible (même sans AgenDam) et le lien qui met à jour l’AgenDam de la personne. Il reste aussi WhatsApp et les autres applis, le fichier Excel (.csv) et « Copier ».']},
 {v:'2.5.1',d:'31/10/2026',items:[
  '🔗 Recettes : « Importer avec un lien » — colle le lien (Marmiton, 750g, Cookidoo…), l’appli ouvre la page et ton favori 📥 AgenDam fait le reste.',
  '📄 Exporter, dans chaque onglet : tes tâches, tes anniversaires, tes recettes (une ou toutes) et tes voyages partent en texte vers Notes, Messages ou un mail (lisible même sans AgenDam), ou en fichier Excel (.csv).']},
 {v:'2.5.0',d:'31/10/2026',items:[
  '🌐 Recettes : importe-les depuis les sites (Marmiton, 750g, Cuisine Actuelle, Cookidoo pour le Thermomix…) grâce à un bouton « 📥 AgenDam » à mettre dans tes favoris. Sur la page d’une recette, un geste suffit : le nom, les ingrédients, les étapes, le temps et les portions arrivent dans ton carnet. Repas → Recettes → « Importer depuis un site » explique comment l’installer.',
  'Thermomix : les recettes Thermomix sont reconnues (étiquette Thermomix), et les réglages des étapes (« 5 min/100°C/vitesse 1 », Varoma, sens inverse…) sont mis en valeur.',
  '👩‍🍳 Mode cuisine plein écran : les ingrédients à cocher, puis une étape à la fois en gros caractères, avec Précédente / Suivante. L’écran reste allumé pendant que tu cuisines (quand le téléphone le permet).',
  'Les anniversaires s’importent aussi depuis Word, Excel, un calendrier ou une liste collée (version 2.4).',
  'Importer seulement ce que tu veux : quand tu reçois un partage (tâches, anniversaires, recettes, menu, voyage), « Choisir ce que j’importe… » te laisse cocher les éléments un par un. Les listes collées (Tâches → « Importer une liste », Voyages → « Coller depuis Notes ») passent aussi par une liste à cocher.']},
 {v:'2.4.0',d:'31/10/2026',items:[
  '📥 Anniversaires : importe-les depuis presque n’importe quoi. Un document Word (.docx), un tableau Excel ou CSV, un calendrier (.ics), tes contacts (.vcf), ou une liste copiée-collée (Notes, mail, PDF ouvert…).',
  'L’appli reconnaît les dates écrites de plein de façons (12/03, 12/03/1950, 12 mars, 2016-12-05) et les listes rangées par mois. Tu vérifies et décoches avant d’importer ; ce qui est déjà dans ta liste est ignoré.']},
 {v:'2.3.1',d:'31/10/2026',items:[
  'Carte d’anniversaire : choisis qui signe (ton prénom, toi et ton conjoint, Papa, Maman, Papi, Mamie, Toute la famille, la famille + nom, sans signature ou ton propre texte). L’appli se souvient de ton choix.',
  'Réglages → Famille et contacts → « Ce téléphone est à » : indique à qui est le téléphone. Ce prénom signe les cartes et s’affiche chez les autres quand tu partages.']},
 {v:'2.3.0',d:'30/10/2026',items:[
  '🧳 Nouvel onglet Voyages : pour chaque voyage, des listes à cocher (valise, valise enfant, maison avant de partir, papiers, trousse de secours…), le programme jour par jour (matin, après-midi, soir), les repas du séjour (reliés à l’onglet Repas et à la liste de courses) et les infos (adresse avec itinéraire, trajet, réservations, numéros utiles, budget).',
  '📝 Colle une liste depuis Notes : une ligne devient une case à cocher. Toute liste peut devenir un modèle réutilisable.',
  'Un voyage se partage par lien avec la famille, avec ses listes, son programme et ses repas. Il apparaît aussi dans l’agenda pendant le séjour.',
  'Agenda : touche le titre (la date) pour aller directement au jour de ton choix.',
  'Dupliquer : touche tous les jours où copier l’événement, en une fois. La catégorie est bien gardée.',
  'iPad : les réglages « Options complémentaires » (horaires de travail…) s’affichent correctement en paysage, et le déplacement d’un rendez-vous dans la vue Jour marche aussi pour les événements récupérés d’Outlook.']},
 {v:'2.2.0',d:'30/10/2026',items:[
  '🎉 Souhaiter un anniversaire : touche 🎉 à côté d’une personne. Choisis un ton (tendre, drôle, simple, enfant, grands-parents, en rimes, collègue), l’appli écrit le message avec son prénom et son âge. 🔀 en propose un autre, tu peux tout modifier.',
  'Une jolie carte en image (ballons, gâteau, fleurs ou étoiles), avec sa photo si tu veux, part avec le message dans Messages, WhatsApp ou par mail.',
  'Le jour J, le bouton « Souhaiter » apparaît à l’ouverture et dans l’agenda. La fiche garde la date du message envoyé.',
  'Chaque anniversaire peut être relié à un contact (SMS en un geste) et avoir une photo. Les photos sont gardées dans l’appli et dans ta sauvegarde .json.',
  'Restaurer avec « Fusionner » ajoute aussi les tâches, anniversaires, recettes et menus de la sauvegarde.']},
 {v:'2.1.0',d:'30/10/2026',items:[
  '🍽 Nouvel onglet Repas : le menu de la semaine (midi et soir, qui cuisine, combien on est), ton carnet de recettes et la liste de courses rangée par rayon.',
  'Recettes : crée-les ou colle-les depuis Notes, un site ou un message, l’appli trouve les ingrédients et les étapes. Portions ajustables, favoris, étiquettes, recherche par ingrédient.',
  '🛒 Les ingrédients d’une recette ou de toute la semaine passent en courses en un geste : tu décoches ce que tu as déjà, les quantités identiques s’additionnent.',
  'Tout se partage par lien : une recette, le menu de la semaine ou la liste de courses. Le menu du jour apparaît aussi dans l’agenda.']},
 {v:'2.0.0',d:'30/10/2026',items:[
  'AgenDam devient l’organisateur de la famille, avec une nouvelle apparence « carnet » : papier crème, encre bleue et un intercalaire de couleur par onglet.',
  'Nouveaux onglets en bas : 📅 Agenda, ☑ Tâches, 🎂 Anniversaires. Dans Agenda, choisis l’affichage en haut : Jour, Semaine, 2 sem. ou Mois. La recherche est en haut (loupe).',
  'Les anniversaires ont leur propre onglet (ajout, tri, idées cadeaux, partage, rappels).',
  'Nouvelle fiche de bienvenue.']},
 {v:'1.18.0',d:'30/10/2026',items:[
  '👪 Famille et contacts : prénom, nom, qui c’est (conjoint(e), enfant, parent, ami(e)…), téléphone, mail et couleur. Ils servent à distribuer les tâches. Réglages → Famille et contacts, ou « 👪 Famille » dans Tâches.',
  '📤 Partager : envoie une liste de tâches (ou toutes, ou celles d’une personne) et tes anniversaires par SMS, WhatsApp ou mail. La personne touche le lien et son AgenDam se met à jour : ajouts, modifications, tâches cochées et suppressions, sans doublon. Les données voyagent dans le lien, sans aucun serveur.',
  '📥 Recevoir : sur iPhone, si tu utilises l’appli installée sur l’écran d’accueil, copie le lien puis touche « 📥 Recevoir » dans Tâches.']},
 {v:'1.17.0',d:'30/10/2026',items:[
  '☑ Nouvel onglet Tâches : des listes à cocher (Maison, Courses, Perso… et les tiennes), une date si tu veux, qui s’en occupe dans la famille, et les tâches qui reviennent (chaque jour, semaine, 2 semaines, mois).',
  'Une tâche avec une date apparaît aussi ce jour-là dans l’agenda (☑ sur le jour, liste dans la journée). Les tâches en retard s’affichent aujourd’hui.',
  'Impression A4 d’une liste, avec de vraies cases à cocher et des lignes vides pour écrire à la main (PDF sur iPhone et Android).',
  'La synchronisation Outlook est mise en pause : elle créait des doublons. Tes événements déjà récupérés restent dans l’appli. Pour recevoir les rappels sur le téléphone, utilise « Ajouter à mon agenda ».',
  'Doublons : nouveau « Chercher les doublons » (Réglages → Importer un autre calendrier). Il repère le même titre le même jour à la même heure, même si l’emoji ou les majuscules diffèrent, et te laisse cocher ce qu’il faut supprimer.']},
 {v:'1.16.31',d:'30/10/2026',items:[
  'Mode d’emploi « ? » complété : vacances scolaires et lisibilité du mois.']},
 {v:'1.16.30',d:'29/10/2026',items:[
  '🏖 Vacances scolaires : un liseré coloré souligne les jours de vacances de ta zone (A, B ou C) dans le mois, les 2 semaines, la semaine et le mini-calendrier. Le nom des vacances s’affiche sur la journée. Réglages → Vacances scolaires.',
  'Deux façons de remplir : télécharger le calendrier officiel (data.education.gouv.fr, ministère de l’Éducation nationale ; seule la zone est envoyée, mise à jour une fois par mois) ou saisir tes périodes à la main (hors connexion, autre zone, pont…). Les deux peuvent se combiner.',
  'Couleur du liseré au choix (8 couleurs ou n’importe quelle autre).']},
 {v:'1.16.29',d:'29/10/2026',items:[
  'Mois plus lisible : les mots longs sont coupés proprement par syllabes avec un tiret (« Anni-versaire », « Gyné-cologue ») au lieu d’être coupés au hasard (« Anniver / saire »).',
  'Les événements du mois gagnent un peu de place sur les côtés : plus de lettres par ligne.',
  'Nouveau réglage : Réglages → Affichage → « Texte des événements dans le mois » : Petit, Normal ou Grand.']},
 {v:'1.16.28',d:'28/10/2026',items:[
  'Mois : le numéro du jour d’aujourd’hui reste bien lisible (blanc sur fond coloré, en gras), même quand il apparaît dans la semaine d’un autre mois.']},
 {v:'1.16.27',d:'28/10/2026',items:[
  'Événements importants : dans la fiche d’un événement, « Mettre en valeur » te laisse choisir un contour épais, du gras et/ou une étoile ★. Visible dans le mois, la semaine, le jour et les listes.']},
 {v:'1.16.26',d:'28/10/2026',items:[
  'Réglages remis au propre : la carte Outlook est classée par sujet (état, Envoyer / Récupérer, synchronisation, calendriers et catégories, nettoyage), avec des lignes claires et les textes longs repliés sous « Comment ça marche ? ». Même présentation pour Sauvegarde, Calendrier du téléphone, Anniversaires, Importer, Fichier .ics, Guide et Démo. Aucune fonction retirée.']},
 {v:'1.16.25',d:'28/10/2026',items:[
  'Outlook : plus de doublon quand tu ranges dans un autre calendrier un événement venu d’Outlook. Après ton changement, l’appli envoie la nouvelle version dans le bon calendrier et retire l’ancienne d’Outlook. Pour les événements déjà importés avant cette version, fais une fois « Récupérer depuis Outlook » pour que ça marche aussi pour eux.']},
 {v:'1.16.24',d:'28/10/2026',items:[
  'Fiche d’un événement : quand tu l’as rangé dans un calendrier Outlook, son nom s’affiche en haut (à la place de « Sans catégorie »). Si l’événement a aussi une catégorie de l’appli, les deux sont indiqués.']},
 {v:'1.16.24',d:'28/10/2026',items:[
  'Outlook : la fiche d’un événement indique maintenant son calendrier Outlook (ex. « Extra commun famille ») et son étiquette. Avant, seule la couleur changeait et le titre du haut (la catégorie de l’appli) restait « Sans catégorie », ce qui donnait l’impression que le choix n’était pas pris en compte.']},
 {v:'1.16.23',d:'28/10/2026',items:[
  'Correction : sur un événement venant d’Outlook, le choix du calendrier et des étiquettes Outlook réapparaît dans l’éditeur (il avait disparu en 1.16.22).']},
 {v:'1.16.22',d:'28/10/2026',items:[
  'Outlook : quand tu rouvres un événement pour le modifier, le calendrier Outlook et l’étiquette choisis sont maintenant bien retrouvés (avant, l’éditeur retombait sur « Agenda (appli) » et un nouvel enregistrement écrasait ton choix).']},
 {v:'1.16.21',d:'28/10/2026',items:[
  'Anniversaires : la protection ne cache plus que les idées cadeaux. Le nom, la date et l’âge d’une personne protégée restent toujours visibles (liste, jour, rappel, PDF, calendrier du téléphone) ; une icône 🔒 indique qu’elle est protégée. Sa fiche (avec les idées cadeaux) ne s’ouvre qu’avec le code ou Face ID.']},
 {v:'1.16.20',d:'28/10/2026',items:[
  'Anniversaires : la liste se trie au choix — « Prochains » (par date à venir), « A → Z » (ordre alphabétique avec lettres) ou « Par mois » (janvier à décembre). Un champ de recherche permet de retrouver un prénom tout de suite. Les personnes protégées verrouillées restent à la fin du tri alphabétique.']},
 {v:'1.16.19',d:'28/10/2026',items:[
  'Anniversaires : les idées cadeaux d’une personne protégée ne s’affichent plus jamais dans la liste ni dans le rappel : on ne les voit que dans sa fiche, une fois le code (ou Face ID) saisi.',
  'Le déverrouillage ne dure que 2 minutes, et la liste se reverrouille quand tu la fermes. Après la création du code, la personne protégée est cachée tout de suite. Pour changer ou retirer le code, il faut d’abord le saisir.']},
 {v:'1.16.18',d:'28/10/2026',items:[
  'Anniversaires : la protection se choisit personne par personne. Dans la fiche, la case « 🔒 Protéger cette personne » cache son nom et ses idées cadeaux (liste, bandeau du jour, rappel, PDF) tant que le code ou Face ID n’a pas été utilisé. Les autres personnes restent visibles sans code. Les personnes protégées ne sont pas envoyées au calendrier du téléphone.',
  'PDF des anniversaires corrigé : il est maintenant écrit directement en texte (léger, accents corrects, plusieurs pages si besoin), ce qui évite le blocage sur « Préparation du PDF… » sur iPhone.']},
 {v:'1.16.17',d:'28/10/2026',items:[
  'Anniversaires : le bouton « Ajouter » est maintenant tout en haut de la liste.',
  'Idées cadeaux en liste à cocher : une ligne par idée, tu coches quand c’est acheté. L’ancienne note (« - vélo - planète ») est transformée toute seule en liste. Les idées restantes apparaissent dans la liste et dans le rappel à l’ouverture.',
  'Code de protection facultatif (4 à 8 chiffres) : les noms sont cachés dans la liste, le bandeau du jour et le rappel tant que le code n’est pas saisi. L’appli se reverrouille quand tu la quittes. Ce n’est pas un chiffrement (voir le mode d’emploi).',
  'Face ID (iPhone) ou empreinte / visage (Android) pour déverrouiller les anniversaires, en plus du code (le code reste le secours).',
  'Impression / PDF de tous les anniversaires, classés par mois, avec les idées cadeaux (cases ☐ / ☑).']},
 {v:'1.16.16',d:'28/10/2026',items:[
  '🎂 Anniversaires : une liste à part (Réglages → Anniversaires), pour ne plus polluer l’agenda sans jamais les oublier. Nom, jour, mois, année facultative (l’âge se calcule tout seul), note (idée cadeau).',
  'Un 🎂 apparaît sur le jour concerné (mois, 2 semaines, semaine, jour). À l’ouverture, l’écran « À venir » annonce les anniversaires proches (le jour J, la veille, 3 jours ou 1 semaine avant, au choix).',
  'Tes événements « anniversaire » existants (agenda, catégorie, calendrier Outlook « Anniversaires ») peuvent être déplacés d’un coup dans la liste, avec une liste à cocher.',
  'Import des anniversaires depuis tes contacts (fichier .vcf exporté depuis iPhone, Android, Google ou Outlook).',
  'Export vers le calendrier du téléphone (iPhone, Android, ordinateur) : un événement qui revient chaque année, avec alarme la veille à 18 h et le jour même à 9 h.']},
 {v:'1.16.15',d:'28/10/2026',items:[
  'Vue Jour : trois affichages en haut — « Heures » (grille habituelle), « Jour entier » (toute la journée tient à l’écran, chaque événement avec son horaire) et « Liste » (tous les événements triés avec leurs horaires, les plages libres et les chevauchements signalés).',
  'Vue Jour : appui long sur un bloc, puis glisse vers le haut ou le bas pour le déplacer (par pas de 15 minutes). Valable pour les événements d’une seule journée, sans répétition, créés dans l’appli.',
  'Avertissement de chevauchement : quand tu enregistres un événement avec horaires pendant un autre, l’appli te prévient (« Attention : horaire déjà pris ») et te laisse choisir. Idem après un déplacement.']},
 {v:'1.16.14',d:'28/10/2026',items:[
  'Couleurs et noms des calendriers Outlook : mis à jour automatiquement à l’ouverture et après chaque envoi/récupération (plus besoin d’ouvrir la gestion des calendriers). Les anciennes couleurs mémorisées dans l’appli ne cachent plus celles d’Outlook.',
  'Calendriers à « couleur automatique » (Outlook choisit sans la communiquer) : nouveau bouton « Fixer les couleurs automatiques » dans la gestion des calendriers, pour que Outlook et l’appli affichent la même couleur.']},
 {v:'1.16.13',d:'28/10/2026',items:[
  'Outlook : dans la liste « Importer depuis Outlook », le bouton « Ne plus proposer les décochés » retire définitivement les événements que tu ne veux pas (jours fériés, anniversaires…). Ils ne reviennent plus à chaque ouverture. Réglages → Outlook → « Tout reproposer » annule. Pour un calendrier entier, décoche-le dans « Importer depuis Outlook ».']},
 {v:'1.16.12',d:'28/10/2026',items:[
  'Couleur des événements : nouveau réglage (Réglages → Affichage) « Catégorie » ou « Calendrier Outlook ». Sur « Calendrier Outlook », chaque événement (importé ou envoyé) prend la couleur de son calendrier Outlook dans le jour, la semaine, le mois et la liste.',
  'Calendriers Outlook : en plus des 10 couleurs d’Outlook, tu peux choisir une couleur libre (sélecteur de couleur) qui sert dans l’appli.']},
 {v:'1.16.11',d:'27/10/2026',items:[
  'Outlook : partager un calendrier par adresse mail. Réglages → Outlook → « Gérer mes calendriers Outlook » → bouton « Partager » : tu saisis l’adresse, tu choisis « Peut modifier » ou « Lecture seule », et Outlook envoie l’invitation. Tu vois aussi avec qui c’est partagé et tu peux retirer un partage. Si Outlook refuse, l’appli te l’explique (reconnexion ou partage depuis Outlook).']},
 {v:'1.16.10',d:'27/10/2026',items:[
  'Outlook → appli : « Récupérer depuis Outlook » repère maintenant aussi les événements supprimés dans Outlook (par exemple par ta femme sur un calendrier partagé) et te propose de les retirer de l’appli, après confirmation. Les événements récupérés avant cette version sont reconnus à la prochaine récupération.',
  'Nouveau réglage « À l’ouverture : récupérer Outlook » → « Me montrer » : à chaque ouverture, une fenêtre te liste ce qui a été ajouté, modifié ou supprimé dans Outlook (rien ne s’affiche s’il n’y a rien de nouveau). « Auto » récupère sans rien demander.']},
 {v:'1.16.9',d:'27/10/2026',items:[
  'Outlook : tu peux maintenant gérer tes calendriers depuis l’appli. Réglages → Outlook → « Gérer mes calendriers Outlook » : créer un calendrier (nom et couleur), le renommer, changer sa couleur, ou le supprimer. La suppression demande de retaper le nom, car elle efface tous les événements du calendrier dans Outlook. Le calendrier par défaut, ceux en lecture seule et ceux d’un autre compte sont protégés.',
  'Doublons : le nettoyage cherche maintenant dans tous tes calendriers Outlook (pas seulement « Agenda (appli) »), repère aussi les titres écrits un peu différemment, et te montre la liste avec des cases à cocher avant de supprimer. Un exemplaire de chaque est toujours gardé. Nouveau bouton « Chercher les doublons dans l’appli » (il repère aussi l’événement de l’appli et sa copie importée d’Outlook, et garde celui de l’appli). L’envoi vers Outlook n’envoie plus deux fois deux événements identiques.']},
 {v:'1.16.8',d:'27/10/2026',items:[
  'Écran large (iPad en paysage, ordinateur) : nouveau réglage « Panneau de droite » (Réglages → Affichage). Sur « Non », le mini-calendrier et la liste de la journée disparaissent et le mois, la semaine ou le jour prennent toute la largeur : les titres sont moins coupés.']},
 {v:'1.16.7',d:'27/10/2026',items:[
  'Les calendriers Outlook gardent leur couleur : l’éditeur et « Catégories et calendriers » affichent la couleur de chaque calendrier telle qu’elle est dans Outlook (ex. RDV violet, Commun vert), modifiable d’un toucher. Nouveau bouton « Aligner mes catégories de l’appli sur ces couleurs ».',
  'Couleurs des catégories Outlook : dans Réglages → Outlook → « Catégories et calendriers », touche un rond de couleur pour choisir la couleur que tu veux (Outlook ne donne pas toujours la vraie couleur, surtout pour les catégories des calendriers partagés). Elle s’applique partout dans l’appli.',
  'Éditeur d’événement, partie Outlook plus claire : « 📅 Ranger dans quel calendrier Outlook ? » (le dossier) et « 🏷️ Étiquette de couleur Outlook (facultatif) », repliée par défaut. « Appli seulement » devient « Aucune ».']},
 {v:'1.16.6',d:'27/10/2026',items:[
  'La fenêtre « À venir aujourd’hui » de l’ouverture se désactive en un geste : bouton « Ne plus afficher cette fenêtre à l’ouverture » dans la fenêtre elle-même, ou interrupteur en haut de Réglages → Affichage. Elle reste réactivable à tout moment.']},
 {v:'1.16.5',d:'27/10/2026',items:[
  'Réglages : les fonctions qu’on utilise moins souvent (modèles et garde alternée, horaires de travail, aide à l’adresse) sont rangées dans « Options complémentaires », un bloc repliable. L’écran est plus court et va à l’essentiel.',
  'La carte « Installer l’appli » n’est plus répétée dans les Réglages (le rappel d’installation existe déjà à l’ouverture). Le bouton d’installation reste dans « Démo et aide » quand l’appareil le permet, et le mode d’emploi explique toujours comment installer.']},
 {v:'1.16.4',d:'27/10/2026',items:[
  'La sauvegarde est maintenant tout en haut des Réglages, avec deux boutons simples : Sauvegarder et Restaurer.',
  'Sur iPhone et Android, « Sauvegarder » ouvre directement le menu de partage : choisis « Enregistrer dans Fichiers » puis ton dossier (iCloud Drive…). Le téléphone te reproposera le même dossier la fois suivante. Sur ordinateur (Chrome, Edge), la fenêtre se rouvre au même emplacement.']},
 {v:'1.16.3',d:'27/10/2026',items:[
  'Réglages plus simples et plus compacts : boutons, curseurs, champs et catégories moins gros, cartes plus serrées, tout reste lisible.',
  'Ce qu’on utilise le plus est en haut : Affichage et couleurs, puis Mon agenda (catégories, modèles, horaires). Rappels et aide à l’adresse sont maintenant vers la fin.']},
 {v:'1.16.2',d:'27/10/2026',items:[
  'Vue Mois : les barres sur plusieurs jours (vacances, congés, événements de 2-3 jours…) passent maintenant avant les petits événements et se réduisent un peu quand la semaine est chargée, au lieu de disparaître derrière « +2 » en vue normale.',
  'Catégories Outlook : les couleurs Bleu et Violet étaient inversées, c’est corrigé (et plusieurs autres couleurs d’Outlook sont mieux respectées).',
  'Catégories Outlook : tes catégories personnelles de l’appli (ex. « Semaine Elise », « Ethan ») sont aussi proposées dans le choix Outlook et dans l’écran « Catégories et calendriers Outlook ».']},
 {v:'1.16.1',d:'27/10/2026',items:[
  'Garde alternée et modèles : tu peux maintenant choisir le calendrier Outlook et la catégorie Outlook (comme dans la fiche d’un événement). Les modèles les retiennent aussi.']},
 {v:'1.16.0',d:'27/10/2026',items:[
  'Nouveau : modèles d’événements. Dans la fiche d’un événement, « Enregistrer comme modèle » ; dans « Nouvel événement », une rangée Modèles remplit tout (titre, emoji, lieu, heures, durée, rappel) : tu ne changes que la date. À gérer dans Réglages → Modèles.',
  'Nouveau : garde alternée. Choisis « Un week-end sur 2 », « Une semaine sur 2 » ou personnalisé, le jour et l’heure de début et de fin, à partir de quelle date et jusqu’à quand : l’appli crée toutes les gardes d’un coup, et l’on peut modifier une seule garde ou toute la série.',
  'Garde alternée : périodes de vacances à part (pas de garde, toute la période, 1re ou 2e moitié) : les gardes normales de la période sont retirées et remplacées.',
  'Les modèles sont inclus dans la sauvegarde.']},
 {v:'1.15.0',d:'27/10/2026',items:[
  'Nouveau : aide à l’adresse (facultative, France). Dans « Lieu », après quelques lettres, l’appli propose des adresses complètes ; tu touches la bonne et c’est rempli. Si l’adresse est fausse ou introuvable, ton texte est gardé tel quel.',
  'Désactivée par défaut et jamais envoyée sans ton accord : si tu l’actives, ce que tu tapes dans « Lieu » est envoyé au service public Base Adresse Nationale (gratuit, sans pub, sans compte). Désactivable dans Réglages.',
  'Hors connexion ou hors de France : le champ reste libre, rien ne casse.']},
 {v:'1.14.0',d:'27/10/2026',items:[
  'Nouveau : Réglages → Apparence. Choisis la couleur de l’appli (8 couleurs ou la tienne), la teinte du fond (crème, bleuté, menthe, rose…), avec un aperçu immédiat. Fonctionne en clair et en sombre.',
  'Couleur des week-ends au choix (ou aucune), visible en Mois, Semaine, 2 semaines et Jour.',
  'Jours fériés français en rouge (Pâques, Ascension, Pentecôte inclus, calculés automatiquement) : option à activer ou non.',
  'Numéros des dates plus lisibles : Normal, Gros ou Dans un rond.',
  'Bouton pour remettre l’apparence par défaut.']},
 {v:'1.13.8',d:'27/10/2026',items:[
  'Vue 2 semaines (téléphone) : texte un peu plus petit et jusqu’à 6 lignes par événement, les mots longs se coupent proprement avec un tiret (« anniver-saire ») au lieu d’être hachés en morceaux',
  'Vue Mois : les titres d’un seul jour se lisent mieux (police ajustée, icône retirée quand elle prend la place du texte) et les barres sur plusieurs jours ne s’étirent plus',
  'Vues Mois et 2 semaines : plus de teinte grise/bleue sur le « jour sélectionné » ; seul aujourd’hui est mis en valeur'
 ]},
 {v:'1.13.7',d:'27/10/2026',items:[
  'Le jour d’aujourd’hui est beaucoup plus visible : case colorée avec un cadre, numéro entouré d’un halo (vues Mois et 2 semaines), colonne plus marquée en vue Semaine'
 ]},
 {v:'1.13.6',d:'27/10/2026',items:[
  'Outlook : fin des doublons à l’envoi. Chaque événement envoyé porte maintenant une marque invisible ; si un autre appareil (ou une réinstallation) ne le connaît pas, l’appli retrouve l’événement dans Outlook au lieu d’en créer un deuxième, et supprime les exemplaires en trop',
  'Nouveau bouton Réglages → Outlook → « Nettoyer les doublons dans Outlook » : supprime les doublons déjà créés dans le calendrier « Agenda (appli) » (un exemplaire conservé, tes autres calendriers ne sont pas touchés)',
  'Au prochain envoi, tous les événements sont mis à jour une fois pour recevoir la marque'
 ]},
 {v:'1.13.5',d:'27/10/2026',items:[
  'Nouveau : bouton œil en haut (à côté de l’imprimante) = mode plein écran. Les boutons du haut et du bas disparaissent, le calendrier prend tout l’écran ; il reste le nom du mois et un petit œil barré pour revenir à l’affichage normal. Glisser à gauche/droite change toujours de période'
 ]},
 {v:'1.13.4',d:'27/10/2026',items:[
  'Éditeur : nouveau choix « Sans catégorie » (gris) pour un événement que tu ne veux ranger dans aucune catégorie de l’appli, par exemple quand tu l’envoies seulement dans un calendrier Outlook'
 ]},
 {v:'1.13.3',d:'27/10/2026',items:[
  'Réglages → Outlook → « Voir mes catégories et calendriers Outlook… » : tu vois exactement ce qu’Outlook renvoie (noms et couleurs) et tu coches ce qui s’affiche dans l’éditeur',
  'Nouveau champ « Calendrier Outlook » dans l’éditeur : l’événement est envoyé directement dans le calendrier Outlook de ton choix (ex. « Semaine Elise »), « Agenda (appli) » par défaut ; si tu changes de calendrier, il est déplacé à la prochaine synchronisation'
 ]},
 {v:'1.13.2',d:'27/10/2026',items:[
  'Catégorie Outlook : l’éditeur affiche maintenant tes vraies catégories (celles déjà utilisées sur tes événements Outlook) au lieu des 6 couleurs standard, même sans reconnexion',
  'Nouveau bouton « ＋ Autre nom… » pour saisir le nom exact d’une catégorie Outlook',
  'Réglages → Outlook : bouton « Reconnecter pour lire toutes mes catégories Outlook » (donne la liste complète du compte, y compris les catégories pas encore utilisées)'
 ]},
 {v:'1.13.1',d:'27/10/2026',items:[
  'Import : les jours identiques d’un événement « journée entière » (ex. « Congé supplémentaire » du 2 au 15) sont regroupés en une seule barre sur plusieurs jours, y compris pour ce qui a déjà été importé ; titres un peu moins coupés en vue Mois',
  'Import Outlook : les nouvelles catégories créées reprennent la couleur de la catégorie Outlook'
 ]},
 {v:'1.13.0',d:'27/10/2026',items:[
  'Nouveau : choisis n’importe quel emoji. Dans l’éditeur, « ＋ Plus… » ouvre un sélecteur avec catégories (visages, santé, sport, nourriture, voyage…), recherche par mot en français (« dentiste », « gâteau », « avion »…) et tes emojis récents',
  'Chaque catégorie peut avoir son emoji par défaut (Réglages → Catégories) : il se met tout seul quand tu choisis la catégorie',
  'Tu peux toujours taper ou coller un emoji de ton clavier dans le champ',
  'Outlook : dans l’éditeur, un nouveau champ « Catégorie Outlook » (si tu es connecté) liste les catégories de ton compte ; l’événement arrive classé dans Outlook. « Appli seulement » = aucune catégorie Outlook. Les catégories des événements récupérés d’Outlook sont conservées. Pour voir la liste complète de ton compte, déconnecte puis reconnecte Outlook une fois (nouvelle autorisation de lecture des catégories)',
  'Correction : dans Réglages, la carte Outlook ne se referme plus quand tu choisis Oui/Non'
 ]},
 {v:'1.12.3',d:'27/10/2026',items:[
  'Vue Mois : le titre d’un événement « journée entière » d’un seul jour est maintenant lisible en entier : il passe sur 2 ou 3 lignes, et quand la case est trop petite l’emoji s’efface pour laisser la place au titre (« pêche » au lieu de « 👨👩… »)',
  'Les emojis composés (famille, drapeaux…) ne sont plus coupés en deux'
 ]},
 {v:'1.12.2',d:'27/10/2026',items:[
  'Imports Outlook et Excel/CSV : une vraie page liste tous les événements (date, heure, lieu, calendrier) avec une case à cocher chacun, une recherche, « Tout cocher / Tout décocher » et le nombre choisi avant d’importer'
 ]},
 {v:'1.12.1',d:'27/10/2026',items:[
  'Bouton « Récupérer depuis Outlook » directement dans la carte Outlook, à côté d’« Envoyer maintenant » (un geste pour relire les calendriers déjà choisis)'
 ]},
 {v:'1.12.0',d:'27/10/2026',items:[
  'Import depuis Outlook : lis tes autres calendriers Outlook (rendez-vous, vacances, calendriers partagés…) et ajoute-les dans AgenDam, avec une catégorie par calendrier',
  'Import depuis un fichier Excel ou CSV (.xlsx, .xls, .ods, .csv) : l’appli reconnaît les colonnes (titre, dates, heures, lieu, notes, catégorie, rappel), te laisse les corriger et ignore les doublons',
  'Option « Récupérer mes calendriers Outlook à l’ouverture de l’appli » : AgenDam relit automatiquement les calendriers choisis lors du dernier import (pas de suppression, pas de synchro en arrière-plan)',
  'La carte Outlook se replie une fois connecté (un simple bandeau, qui se déplie pour envoyer, régler ou déconnecter)'
 ]},
 {v:'1.11.1',d:'27/10/2026',items:[
  'Choix du calendrier sur ordinateur : le fichier .ics est présenté pour iCloud, Apple et Outlook installé, avec une explication pour iCloud (qui n’a pas de lien direct)'
 ]},
 {v:'1.11.0',d:'27/10/2026',items:[
  'Sur ordinateur, « Au calendrier » propose maintenant Outlook.com, Outlook travail/école, Google Agenda (événement déjà rempli) ou le fichier .ics, au lieu de seulement télécharger un fichier',
  '« Tout envoyer » et « Choisir les événements à envoyer » proposent le même choix sur ordinateur'
 ]},
 {v:'1.10.1',d:'27/10/2026',items:[
  'Les affiches à partager (Réglages → Fiche de l’appli) portent maintenant un QR code pour ouvrir l’appli, comme la fiche de présentation'
 ]},
 {v:'1.10.0',d:'27/10/2026',items:[
  'Impression corrigée sur iPhone et iPad : l’appli prépare un PDF d’une page A4 à imprimer ou partager (la fenêtre d’impression directe ne marche pas dans une appli installée sur iOS)',
  'Affichage adapté à l’appareil : onglets à gauche et réglages sur 2 colonnes sur grande tablette et ordinateur, texte et grilles agrandis sur grand écran, mode paysage compact sur téléphone',
  'Raccourcis clavier sur ordinateur (flèches, T, J, S, M, D, C, N, P, ?)'
 ]},
 {v:'1.9.0',d:'27/10/2026',items:[
  'Réglages réorganisés par thèmes : Mon agenda, Affichage et rappels, Calendriers, Mes données, Aide et partage, À propos (avec des raccourcis en haut)',
  'À l’ouverture après une mise à jour, une fenêtre « Nouveautés » résume ce qui a changé',
  'Historique : les 5 dernières versions dans l’aide ; tout l’historique depuis le début dans Réglages → Outils développeur',
  'Outils développeur : bouton « Forcer la mise à jour » (recharge l’appli sans toucher à tes événements)'
 ]},
 {v:'1.8.1',d:'27/10/2026',items:[
  'Envoi au calendrier du téléphone : le téléphone affiche maintenant directement sa page « Ajouter » avec le choix du calendrier (iCloud, Outlook…), pour un événement, une sélection ou tout',
  'Réglages : nouvelle carte « Calendrier du téléphone » en haut (option de proposition + choix des événements à envoyer), juste sous les rotations de travail'
 ]},
 {v:'1.8.0',d:'27/10/2026',items:[
  'Lieu d’un rendez-vous : touche-le pour ouvrir l’adresse dans Plans, Google Maps ou Waze (ou la copier)',
  'Fiche à partager : touche une affiche pour la voir en grand, puis « Partager cette image » (SMS, mail, WhatsApp, photos…)',
  'Le bouton imprimante fonctionne aussi depuis Réglages et Chercher : il te demande quoi imprimer'
 ]},
 {v:'1.7.0',d:'27/10/2026',items:[
  'L’appli s’appelle désormais AgenDam (nom, icône d’accueil, impression, fiche à partager, aperçu des liens). Tes données ne changent pas.'
 ]},
 {v:'1.6.0',d:'27/10/2026',items:[
  'Choisir précisément quoi envoyer au calendrier du téléphone : filtre par période et catégorie, cases à cocher, puis envoi',
  'À la création d’un événement : option « Me proposer de l’ajouter au calendrier du téléphone » (le téléphone te laisse choisir iCloud, Outlook…). Si tu modifies ensuite l’événement, un bouton « Mettre à jour » te le propose. Tout se règle (activer / désactiver) dans Réglages',
  'Rotations de travail personnalisées : tu crées toi-même ton cycle (jours travaillés, repos, matin / soir / nuit, heures, emoji) dans Réglages',
  'Réglages : icône d’engrenage en haut à droite (comme tes autres applis) ; guide, installation et fiche à partager (affiches, descriptif, lien) directement dans Réglages',
  'Bouton « Au calendrier » dans la fiche d’un événement (remplace « .ics »)'
 ]},
 {v:'1.5.0',d:'27/10/2026',items:[
  'Impression d’une page pour chaque vue : Jour (portrait), Semaine, Mois et 2 semaines (paysage A4) — plus de page en trop',
  'La semaine s’imprime en colonnes (un jour par colonne) avec les heures devant chaque rendez-vous',
  'Impression : icône imprimante en haut pour imprimer le jour (détaillé), la semaine, le mois ou les 2 semaines, avec tous les événements',
  'Raccourci « 2 semaines » ajouté sur l’icône de l’appli (appui long sur Android)'
 ]},
 {v:'1.4.1',d:'27/10/2026',items:[
  'Vue Mois et 2 sem. plus lisibles : texte plus fin, titres sur 2 ou 3 lignes quand il y a de la place, barre de couleur à gauche de chaque événement, plus d’événements visibles par case'
 ]},
 {v:'1.4.0',d:'27/10/2026',items:[
  'Connexion à Outlook / Microsoft (compte Outlook, Hotmail, Live) : envoi de ton agenda vers un calendrier Outlook, à la demande ou automatiquement',
  'Sens unique appli → Outlook, dans un calendrier à part : tes autres calendriers ne sont jamais touchés'
 ]},
 {v:'1.3.0',d:'26/10/2026',items:[
  'Nouvelle vue « 2 sem. » : deux semaines d’un coup, avec beaucoup plus de place pour les titres, les emoji et les bandeaux',
  'Réglages : la vue 2 semaines peut être choisie comme écran de démarrage'
 ]},
 {v:'1.2.0',d:'26/10/2026',items:[
  'Vue Mois : un événement sur plusieurs jours de suite (ex. rotation 3 jours) s’affiche en un seul bandeau avec son nom complet',
  'Emoji / pictogramme au choix sur chaque événement (visible dans toutes les vues, exporté dans le .ics)'
 ]},
 {v:'1.1.0',d:'26/10/2026',items:[
  'Vue Mois refaite : titres des événements dans les cases, bandeaux continus pour les événements sur plusieurs jours, numéros de semaine, aujourd’hui en couleur, jours hors mois grisés',
  'Toucher un jour ouvre ses événements dans une fenêtre (Ajouter / Ouvrir la journée)',
  'Nouveau bouton « Ajouter à mon agenda » (Apple, Outlook, Google) : envoi du .ics vers l’agenda du téléphone, rappels inclus',
  'Réglages : choix « Titres » ou « Points + liste » pour la vue Mois'
 ]},
 {v:'1.0.0',d:'26/10/2026',items:[
  'Première version : vues Jour, Semaine et Mois en gros caractères',

const HY_V='aàâäeéèêëiîïoôöuùûüyÿœæ',HY_KEEP=['bl','br','ch','cl','cr','dr','fl','fr','gl','gn','gr','ph','pl','pr','th','tr','vr'];
function hyWord(w){
 const L=w.toLowerCase(),n=L.length,isV=i=>HY_V.indexOf(L[i])>=0,cut=[];
 let i=0;while(i<n&&!isV(i))i++;
 while(i<n){
  while(i<n&&isV(i))i++;
  let j=i;while(j<n&&!isV(j))j++;
  if(j>=n)break;
  const c=L.slice(i,j),k=c.length;let p;
  if(k===1)p=i;else if(HY_KEEP.indexOf(c.slice(-2))>=0)p=j-2;else p=j-1;
  if(p>=3&&n-p>=4)cut.push(p);
  i=j;

}

function matches(ev,d){
 if(d<ev.start)return false;
 const r=ev.rec;
 if(!r)return d===ev.start;
 if(r.until&&d>r.until)return false;
 if(ev.ex&&ev.ex.includes(d))return false;
 const n=Math.max(1,r.interval||1);
 switch(r.type){
  case 'daily':return diff(d,ev.start)%n===0;
  case 'weekly':{
   const days=(r.days&&r.days.length)?r.days:[dow(ev.start)];
   if(!days.includes(dow(d)))return false;
   const w=Math.floor(diff(mondayOf(d,1),mondayOf(ev.start,1))/7);
   return w%n===0}
  case 'monthly':{
   const a=pd(ev.start),b=pd(d);const m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
   if(m<0||m%n)return false;
   const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
   return b.getDate()===Math.min(a.getDate(),last)}
  case 'yearly':{
   const a=pd(ev.start),b=pd(d);const y=b.getFullYear()-a.getFullYear();
   if(y<0||y%n||a.getMonth()!==b.getMonth())return false;
   const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
   return b.getDate()===Math.min(a.getDate(),last)}
  case 'cycle':{const on=r.on||1,off=r.off||0;return diff(d,ev.start)%(on+off)<on}
 }
 return false;
}
function mkOcc(ev,date){
 const dur=Math.max(0,diff(ev.end,ev.start));
 const s=ev.allDay?0:tmin(ev.startTime);let e=ev.allDay?1440:tmin(ev.endTime);
 if(!ev.allDay&&dur===0&&e<=s)e=Math.min(1440,s+30);
 return{ev,date,endDate:add(date,dur),allDay:ev.allDay,s,e,dur};
}
function occsOf(ev,from,to){
 const out=[];const dur=Math.max(0,diff(ev.end,ev.start));
 if(!ev.rec){if(ev.start<=to&&add(ev.start,dur)>=from)out.push(mkOcc(ev,ev.start));return out}
 let lo=add(from,-dur);if(lo<ev.start)lo=ev.start;
 let hi=to;if(ev.rec.until&&ev.rec.until<hi)hi=ev.rec.until;
 for(let d=lo;d<=hi;d=add(d,1))if(matches(ev,d))out.push(mkOcc(ev,d));
 return out;
}
function occsMine(from,to){const out=[];for(const ev of EV)out.push(...occsOf(ev,from,to));return out}

function segs(list,day){
 const ad=[],ts=[];
 for(const o of list){
  if(o.date>day||o.endDate<day)continue;
  if(o.allDay){ad.push(o);continue}
  const s=o.date===day?o.s:0,e=o.endDate===day?o.e:1440;
  if(e<=s)continue;
  ts.push({o,s,e});
 }
 ad.sort((a,b)=>a.ev.title.localeCompare(b.ev.title));
 ts.sort((a,b)=>a.s-b.s||a.e-b.e);
 return{ad,ts};
}
function layout(items){
 items.sort((a,b)=>a.s-b.s||b.e-a.e);
 const clusters=[];let cur=[],cEnd=-1;
 for(const it of items){
  const ee=Math.max(it.e,it.s+30);
  if(cur.length&&it.s>=cEnd){clusters.push(cur);cur=[];cEnd=-1}
  cur.push(it);cEnd=Math.max(cEnd,ee);
 }
 if(cur.length)clusters.push(cur);
 for(const c of clusters){
  const cols=[];
  for(const it of c){let i=0;while(cols[i]!==undefined&&cols[i]>it.s)i++;cols[i]=Math.max(it.e,it.s+30);it.col=i}
  c.forEach(it=>it.cols=cols.length);
 }
 return items;
}
function recText(ev){

 else if(r.type==='weekly'){
  t=n===1?'Toutes les semaines':'Toutes les '+n+' semaines';
  const days=(r.days&&r.days.length)?r.days.slice():[dow(ev.start)];
  days.sort((a,b)=>((a+6)%7)-((b+6)%7));
  t+=' ('+days.map(d=>DS[d]).join(', ')+')';
 }

 else if(r.type==='cycle')t='Rotation : '+r.on+' jour'+(r.on>1?'s':'')+' puis '+r.off+' jour'+(r.off>1?'s':'')+' de repos';

const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsUnesc=s=>s.replace(/\\[nN]/g,'\n').replace(/\\([,;\\])/g,'$1');
const fold=l=>{let o='';while(l.length>72){o+=l.slice(0,72)+'\r\n ';l=l.slice(72)}return o+l};

const icsDT=(d,m)=>icsD(d)+'T'+pad(Math.floor(m/60)%24)+pad(m%60)+'00';
function vevent(ev,uidv,sd,ed,withRec,stampv){
 const l=['BEGIN:VEVENT','UID:'+uidv+'@agd.agenda','DTSTAMP:'+stampv];
 if(ev.allDay){l.push('DTSTART;VALUE=DATE:'+icsD(sd),'DTEND;VALUE=DATE:'+icsD(add(ed,1)))}
 else{l.push('DTSTART:'+icsDT(sd,tmin(ev.startTime)),'DTEND:'+icsDT(ed,tmin(ev.endTime)))}
 l.push('SUMMARY:'+icsEsc((ev.icon?ev.icon+' ':'')+ev.title));
 if(ev.place)l.push('LOCATION:'+icsEsc(ev.place));
 if(ev.note)l.push('DESCRIPTION:'+icsEsc(ev.note));
 l.push('CATEGORIES:'+icsEsc(catOf(ev.cat).name));
 if(withRec&&ev.rec&&ev.rec.type!=='cycle'){
  const r=ev.rec;let s='FREQ='+({daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY',yearly:'YEARLY'})[r.type];
  if(r.interval>1)s+=';INTERVAL='+r.interval;
  if(r.type==='weekly'){s+=';WKST=MO';if(r.days.length)s+=';BYDAY='+r.days.map(d=>WD[d]).join(',')}
  if(r.until)s+=';UNTIL='+(ev.allDay?icsD(r.until):icsD(r.until)+'T235959');
  l.push('RRULE:'+s);
  if(ev.ex.length)l.push(ev.allDay?'EXDATE;VALUE=DATE:'+ev.ex.map(icsD).join(','):'EXDATE:'+ev.ex.map(d=>icsDT(d,tmin(ev.startTime))).join(','));
 }
 if(ev.alarm!=null){
  let off=ev.allDay?(540-ev.alarm):-ev.alarm;
  const trig=(off<0?'-':'')+'PT'+Math.abs(off)+'M';
  l.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(ev.title),'TRIGGER:'+trig,'END:VALARM');
 }

}
function buildICS(list){
 const stampv=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda agd//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:AgenDam'];
 for(const ev of list){
  if(ev.rec&&ev.rec.type==='cycle'){
   const from=add(today(),-60),to=ev.rec.until||add(today(),400);
   for(const o of occsOf(ev,from,to))L.push(...vevent(ev,ev.id+'-'+o.date,o.date,o.endDate,false,stampv));
  }else L.push(...vevent(ev,ev.id,ev.start,ev.end,true,stampv));

 return L.map(fold).join('\r\n')+'\r\n';
}
function parseTrigger(v){

 if(!m)return null;
 const min=(+m[2]||0)*10080+(+m[3]||0)*1440+(+m[4]||0)*60+(+m[5]||0)+Math.round((+m[6]||0)/60);
 return m[1]?min:0;
}
function parseDT(val){

 if(m[7]){const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)));return{date:ds(d),min:d.getHours()*60+d.getMinutes(),allDay:false}}
