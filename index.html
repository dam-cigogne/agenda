 h+=d('Rappels et notifications','<ul><li><b>À l’ouverture</b> : un écran « À venir aujourd’hui » liste ce qu’il reste à faire dans la journée (désactivable dans Réglages).</li><li><b>Notifications</b> : elles s’affichent quand l’appli est ouverte ou récemment active. <b>Quand l’appli est fermée, aucun rappel ne sonne</b> : une appli web sans serveur ne peut pas le garantir, surtout sur iPhone (notifications possibles seulement depuis l’écran d’accueil, iOS 16.4 minimum).</li><li><b>Solution fiable</b> : exporte en .ics et ouvre le fichier avec l’agenda natif du téléphone, qui gère les alarmes lui-même.</li></ul>');
 h+=d('Plusieurs appareils et sauvegarde','<div class="warn"><b>Les appareils ne se synchronisent pas tout seuls.</b>Chaque appareil a sa propre copie de ton agenda.</div><ol><li>Appareil A : Réglages → <b>Sauvegarder (.json)</b>.</li><li>Envoie le fichier « '+BACKUP_FILE+' » à l’appareil B.</li><li>Appareil B : Réglages → <b>Restaurer</b>, puis choisis « Remplacer » ou « Fusionner ».</li></ol><p>Sauvegarde aussi régulièrement par sécurité : si tu vides les données du navigateur ou changes de téléphone, la sauvegarde est la seule copie. Le fichier porte toujours le même nom ; si ton téléphone en garde plusieurs, il ajoute « (1) », « (2) »… à la fin.</p>');
 if(OL_ON)h+=d('Connexion à Outlook','<ul><li>Réglages → <b>Outlook / Microsoft</b> → « Se connecter ». Tu t’identifies sur le site officiel de Microsoft : l’appli ne voit jamais ton mot de passe.</li><li>Elle crée un calendrier <b>« Agenda (appli) »</b> dans ton compte et y envoie tes événements (1 mois en arrière à 1 an en avant). Tes autres calendriers ne sont jamais touchés.</li><li><b>Sens unique</b> : appli → Outlook. Une modification faite dans Outlook sur ces événements est écrasée au prochain envoi.</li><li>Sur l’iPhone, ajoute ton compte Outlook dans Réglages → Calendrier → Comptes pour voir ce calendrier dans Calendrier.</li><li>La connexion expire au bout de quelques jours sans ouvrir l’appli : refais « Se connecter ».</li><li>Tu peux te déconnecter et supprimer ce calendrier à tout moment.</li></ul>');
 h+=d('Vue 2 semaines','<ul><li>L’onglet <b>2 sem.</b> montre deux semaines d’un coup : plus de place pour les titres, les emoji et les bandeaux que dans le mois.</li><li>Les flèches avancent de deux semaines. Touche un jour pour voir ses événements. Tu peux la choisir comme écran de démarrage dans Réglages.</li></ul>');
 h+=d('Emoji et vue Mois','<ul><li>Dans la fiche d’un événement, choisis un <b>emoji</b> (ou colle le tien) : il s’affiche devant le titre dans toutes les vues et part dans le .ics.</li><li>En vue <b>Mois</b>, un événement sur plusieurs jours de suite (ex. rotation 3 jours) forme un seul bandeau avec son nom complet. Touche un jour pour voir ses événements.</li><li>Les rendez-vous à heure fixe s’écrivent sur 1, 2 ou 3 lignes selon la place, avec une barre de la couleur de leur catégorie. « +2 » en haut d’une case = 2 événements de plus (touche la case).</li></ul>');
 h+=d('Rotations de travail','<ul><li>Dans <b>Réglages → Rotations de travail → Créer une rotation</b> : donne un nom, la date du premier jour, la durée, puis les <b>étapes</b> dans l’ordre (ex. 2 Matin, 2 Soir, 2 Nuit, 4 Repos).</li><li>Chaque étape a un nombre de jours, un type (travail ou repos), un emoji et, si tu veux, des heures (une fin avant le début = poste de nuit).</li><li>Des <b>modèles</b> (3 jours / 2 repos, matin / soir / nuit) te donnent un point de départ à modifier.</li><li>Tous les jours de la période apparaissent dans l’agenda comme des événements normaux : tu peux en changer un seul. « Modifier » la rotation recrée tous ses événements. « Supprimer » les retire.</li></ul>');
 if(OL_ON)h+=d('Gérer ses calendriers Outlook','<ul><li>Réglages → <b>Outlook / Microsoft</b> → « Gérer mes calendriers Outlook ».</li><li><b>Créer</b> : nom + couleur. <b>Modifier</b> : nouveau nom et/ou nouvelle couleur.</li><li><b>Supprimer</b> : efface le calendrier <b>et tous ses événements dans Outlook</b> (retape le nom pour confirmer). Impossible pour le calendrier par défaut, les calendriers en lecture seule (Anniversaires, Vacances…) et ceux d’un autre compte.</li><li>Le calendrier « Agenda (appli) » reste géré par l’appli.</li><li><b>Couleurs</b> : en plus des 10 couleurs d’Outlook, un sélecteur te laisse choisir une couleur libre, utilisée dans l’appli. Pour que les événements prennent la couleur de leur calendrier : <b>Réglages → Affichage → Couleur des événements → Calendrier Outlook</b>.</li><li><b>Couleur automatique</b> : si un calendrier est étiqueté ainsi, Outlook choisit sa couleur sans la dire à l’appli (d’où une couleur différente). « Fixer les couleurs automatiques » en choisit une pour de bon, identique des deux côtés.</li></ul>');
 h+=d('Anniversaires','<ul><li><b>📥 Importer des anniversaires</b> : choisis un fichier Word, Excel, CSV, calendrier (.ics) ou contacts (.vcf), ou colle ta liste. Une personne par ligne avec sa date. Tu vérifies avant d’importer.</li><li>Réglages → <b>Anniversaires</b> (ou touche le bandeau 🎂 d’un jour). Ajoute un nom, un jour, un mois, et si tu veux l’année de naissance : l’âge se calcule tout seul. Une note permet de garder une idée cadeau.</li><li>Ils ne s’affichent <b>pas</b> comme des événements : seul un petit 🎂 apparaît sur le jour, ce qui garde ton agenda lisible.</li><li><b>Rappel à l’ouverture</b> : l’écran « À venir » annonce les anniversaires proches (le jour J, la veille, 3 jours ou 1 semaine avant, au choix), une fois par jour. Une appli fermée ne peut pas envoyer de notification : pour une vraie sonnerie, utilise l’export ci-dessous.</li><li><b>Déplacer mes événements « anniversaire »</b> : l’appli repère ceux de ton agenda (titre, catégorie ou calendrier Outlook « Anniversaires »), te laisse cocher, les retire de l’agenda et les met dans la liste. Les imports Outlook ne reviennent pas.</li><li><b>Contacts (.vcf)</b> : exporte tes contacts en fichier .vcf (iPhone : appli Contacts ou iCloud.com ; Android : Contacts → Exporter ; Google Contacts ; Outlook), puis « Importer depuis mes contacts ». Une appli web ne peut pas lire tes contacts directement.</li><li><b>Trier et chercher</b> : au-dessus de la liste, « Prochains » (par date à venir), « A → Z » ou « Par mois » ; le champ « Chercher un prénom » filtre la liste pendant que tu tapes.</li><li><b>Idées cadeaux</b> : dans la fiche, une ligne par idée avec une case à cocher (acheté). Les idées restantes s’affichent dans la liste et dans le rappel. Elles ne partent pas dans le calendrier du téléphone.</li><li><b>Protéger les idées cadeaux</b> : crée ton code (Anniversaires → « Créer mon code »), puis dans la fiche d’une personne coche « 🔒 Protéger les idées cadeaux ». Son nom, sa date et son âge restent visibles partout ; ses idées cadeaux n’apparaissent plus dans la liste ni dans le rappel, et sa fiche ne s’ouvre qu’avec le code. L’appli se reverrouille après 2 minutes, quand tu fermes la liste ou quand tu quittes l’appli. Attention : ce n’est <b>pas un chiffrement</b>, il arrête le curieux qui a ton téléphone ouvert, pas un expert, et les sauvegardes .json ne sont pas protégées. <b>Face ID / empreinte</b> : une fois le code créé, « Déverrouiller avec Face ID / empreinte » l’active (iPhone 16 et + de iOS conseillé, Android avec un verrouillage d’écran). Si la reconnaissance échoue, le code sert de secours. Code oublié : seule solution, effacer la liste et recommencer (ou restaurer une sauvegarde).</li><li><b>Imprimer</b> : « Imprimer / PDF de tous les anniversaires » donne un PDF A4 classé par mois (plusieurs pages si besoin), avec les idées cadeaux. Les idées cadeaux des personnes protégées n’y figurent que si tu saisis le code.</li><li><b>Alarme sur le téléphone</b> : « Mettre dans le calendrier du téléphone » crée un événement annuel par personne avec alarme la veille à 18 h et le jour même à 9 h. iPhone : Envoyer → Calendrier → Ajouter tout. Android : Envoyer → Google Agenda ou Samsung Calendar. Si tu ajoutes des personnes, refais l’export (même identifiant : pas de doublon dans la plupart des applis).</li></ul>');
 h+=d('Vue Jour : 3 affichages, déplacer, chevauchements','<ul><li><b>Heures</b> : la grille habituelle. <b>Jour entier</b> : toute la journée tient à l’écran avec les horaires. <b>Liste</b> : événements triés, plages libres, ⚠ si deux événements se chevauchent.</li><li><b>Déplacer</b> : appui long sur un événement (≈ 0,5 s), puis glisse. L’heure s’affiche pendant le déplacement. Pas pour les événements répétés ni importés d’Outlook : ouvre leur fiche.</li><li><b>Avertissement</b> : si l’horaire est déjà pris, l’appli te le dit avant d’enregistrer.</li></ul>');
 h+=d('Supprimer les doublons','<ul><li><b>Réglages → Importer un autre calendrier → Chercher les doublons</b>.</li><li>L’appli cherche les événements avec le même titre (emoji, accents et majuscules ignorés), le même jour et la même heure.</li><li>Une liste apparaît : <b>coché = supprimé</b>. L’exemplaire le plus complet (note, lieu, catégorie) est gardé.</li></ul>');
 if(OL_ON)h+=d('Partager avec quelqu’un via Outlook','<ul><li>Réglages → <b>Gérer mes calendriers Outlook</b> → <b>Partager</b> : saisis son adresse mail et choisis « Peut modifier ». Elle reçoit une invitation Outlook à accepter. (Si Outlook refuse, reconnecte-toi à Outlook dans Réglages, ou partage depuis Outlook.)</li><li>Dans l’appli, range tes événements dans ce calendrier (éditeur → « Ranger dans quel calendrier Outlook ? »).</li><li><b>Réglages → Récupérer depuis Outlook</b> : tu récupères ce qu’elle ajoute ou modifie. Si elle supprime un événement, l’appli te propose de le retirer aussi (liste à confirmer).</li><li>Pour ne rien rater : <b>Réglages → À l’ouverture : récupérer Outlook → Me montrer</b>. À chaque ouverture, une fenêtre liste les ajouts, modifications et suppressions (rien si rien de nouveau).</li><li>Les événements récupérés avant la version 1.16.9 sont reconnus après une première récupération.</li><li><b>Trop d’événements proposés ?</b> Dans la liste, décoche ceux qui ne t’intéressent pas puis touche « Ne plus proposer les décochés » : ils ne reviennent plus. « Tout reproposer » (Réglages → Outlook) annule.</li></ul>');
 if(OL_ON)h+=d('Catégorie Outlook','<ul><li>Connecté à Outlook, l’éditeur propose <b>Catégorie Outlook</b> : l’événement est rangé dans cette catégorie quand il est envoyé.</li><li><b>Calendrier Outlook</b> : choisis dans quel calendrier Outlook l’événement est envoyé. <b>Réglages → Outlook → Voir mes catégories et calendriers</b> : liste ce qu’Outlook renvoie et te laisse cacher ce que tu n’utilises pas.</li><li><b>Aucune</b> : pas de catégorie dans Outlook (la catégorie de l’appli reste).</li><li>Des doublons dans Outlook ? <b>Réglages → Outlook → Nettoyer les doublons dans Outlook</b> supprime les exemplaires en trop du calendrier « Agenda (appli) ».</li><li>Liste incomplète ? Déconnecte puis reconnecte Outlook une fois pour autoriser la lecture de tes catégories.</li></ul>');
 h+=d('🧳 Voyages','<ul><li><b>Programme détaillé</b> : dans Matin, Après-midi ou Soir, « ＋ Ajouter » (heure facultative, quoi, détails) ; plusieurs choses par case, rangées par heure (avant 12 h Matin, 12 h–18 h Après-midi, après 18 h Soir). <b>🖨 Imprimer le voyage</b> : tout sur une page A4 (programme avec heures et repas, listes avec ☑ pris / ☐ reste à prendre, infos).</li><li><b>Nouveau voyage</b> : nom, dates, lieu.</li><li><b>Listes</b> : pars d’un <b>modèle</b> (valise, maison avant de partir…), ou <b>colle une liste depuis Notes</b> (une ligne = une case), ou crée une liste vide. Indique pour qui (valise de Léo). Coche au fur et à mesure. « ⋯ » sur une liste : tout décocher, renommer, <b>enregistrer comme modèle</b>, supprimer.</li><li><b>Programme</b> : matin, après-midi et soir pour chaque jour.</li><li><b>Repas</b> : les repas des jours du voyage (ceux de l’onglet Repas). « Ingrédients du séjour → courses » remplit la liste de courses.</li><li><b>Infos</b> : adresse (avec itinéraire), trajet, réservations, numéros utiles, budget, notes.</li><li><b>📤 Envoyer le voyage</b> l’envoie à la famille par SMS ou WhatsApp.</li></ul>');
 h+=d('🎉 Souhaiter un anniversaire','<ul><li><b>La carte</b> : 8 décors au choix (Ballons, Guirlande, Gâteau, Fleurs, Arc-en-ciel, Bulles, Étoiles, Chic) et le titre (Joyeux anniversaire, Bon anniversaire, Happy birthday, Bonne fête). Avec une photo : forme Rond, Cœur, Carré, Polaroïd ou Plein écran, et un effet (Vif, Chaud, Noir et blanc, Sépia).</li><li>Dans <b>Anniversaires</b>, touche <b>🎉</b> à côté de la personne (le jour J, le bouton apparaît aussi à l’ouverture de l’appli et dans l’agenda).</li><li>Choisis un <b>ton</b> : le message est écrit avec son prénom et son âge. <b>🔀 Un autre message</b> en propose un nouveau, et tu peux modifier le texte.</li><li>Choisis le <b>thème de la carte</b>, et ajoute une <b>photo</b> si tu veux.</li><li><b>📤 Envoyer la carte et le message</b> ouvre le partage du téléphone : Messages, WhatsApp, mail… C’est toi qui appuies sur Envoyer.</li><li><b>Signé</b> : choisis qui signe la carte (ton prénom, « Damien et Nora », Papa, Maman, Toute la famille, ou autre chose). Ton prénom se règle dans Réglages → Famille et contacts → <b>Ce téléphone est à</b>.</li><li>Relie la personne à un contact (Modifier l’anniversaire → Contact relié) pour avoir « SMS à… » en un geste.</li><li>Les photos restent dans l’appli et partent dans ta <b>sauvegarde .json</b> : enregistre-la toujours au même endroit (iCloud Drive, par exemple) pour tout retrouver.</li></ul>');
 h+=d('🛒 Courses','<ul><li>Où ? L’onglet <b>🛒 Courses</b> en bas de l’écran.</li><li><b>🛒 À acheter</b> : la liste actuelle, rangée par rayon. Coche en magasin, puis « Vider le chariot ».</li><li><b>📒 Ma liste type</b> : tous tes produits habituels, de A à Z. Touche un produit pour l’ajouter à la liste choisie (un second toucher le retire). « ＋ Ajouter des articles » pour coller ta liste depuis Notes, « ✏️ Modifier » pour en retirer, « 🧹 Doublons » pour repérer les produits écrits deux fois (Tomate / Tomates…) et choisir lequel garder. Les produits que tu achètes s’y ajoutent tout seuls.</li><li><b>Plusieurs listes</b> : ce sont les intercalaires sur le côté droit, comme dans un carnet (ou des boutons en haut : Réglages → Affichage → « Listes (Tâches et Courses) »). Touche-en un pour ouvrir la liste. Sous le nom : avec qui elle est partagée (👥) ou de qui elle vient (📥). « ＋ » en bas des intercalaires pour une nouvelle liste (Leclerc, Marché, Pharmacie…).</li><li><b>Retrouver un produit vite</b> : dans Ma liste type, touche une lettre sur le côté (A, B, C…), ou range par rayon, ou « ⭐ Les plus achetés », ou cherche avec 🔍.</li><li><b>👥 Partager</b> une liste avec quelqu’un de ta famille connectée : il ou elle peut ajouter et cocher, tout le monde voit les changements.</li><li><b>⋯ Options</b> (en haut à droite) : envoyer la liste, <b>envoyer ma liste type</b> (la personne reçoit tous tes produits habituels dans sa liste type, sans doublon et sans rien ajouter à ses courses), recevoir, imprimer, partager, paquets, renommer ou supprimer la liste.</li><li><b>📋 Paquets</b> (apéro, barbecue…) et <b>🔁 Refaire mes dernières courses</b> ajoutent plusieurs articles d’un coup (dans ⋯ Options, ou en haut quand la liste est vide).</li></ul>');
 h+=d('🍽 Repas','<ul><li><b>⋯ Options</b> (en haut) : dans Recettes, nouvelle recette, importer avec un lien, coller, recevoir, envoyer ; dans Menu, imprimer le planning de la semaine, envoyer, copier la semaine précédente.</li><li><b>Recettes rangées</b> : 🥗 Entrées, 🍲 Plats, 🍰 Desserts, 🥂 Apéro, 🥐 Petit-déj, et 🥕 Végé / 🥩 Viande / 🐟 Poisson, plus Thermomix, 🍟 Air fryer, Rapide… L’appli devine ; corrige dans « Modifier » (Type, Régime, étiquettes).</li><li><b>📷 Photo</b> : dans une recette, « Ajouter une photo » (appareil photo ou galerie). À l’import par lien, la photo du site vient toute seule quand le site le permet.</li><li><b>Quantités</b> : « Pour − 4 + personnes » recalcule la liste des ingrédients. Les quantités écrites dans le texte des étapes ne changent pas : fie-toi à la liste (un message te le rappelle).</li><li><b>Importer une recette d’un site</b> (Marmiton, 750g…) : dans Safari, Partager ⬆️ → Copier ; puis ⋯ Options → <b>🔗 Importer avec un lien</b> → <b>📋 Coller le lien</b>. AgenDam lit la recette tout seul. Cookidoo : copie le texte de la recette et « 📋 Coller une recette ».</li><li>Sur ordinateur, tu peux aussi ajouter le bouton « 📥 AgenDam » à tes favoris (une seule fois). Ensuite, sur la page d’une recette, touche ce favori.</li><li><b>Mode cuisine</b> : dans une recette, « 👩‍🍳 Mode cuisine » affiche en plein écran les ingrédients puis une étape à la fois, en gros. Les réglages Thermomix sont surlignés.</li><li><b>Menu de la semaine</b> : touche Midi ou Soir d’un jour, choisis une recette du carnet ou écris le repas (« restes », « pizza »). Indique qui cuisine et combien vous êtes. 🎲 propose une idée parmi tes favoris.</li><li><b>Recettes</b> : « Nouvelle recette », ou « Coller une recette » copiée depuis Notes, un site ou un message. Une ligne par ingrédient (« 200 g de farine »), une ligne par étape.</li><li>Dans une recette : change le nombre de personnes, les quantités suivent. <b>🛒 Mettre les ingrédients manquants en courses</b> : décoche ce que tu as déjà.</li><li><b>Courses</b> : la liste est rangée par rayon. Ajoute un article en haut, coche en magasin, puis « Vider le chariot ». C’est la même liste que « Courses » dans Tâches.</li><li>📤 Partage une recette, le menu ou la liste de courses par SMS ou WhatsApp.</li></ul>');
 h+=d('🔄 Groupes connectés (famille, amis…)','<ul><li><b>📅 Catégories communes</b> : Réglages → <b>Catégories</b>, sous une catégorie, touche le prénom d’une personne connectée (✓ = partagée). Chez elle, la catégorie apparaît avec son nom, sa couleur et « (ton prénom) » ; elle voit les rendez-vous comme les siens et peut en <b>ajouter, modifier ou supprimer</b> : tout revient chez toi. En haut des Catégories, « 👁 voit les détails / seulement occupé » : en mode occupé, elle ne voit que les créneaux, sans pouvoir modifier. Les rendez-vous <b>🔒 Privé</b>, les notes et les rappels ne partent jamais. Pour qu’elle te partage aussi ses catégories, elle fait pareil de son côté.</li><li><b>Consommation</b> : l’appli vérifie les nouveautés toutes les 2 min 30 quand elle est ouverte (et à chaque ouverture) et regroupe ses envois.</li><li><b>Créer</b> : Réglages → Famille, amis et contacts → <b>Créer un groupe</b> (Famille, Amis, Coloc…). Tu peux en avoir plusieurs en parallèle : « ＋ Nouveau groupe ».</li><li><b>Inviter</b> : <b>🔢 Code d’invitation</b> → « Juste le code par SMS » (facile à copier). Chez l’autre, dans l’appli de l’écran d’accueil : Réglages → Famille et contacts → <b>🔢 Rejoindre avec un code</b>. On peut aussi coller tout le message : l’appli trouve le code.</li><li><b>Choisir ce que tu partages</b> : au départ, rien n’est partagé. Dans la carte Famille connectée, chaque personne a un bouton <b>Choisir</b> : courses, tâches (aucune, seulement les siennes, ou toutes), repas, anniversaires, voyages. Chacun choisit de son côté ce qu’il te partage.</li><li>Quand quelqu’un coche une tâche ou un article que tu lui as partagé, tu le vois chez toi.</li><li><b>Anniversaires au choix</b> : onglet Anniv. → <b>☑ Sélectionner</b>, touche ceux que tu veux, puis <b>🔄 Partager avec…</b> (ou <b>📤 Envoyer</b> par SMS). Ou dans « Choisir » : Anniversaires → Certains.</li><li><b>Plusieurs appareils</b> (iPhone, iPad, Android, ordinateur, tout marche) : sur ton autre appareil, « 🔢 Rejoindre avec un code ». Puis, sur l’un des deux, « Choisir » → <b>📱 C’est un autre appareil à moi</b> : tout se synchronise entre tes appareils, et chacun voit aussi ce que la famille te partage.</li><li><b>Retirer</b> une personne : elle ne reçoit plus rien, et ce que tu lui avais partagé disparaît de son téléphone à sa prochaine ouverture. <b>Réintégrer</b> plus tard si besoin, ou 🗑 pour la supprimer définitivement.</li><li>Ce que tu reçois d’un groupe (les courses d’un ami…) n’est jamais renvoyé à un autre groupe.</li><li>Les mises à jour arrivent à l’ouverture de l’appli et toutes les minutes quand elle est ouverte (pas de notification appli fermée). <b>🔄 Mettre à jour maintenant</b> force l’envoi et la réception.</li><li><b>Chiffré de bout en bout</b> : ce que tu partages avec une personne n’est lisible que par elle. L’agenda reste sur chaque téléphone.</li><li>Sur iPhone, utilise toujours l’appli de l’écran d’accueil (Safari a ses propres données, séparées).</li></ul>');
 h+=d('📤 Partager avec la famille','<ul><li><b>Pour commencer</b> : Réglages → Famille et contacts → <b>Inviter ma famille</b>. Tes proches reçoivent par SMS le lien et les étapes pour installer l’appli.</li><li>Ajoute tes proches dans <b>Réglages → Famille et contacts</b> (avec leur téléphone ou mail).</li><li>Dans <b>Tâches</b>, choisis ce que tu veux envoyer (une liste, une personne, ou tout), puis <b>📤 Partager</b> : SMS, mail ou une autre appli (WhatsApp…). Pareil pour les anniversaires (Réglages → Anniversaires).</li><li>La personne touche le lien : son AgenDam lui montre ce qui change et se met à jour, sans doublon. Ce que tu as coché ou supprimé l’est aussi chez elle.</li><li><b>iPhone avec l’appli sur l’écran d’accueil</b> : le lien s’ouvre dans Safari. Touche « copier », ouvre AgenDam, puis Tâches → <b>📥 Recevoir</b>.</li><li>Ce n’est pas automatique : renvoie le lien après tes changements. Les idées cadeaux des personnes protégées ne sont jamais envoyées.</li><li>Le lien contient les données : ne l’envoie qu’aux personnes concernées.</li></ul>');
 h+=d('☑ Tâches','<ul><li><b>🖨 Imprimer</b> : « La semaine en agenda » donne une page A4 paysage avec les 7 jours et leurs tâches (même celles qui reviennent), les tâches en retard et sans date ; ou « La liste à cocher ». Le filtre (liste, personne) choisi en haut s’applique.</li><li><b>Retirer une date</b> : dans la tâche, bouton « ✕ » à côté de la date.</li><li><b>Plusieurs personnes</b> : dans une tâche, « Qui s’en occupe » accepte plusieurs prénoms. La première qui la fait la coche.</li><li><b>Suivi</b> : en cochant, ton prénom et l’heure sont notés. Touche « 📝 Ajouter une note » si besoin. L’onglet <b>📜 Suivi</b> montre tout ce qui a été fait, par qui et quand : filtre par groupe (Famille, Travail…), par liste et par personne, export Excel. ⚙ dans le Suivi range chaque liste dans un groupe. Pratique pour une liste de travail partagée avec des collègues.</li><li><b>🗄 Archiver</b> les tâches faites : elles quittent les listes et restent dans le Suivi.</li><li>Onglet <b>Tâches</b> en bas. Touche <b>+</b> pour en ajouter une : le texte, la liste, qui s’en occupe, une date (facultatif) et si elle revient.</li><li>Touche la case pour cocher. Une tâche qui revient passe toute seule à la date suivante. « Annuler » apparaît quelques secondes si tu t’es trompé.</li><li>En haut : choisis une liste ou une personne pour ne voir qu’elles. <b>⚙ Listes</b> pour créer tes listes (Valise, Jardin…), <b>👪 Famille</b> pour ajouter les prénoms.</li><li><b>Imprimer</b> : la liste affichée sur une feuille A4, avec des cases et 3 lignes vides par liste.</li><li>Une tâche datée apparaît aussi dans l’agenda ce jour-là (☑).</li></ul>');
 h+=d('🏖 Vacances scolaires','<ul><li><b>Réglages → Vacances scolaires</b> : active le liseré, choisis ta zone (A, B ou C) et sa couleur.</li><li><b>Calendrier officiel</b> : l’appli télécharge les dates sur data.education.gouv.fr (ministère de l’Éducation nationale). Seule la zone est envoyée. Mise à jour automatique une fois par mois, ou bouton « Mettre à jour ».</li><li><b>À la main</b> : « Ajouter une période » (nom, premier et dernier jour). Utile hors connexion, pour une autre zone ou un pont.</li><li>Le liseré apparaît en bas des jours de vacances (mois, 2 semaines, semaine, mini-calendrier) ; le nom des vacances s’affiche sur la journée.</li><li>Si tu avais déjà des événements « Vacances scolaires » (import Excel ou Outlook), tu peux les supprimer : le liseré les remplace.</li></ul>');
 h+=d('Lisibilité du mois','<ul><li>Les mots longs sont coupés par syllabes, avec un tiret.</li><li><b>Réglages → Affichage → Texte des événements dans le mois</b> : Petit (plus de lettres par ligne), Normal ou Grand.</li><li>Pour lire un titre en entier : semaine en mode Liste, ou téléphone en paysage.</li></ul>');
 h+=d('Apparence (couleurs)','<ul><li><b>Réglages → Apparence</b> : couleur de l’appli, teinte du fond, couleur des week-ends, jours fériés en rouge et style des numéros de date.</li><li>L’aperçu en haut de la carte change immédiatement.</li><li>Le bouton du bas remet tout par défaut.</li></ul>');
 h+=d('Aide à l’adresse','<ul><li>Dans « Lieu », après 4 lettres, des adresses de France sont proposées : touche la bonne.</li><li>Facultatif et désactivé par défaut : à l’activation, ce que tu tapes dans « Lieu » est envoyé au service public Base Adresse Nationale. Rien d’autre ne sort de ton téléphone.</li><li>Adresse fausse, étrangère ou hors connexion : ton texte est gardé tel quel.</li></ul>');
 h+=d('Modèles et garde alternée','<ul><li><b>Modèle</b> : dans la fiche d’un événement, touche « Enregistrer comme modèle ». Ensuite, dans « Nouvel événement », touche le modèle : tout est rempli, tu changes seulement la date.</li><li><b>Garde alternée</b> : touche « Garde alternée… » (dans Nouvel événement ou Réglages → Modèles), choisis le rythme, les jours et heures de début et de fin, à partir de quand et jusqu’à quand. Les gardes sont créées d’un coup.</li><li><b>Vacances</b> : ajoute une période (du… au…) avec « Pas de garde », « Garde toute la période », « 1re moitié » ou « 2e moitié » : les gardes normales de la période sont remplacées.</li><li>Pour changer une seule garde, ouvre-la et choisis « Cette occurrence seulement ».</li><li>Gérer ou supprimer un modèle : Réglages → Modèles et garde alternée.</li></ul>');
 h+=d('Plein écran (œil)','<ul><li>Touche l’<b>œil</b> en haut : les boutons du haut et du bas disparaissent et le calendrier occupe tout l’écran.</li><li>Pour revenir, touche l’<b>œil barré</b> en haut à droite (ou la touche Échap sur ordinateur).</li><li>Glisser à gauche ou à droite change de mois/semaine/jour.</li></ul>');
 h+=d('Choisir un emoji','<ul><li>Dans l’éditeur d’un événement, touche <b>＋ Plus…</b> : catégories, recherche par mot (« dentiste », « avion »…) et tes emojis récents.</li><li>Tu peux aussi taper ou coller un emoji de ton clavier dans le champ.</li><li><b>Réglages → Catégories</b> : le bouton à côté du nom fixe l’emoji par défaut de la catégorie.</li></ul>');
 h+=d('Importer un autre calendrier (Outlook, Excel, CSV)','<ul><li><b>Réglages → Importer un autre calendrier</b>.</li><li><b>Depuis Outlook</b> (après connexion) : tu coches les calendriers à lire et la période ; une page liste ensuite tous les événements trouvés et tu coches ceux à ajouter (recherche, tout cocher / décocher) ; ils arrivent dans AgenDam, une catégorie par calendrier. Ça ne modifie rien dans Outlook. Option « Récupérer à l’ouverture » (carte Outlook) : l’appli relit seule les calendriers choisis lors du dernier import, au plus une fois toutes les 10 minutes. Ce qui est supprimé dans Outlook n’est pas supprimé ici, et ce qui vient d’Outlook n’est pas renvoyé dans « Agenda (appli) ».</li><li><b>Depuis un fichier Excel ou CSV</b> (.xlsx, .xls, .ods, .csv) : l’appli reconnaît les colonnes (titre, dates, heures, toute la journée, lieu, notes, catégorie, rappel). Corrige-les dans la fenêtre si besoin, puis une page liste les événements : décoche ceux que tu ne veux pas avant d’importer. Les dates sont lues en jour/mois/année (le format américain est reconnu quand il est évident).</li><li>Les doublons sont ignorés : tu peux réimporter le même fichier sans risque.</li><li>Dans Excel : une ligne par événement, une ligne d’en-têtes en haut. Tu peux exporter n’importe quel calendrier (Google Agenda, Outlook…) en CSV puis l’importer ici.</li></ul>');
 h+=d('Envoyer vers le calendrier du téléphone','<ul><li>Dans <b>Réglages → Calendrier du téléphone → Choisir les événements à envoyer</b> : filtre par période ou catégorie, décoche ce que tu ne veux pas, puis touche <b>Envoyer</b>.</li><li>Le téléphone affiche alors sa page « Ajouter » : <b>c’est lui qui te laisse choisir le calendrier</b> (iCloud, Outlook…).</li><li>Dans la fiche d’un événement, <b>Au calendrier</b> envoie cet événement seul. Dans l’éditeur, le bouton « Me proposer de l’ajouter au calendrier du téléphone » le fait juste après l’enregistrement.</li><li>C’est un envoi, pas une synchronisation : après une modification, l’appli te propose « Mettre à jour » pour renvoyer l’événement. Cette proposition s’active ou se désactive dans <b>Réglages</b> (ou événement par événement dans l’éditeur).</li><li>Sur <b>Android</b>, le téléphone ouvre en général Google Agenda ou l’agenda Samsung pour confirmer l’ajout.</li><li>Sur <b>ordinateur</b>, « Au calendrier » propose : <b>Outlook.com</b> (hotmail, live), <b>Outlook travail/école</b>, <b>Google Agenda</b> (l’événement arrive déjà rempli, il suffit d’enregistrer) ou le <b>fichier .ics</b> pour Outlook installé, <b>iCloud</b> ou Apple (iCloud n’a pas de lien direct : sur Mac le .ics s’ouvre dans Calendrier, sur PC dans Outlook). Pour plusieurs événements d’un coup, utilise le .ics.</li></ul>');
 h+=d('Aller à l’adresse d’un rendez-vous','<ul><li>Quand un événement a un <b>lieu</b> (champ « Lieu »), ouvre-le (le jour même, ou n’importe quand) : la ligne du lieu est cliquable.</li><li>Touche-la : choisis <b>Plans</b> (Apple), <b>Google Maps</b> ou <b>Waze</b> ; l’appli choisie s’ouvre avec l’adresse prête. Tu peux aussi <b>copier l’adresse</b>.</li><li>Plus l’adresse est complète (numéro, rue, ville), plus le résultat est précis.</li></ul>');
 h+=d('Ordinateur, tablette et grand écran','<ul><li><b>Panneau de droite</b> : sur iPad en paysage ou ordinateur, le mini-calendrier et la liste de la journée sont à droite. Pas besoin ? Réglages → Affichage → <b>Panneau de droite : Masquer</b> : le calendrier prend toute la largeur, et toucher un jour ouvre sa liste.</li><li>L’affichage s’adapte à l’appareil : téléphone (onglets en bas), tablette et ordinateur (onglets à gauche, mini-calendrier et journée à droite, réglages sur deux colonnes), grand écran (texte et grilles agrandis).</li><li><b>Raccourcis clavier</b> sur ordinateur : flèches ← → (période précédente / suivante), <b>T</b> aujourd’hui, <b>J</b> jour, <b>S</b> semaine, <b>M</b> mois, <b>D</b> 2 semaines, <b>C</b> ou <b>/</b> chercher, <b>N</b> nouvel événement, <b>P</b> imprimer, <b>?</b> aide.</li></ul>');
 h+=d('Imprimer','<ul><li>Touche l’icône <b>imprimante</b> en haut. Depuis Jour, Semaine, Mois ou 2 sem., elle imprime la vue affichée ; depuis les autres écrans, elle te demande <b>quoi imprimer</b>. <b>Une seule page</b> par impression.</li><li><b>Sur iPhone et iPad</b> : l’appli prépare un <b>PDF d’une page A4</b> ; touche « Imprimer / Partager le PDF », puis <b>Imprimer</b> dans le menu (ou Mail, Enregistrer dans Fichiers…). Sur ordinateur et Android, la fenêtre d’impression s’ouvre directement.</li><li>Le jour s’imprime en <b>portrait</b> (avec lieu et notes) ; la semaine, le mois et les 2 semaines en <b>paysage</b>, avec l’heure devant chaque rendez-vous.</li><li>Si une case est trop chargée, « +2 » indique les événements qui ne rentrent pas : passe alors par la vue Jour.</li><li>Sur <b>iPhone</b> : si rien ne s’ouvre, touche Partager puis « Imprimer », ou « Enregistrer dans Fichiers » pour faire un PDF.</li></ul>');
 h+=d('Ajouter à l’agenda du téléphone','<ul><li>Réglages → <b>Ajouter à mon agenda</b>. Sur <b>iPhone</b>, choisis « Calendrier » puis « Tout ajouter ». Sur <b>Android</b>, ouvre le fichier avec Google Agenda ou Outlook.</li><li>C’est un <b>envoi unique</b>, pas une synchronisation : refais-le après une modification (les événements déjà présents sont mis à jour par l’agenda, selon l’appli). L’intérêt : les rappels de l’agenda natif sont fiables, même appli fermée.</li></ul>');
 h+=d('Import et export .ics','<ul><li><b>Exporter</b> : crée un fichier .ics (calendrier standard) avec tes événements, leurs répétitions et leurs rappels. Les rotations sont exportées jour par jour (environ 14 mois).</li><li><b>Importer</b> : lis un fichier .ics venant de Google Agenda, Apple, Outlook… Les événements déjà présents ne sont pas dupliqués. Les fuseaux horaires sont lus comme heure locale.</li></ul>');
 h+=d('Mettre à jour l’appli (et partages sur iPhone)',UPD_HOW);
 h+=d('Installer sur iPhone ou Android','<p><b>iPhone (Safari)</b> : ouvre le lien dans <b>Safari</b> → bouton Partager (carré avec flèche) → <b>Sur l’écran d’accueil</b> → Ajouter.</p><p><b>Android (Chrome)</b> : ouvre le lien → menu ⋮ → <b>Installer l’application</b> (ou « Ajouter à l’écran d’accueil »).</p><p>Une fois installée, l’appli fonctionne <b>sans connexion</b>.</p>');
 h+=d('Confidentialité et stockage','<ul><li>Aucun compte, aucun serveur, aucune publicité, aucune statistique : tes données restent sur l’appareil.</li><li>Sur iPhone, Safari peut effacer les données d’un site non installé après environ 7 jours sans visite. <b>Installe l’appli sur l’écran d’accueil et sauvegarde</b> pour ne rien perdre.</li></ul>');
 h+='<details id="hist"'+(hist?' open':'')+'><summary>Historique des 5 dernières versions</summary>'+CHANGELOG.slice(0,5).map(c=>'<div class="ver"><b>Version '+c.v+' · '+c.d+'</b><ul>'+c.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>').join('')+'<p class="mut">Tout l’historique depuis le début : Réglages → Outils développeur.</p></details>';
 h+='<p class="mut" style="margin-top:1rem">AgenDam · version '+APP_VERSION+'</p>';
 openSheet(h,'full');
 if(hist){const x=$('#hist');if(x)x.scrollIntoView()}
}

function openDaySheet(day){
 let h='<div class="sh-h"><b style="font-size:1.2rem;color:var(--text)">'+cap(fLong(day))+'</b><span class="sp1"></span><button class="x" data-act="close" aria-label="Fermer">'+ic('x')+'</button></div><p class="mut" style="margin:0 0 .3rem;font-weight:650">'+relDay(day)+'</p>';
 const rows=dayRows(day);
 const extra=bdDayHTML(day)+vyDayHTML(day)+tkDayHTML(day)+rpDayHTML(day);
 h+='<div style="margin:0 -1rem">'+(rows||(extra?'':'<p class="empty">Rien de prévu ce jour-là.</p>'))+'</div>'+(extra?'<div class="dsx">'+extra+'</div>':'');
 h+='<div class="btns"><button class="btn pri grow" data-act="goday" data-date="'+day+'">Ouvrir la journée</button><button class="btn" data-act="newon" data-date="'+day+'">'+ic('plus')+' Ajouter</button></div>';
 openSheet(h);
}

async function doBackup(share){
 if(demo){toast('Quitte d’abord le mode démo');return}
 const bo=backupObj();try{const ph=await PH.all();if(Object.keys(ph).length)bo.photos=ph}catch(e){}
 const text=JSON.stringify(bo,null,1);
 if(!share&&canShareFiles())share=true;
 let done=false;
 if(!share&&window.showSaveFilePicker){
  try{const h=await window.showSaveFilePicker({suggestedName:BACKUP_FILE,id:'agd-sauvegarde',startIn:'documents',types:[{description:'Sauvegarde AgenDam',accept:{'application/json':['.json']}}]});
   const w=await h.createWritable();await w.write(text);await w.close();done=true}
  catch(e){if(e&&e.name==='AbortError')return}}
 if(done){}
 else if(share){const r=await shareFile(BACKUP_FILE,'application/json',text);if(r==='cancel')return;if(!r){toast('Partage impossible, enregistrement du fichier…');downloadFile(BACKUP_FILE,'application/json',text)}}
 else downloadFile(BACKUP_FILE,'application/json',text);
 backupDone();
 await ask({title:'Sauvegarde créée ✔',html:'<p style="margin:.3rem 0">Fichier : <b>'+BACKUP_FILE+'</b> ('+EV.length+' événement'+(EV.length>1?'s':'')+').</p><div class="warn"><b>Pour un autre appareil</b>Il ne se synchronise pas tout seul : envoie ce fichier dessus, puis ouvre Réglages → <b>Restaurer</b>.</div>',btns:[{label:'Compris',value:1,cls:'pri'}]});
 if(V.view==='settings')render();
}
async function restoreFile(file){
 let text;try{text=await file.text()}catch(e){toast('Lecture du fichier impossible');return}
 const b=parseBackup(text);
 if(!b){toast('Ce fichier n’est pas une sauvegarde valide');return}
 let photos=null;try{const o=JSON.parse(text);if(o&&o.photos&&typeof o.photos==='object')photos=o.photos}catch(e){}
 const r=await ask({title:'Restaurer la sauvegarde',html:'<p style="margin:.3rem 0">'+b.events.length+' événement'+(b.events.length>1?'s':'')+(b.exportedAt?' · créée le '+fmtDate(Date.parse(b.exportedAt)):'')+'.</p><p class="hint">« Remplacer » efface l’agenda actuel de cet appareil. « Fusionner » ajoute ce qui manque.</p>',
  btns:[{label:'Remplacer mon agenda',value:'replace',cls:'pri'},{label:'Fusionner',value:'merge'},{label:'Annuler',value:null}]});
 if(!r)return;
 if(demo)demoOff();
 if(r==='replace'){
  EV=b.events;
  if(b.settings){const keep={notif:S.notif};S=Object.assign({},DEF_SET,b.settings,keep);if(!S.cats||!S.cats.length)S.cats=DEF_CATS.map(c=>Object.assign({},c));saveSet();setTheme()}
 }else{
  const ids=new Set(EV.map(e=>e.id));let n=0;
  b.events.forEach(e=>{const i=EV.findIndex(x=>x.id===e.id);if(i>=0)EV[i]=e;else{EV.push(e);n++}});
  if(b.settings&&Array.isArray(b.settings.tpls)){const T=tplList();b.settings.tpls.forEach(t=>{if(t&&t.name&&!T.some(x=>x.id===t.id))T.push(t)});saveSet()}
  if(b.settings&&b.settings.cats){b.settings.cats.forEach(c=>{if(!S.cats.some(x=>x.id===c.id))S.cats.push(c)});saveSet()}
  const st=b.settings||{};
  try{
   if(Array.isArray(st.ppl))st.ppl.forEach(p=>{if(p&&p.id&&!ppl().some(x=>x.id===p.id))ppl().push(p)});
   if(Array.isArray(st.tk))shMerge({k:'tk',tl:st.tl||[],tk:st.tk,del:st.tkDel||[],ppl:[]},true);
   if(Array.isArray(st.bd))shMerge({k:'bd',bd:st.bd,del:st.bdDel||[]},true);
   if(Array.isArray(st.rc)||st.mn)shMerge({k:'mn',rc:st.rc||[],mn:st.mn||{},ppl:[]},true);
   if(Array.isArray(st.vy))shMerge({k:'vy',vy:st.vy,del:st.vyDel||[],mn:{},rc:[],ppl:[]},true);
   if(Array.isArray(st.vyT))st.vyT.forEach(t=>{if(t&&t.id&&!vyTpls().some(x=>x.id===t.id))vyTpls().push(t)});
  }catch(e){}
  saveSet();
 }
 if(photos){for(const k of Object.keys(photos)){if(typeof photos[k]==='string'&&photos[k].indexOf('data:image/')===0){try{await PH.put(k,photos[k])}catch(e){}}}}
 saveData();META.dirtySince=null;META.lastBackup=Date.now();saveMeta();
 render();toast('Sauvegarde restaurée');
}
async function importICS(file){
 let text;try{text=await file.text()}catch(e){toast('Lecture du fichier impossible');return}
 if(!/BEGIN:VCALENDAR/i.test(text)){toast('Ce fichier n’est pas un calendrier .ics');return}
 const r=parseICS(text);
 if(!r.events.length){toast('Aucun événement trouvé');return}
 const ids=new Set(EV.map(e=>e.id));
 const fresh=r.events.filter(e=>!ids.has(e.id));
 const dup=r.events.length-fresh.length;
 if(!fresh.length){toast('Tous ces événements sont déjà présents (rien à importer)',4500);return}
 const go=await ask({title:'Importer ce calendrier',text:fresh.length+' événement'+(fresh.length>1?'s':'')+' à ajouter'+(dup?', '+dup+' déjà présent'+(dup>1?'s':'')+' (ignoré'+(dup>1?'s':'')+')':'')+(r.skipped?', '+r.skipped+' illisible'+(r.skipped>1?'s':''):'')+'.',btns:[{label:'Importer',value:'y',cls:'pri'},{label:'Annuler',value:null}]});
 if(go!=='y')return;
 if(demo)demo=false;
 EV.push(...fresh);touch();render();toast(fresh.length+' événement'+(fresh.length>1?'s':'')+' importé'+(fresh.length>1?'s':''));
}

function tick(){

 if(demo)return;
 const n=Date.now(),t0=today();
 const fired=ls.get(K.fired,{});let ch=false;
 for(const o of occsMine(add(t0,-1),add(t0,2))){
  if(o.ev.alarm==null)continue;
  const base=o.allDay?atTime(o.date,540):atTime(o.date,o.s);
  const at=base.getTime()-o.ev.alarm*60000;
  const end=atTime(o.endDate,o.allDay?1440:o.e).getTime();
  const key=o.ev.id+'|'+o.date;
  if(n>=at&&n-at<30*60000&&n<end&&!fired[key]){
   fired[key]=n;ch=true;
   notify(o.ev.title,(o.allDay?'Journée entière':hm(o.s)+' – '+hm2(o.e))+(o.ev.place?' · '+o.ev.place:''),key);
  }
 }
 for(const k in fired)if(n-fired[k]>4*864e5){delete fired[k];ch=true}
 if(ch)ls.set(K.fired,fired);
}

/* ========= Tâches : listes à cocher, date facultative, qui s'en occupe, répétition, impression A4 =========
   Stockées dans les réglages (S.tl listes, S.tk tâches, S.ppl famille) : incluses dans la sauvegarde .json. */
const TK_DEF_LISTS=[{id:'maison',n:'Maison',i:'🏠'},{id:'courses',n:'Courses',i:'🛒'},{id:'perso',n:'Perso',i:'📝'}];
const PPL_COLS=['#2563eb','#db2777','#16a34a','#ea580c','#7c3aed','#0d9488','#ca8a04','#475569'];
const TK_REP=[['','Non'],['d1','Chaque jour'],['w1','Chaque semaine'],['w2','Toutes les 2 semaines'],['m1','Chaque mois']];
const TKV={l:'',w:''};
function tkLists(){if(!Array.isArray(S.tl)||!S.tl.length)S.tl=TK_DEF_LISTS.map(x=>Object.assign({},x));return S.tl}
const tkAll=()=>Array.isArray(S.tk)?S.tk:(S.tk=[]);
const ppl=()=>Array.isArray(S.ppl)?S.ppl:(S.ppl=[]);
const pplOf=id=>id?ppl().find(p=>p.id===id):null;
const tlOf=id=>tkLists().find(l=>l.id===id)||tkLists()[0];
const tkRepKey=r=>r?r.f+r.i:'';
const tkRepTxt=r=>{const x=TK_REP.find(o=>o[0]===tkRepKey(r));return x?x[1]:''};
function tkStep(d,r){
 const x=pd(d);
 if(r.f==='d')x.setDate(x.getDate()+r.i);
 else if(r.f==='w')x.setDate(x.getDate()+7*r.i);
 else{const md=r.md||x.getDate();x.setDate(1);x.setMonth(x.getMonth()+r.i);x.setDate(Math.min(md,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
 return ds(x);
}
/* la tâche tombe-t-elle ce jour-là ? (pour une répétition : à partir de sa prochaine échéance) */
function tkHits(k,day){
 if(!k.d||k.x)return false;
 if(!k.r)return k.d===day;
 let d=k.d,n=0;while(d<day&&n<800){d=tkStep(d,k.r);n++}
 return d===day;
}
const tkOn=day=>tkAll().filter(k=>tkHits(k,day));
function tkMark(d){return tkOn(d).length?'<em class="tkm" title="Tâches">☑</em>':''}
/* Plusieurs personnes par tâche (k.ws) : la première qui la fait la coche. Qui l'a faite, quand, avec une note : k.xb, k.xa, k.xn.
   Tâches qui reviennent : chaque fois est gardée dans k.h. Archiver (k.ar) les retire de la liste, elles restent dans « Suivi ». */
const tkWho=k=>Array.isArray(k.ws)&&k.ws.length?k.ws:(k.w?[k.w]:[]);
const tkFor=(k,w)=>!w||tkWho(k).includes(w);
const tkPack=(k,map)=>({id:k.id,t:k.t,l:k.l,d:k.d||'',w:map?(map(k.w)||''):(k.w||''),ws:tkWho(k).map(x=>map?map(x):x).filter(Boolean),r:k.r||null,n:k.n||'',x:!!k.x,xa:k.xa||0,xb:k.xb||'',xn:k.xn||'',ar:k.ar||0,h:Array.isArray(k.h)?k.h.slice(-30):undefined,m:k.m||k.ca||0,ig:k.ig||undefined,ry:k.ry||undefined});
function tkMeta(k,showList){
 const P=tkWho(k).map(pplOf).filter(Boolean),t=today(),m=[];
 if(k.d)m.push('<span class="'+(!k.x&&k.d<t?'tk-late':'')+'">'+(k.d===t?'Aujourd’hui':k.d===add(t,1)?'Demain':esc(fShort(k.d)))+'</span>');
 if(k.r)m.push('🔁 '+esc(tkRepTxt(k.r)));
 P.forEach(p=>m.push('<span class="tk-p" style="--c:'+p.c+'">'+esc(p.n)+'</span>'));
 if(k.x&&(k.xb||k.xa))m.push('<span class="tk-by">✓ '+(k.xb?'par '+esc(k.xb)+' ':'')+(k.xa?esc(tkWhen(k.xa)):'')+'</span>');
 if(k.x&&k.xn)m.push('💬 '+esc(k.xn.slice(0,60)));
 if(!k.x&&Array.isArray(k.h)&&k.h.length){const z=k.h[k.h.length-1];m.push('<span class="tk-by">dernière fois : '+esc(z.b||'')+' '+esc(tkWhen(z.a))+'</span>')}
 if(showList){const l=tlOf(k.l);if(l)m.push(esc((l.i?l.i+' ':'')+l.n))}
 if(k.n)m.push('📝');
 return m.join(' · ');
}
/* Suivi par groupe (Famille, Travail…) : une liste peut être rangée dans un groupe (S.tlGrp) ; sinon on devine :
   la personne qui l'a faite, d'où vient la tâche, à qui elle est confiée, puis les autres tâches de la même liste. */
function tkGrpOpts(){return famAll().map(g=>({k:g.k,l:(g.em||'👥')+' '+(g.nm||'Groupe')})).concat([{k:'perso',l:'🙋 Perso'}])}
function tkGrpRaw(k,b){
 const G=famAll();if(!G.length)return '';
 const me=norm(meName()||'');
 if(b&&norm(b)!==me){const g=G.find(g=>Object.keys(g.mb).some(id=>id!==g.me&&!g.mb[id].self&&norm(g.mb[id].n)===norm(b)));if(g)return g.k}
 const o=S.forg&&S.forg[k.id];if(o){const g=grpOf(o);if(g&&!g.mb[o].self)return g.k}
 for(const w of tkWho(k))for(const g of G)if(Object.keys(g.mb).some(id=>id!==g.me&&!g.mb[id].x&&famCid(id)===w))return g.k;
 return '';
}
function tkListGrp(lid,cache){
 if(S.tlGrp&&S.tlGrp[lid])return S.tlGrp[lid];
 if(cache&&cache[lid]!=null)return cache[lid];
 const n={};for(const k of tkAll())if(k.l===lid){const g=tkGrpRaw(k,k.xb);if(g)n[g]=(n[g]||0)+1}
 const best=Object.keys(n).sort((a,b)=>n[b]-n[a])[0]||'perso';if(cache)cache[lid]=best;return best;
}
function tkEvGrp(e,cache){
 if(S.tlGrp&&S.tlGrp[e.k.l])return S.tlGrp[e.k.l];
 return tkGrpRaw(e.k,e.b)||tkListGrp(e.k.l,cache);
}

const coKey=n=>norm(n).replace(/s$/,'').trim();
function coRemember(it){if(!it||!it.n)return;const k=coKey(it.n);if(!k)return;const H=coHist(),h=H[k]||{n:it.n,c:0};h.n=it.n;h.u=it.u||'';h.q=it.q==null?null:it.q;h.ry=rayOf(it.n);h.c=(h.c||0)+1;h.at=Date.now();H[k]=h;
 const ks=Object.keys(H);if(ks.length>400){ks.sort((x,y)=>(H[x].c*1e13+H[x].at)-(H[y].c*1e13+H[y].at)).slice(0,ks.length-400).forEach(x=>delete H[x])}}

/* Doublons de la liste type : même nom à l'accent, au pluriel, à la quantité ou à une faute près */
const CO_STOP=new Set(['de','du','des','la','le','les','l','d','en','a','au','aux','et']);
function coDupKey(n){
 let t=norm(n).replace(/[’'`]/g,' ').replace(/[^a-z0-9 ]+/g,' ').trim();
 t=t.replace(/^\d+([.,]\d+)?\s*(x|g|gr|kg|l|cl|ml|paquets?|boites?|sachets?|bouteilles?|pots?|packs?|tranches?|barquettes?)?\s+/,'');
 return t.split(/\s+/).filter(w=>w&&!CO_STOP.has(w)).map(w=>w.length>3?w.replace(/(s|x)$/,''):w).join(' ');
}
function coLev(a,b,max){
 if(Math.abs(a.length-b.length)>max)return max+1;
 let pr=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){const cu=[i];let mn=i;for(let j=1;j<=b.length;j++){cu[j]=Math.min(pr[j]+1,cu[j-1]+1,pr[j-1]+(a[i-1]===b[j-1]?0:1));if(cu[j]<mn)mn=cu[j]}if(mn>max)return max+1;pr=cu}
 return pr[b.length];
}
function coDups(){
 const H=coHist(),ks=Object.keys(H),D=ks.map(k=>coDupKey(H[k].n)),ok=new Set(Array.isArray(S.coDupOk)?S.coDupOk:[]);
 const par=ks.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
 for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){
  const a=D[i],b=D[j];if(!a||!b)continue;
  const L=Math.min(a.length,b.length);const max=L>=8?2:L>=5?1:0;
  if(a===b||(max&&coLev(a,b,max)<=max)){if(ok.has([ks[i],ks[j]].sort().join('|')))continue;par[f(i)]=f(j)}
 }
 const G={};ks.forEach((k,i)=>{const r=f(i);(G[r]=G[r]||[]).push(k)});
 const q=k=>/^\d/.test(H[k].n)?1:0;
 return Object.values(G).filter(g=>g.length>1).map(g=>g.sort((x,y)=>q(x)-q(y)||(H[y].c||0)-(H[x].c||0)||(H[y].at||0)-(H[x].at||0)));
}
async function coDupManage(){
 const H=coHist(),G=coDups();
 if(!G.length){toast('Aucun doublon dans ta liste type 👍',3500);return}
 const keep=G.map(g=>g[0]);
 const html='<p style="margin:.2rem 0 .5rem">'+G.length+' groupe'+(G.length>1?'s':'')+' de produits qui se ressemblent. Pour chacun, coche <b>celui à garder</b> : les autres sont supprimés de ta liste type (leurs achats comptent pour celui gardé).</p><div class="olbox">'+
  G.map((g,gi)=>'<div class="dup-g">'+g.map(k=>'<label class="olrow"><input type="radio" name="dg'+gi+'" data-dg="'+gi+'" value="'+esc(k)+'"'+(k===keep[gi]?' checked':'')+'><span><b>'+esc(cap(H[k].n))+'</b>'+(H[k].c?' <small class="mut">· acheté '+H[k].c+' fois</small>':'')+'</span></label>').join('')+
   '<label class="olrow dup-no"><input type="radio" name="dg'+gi+'" data-dg="'+gi+'" value=""><span>Pas un doublon, tout garder</span></label></div>').join('')+'</div>';
 const pr=ask({title:'🧹 Doublons de la liste type',html,btns:[{label:'Supprimer les doublons',value:'ok',cls:'pri'},{label:'Annuler',value:null}]});

function plainPDF(title,blocks){

 const W=595,H=842,M=46,pages=[];let cur=null,y=0;const bot=M+24;
 const wrap=(t,n)=>{const w=[];let l='';for(const word of String(t).split(' ')){if((l+' '+word).trim().length>n&&l){w.push(l);l=word}else l=(l+' '+word).trim()}if(l)w.push(l);return w};
 const np=()=>{cur=[];pages.push(cur);y=H-M-10};np();
 cur.push('BT /F2 20 Tf '+M+' '+y+' Td '+pdfStr(tkPlain(title))+' Tj ET');y-=34;
 for(const b of blocks){
  if(b.h!=null){if(y-40<bot)np();cur.push('BT /F2 13 Tf '+M+' '+y+' Td '+pdfStr(tkPlain(b.h))+' Tj ET');cur.push('0.5 w '+M+' '+(y-4)+' m '+(W-M)+' '+(y-4)+' l S');y-=22;continue}
  const tl=wrap(tkPlain(b.t),b.box?70:78);if(y-16*tl.length-(b.sub?12:0)<bot)np();
  if(b.box)cur.push('0.9 w '+M+' '+(y-2)+' 10 10 re S');
  tl.forEach(t=>{cur.push('BT /F1 11.5 Tf '+(M+(b.box?18:0))+' '+y+' Td '+pdfStr(t)+' Tj ET');y-=15});
  if(b.sub){cur.push('BT /F1 9 Tf '+(M+(b.box?18:0))+' '+(y+2)+' Td 0.35 g '+pdfStr(tkPlain(b.sub))+' Tj 0 g ET');y-=11}
  y-=5;
 }
 pages.forEach((c,i)=>c.push('BT /F1 8 Tf 0.4 g '+M+' '+(M-8)+' Td '+pdfStr('AgenDam'+(pages.length>1?'  -  page '+(i+1)+'/'+pages.length:''))+' Tj 0 g ET'));
 const objs=[];const addO=s=>{objs.push(s);return objs.length};
 addO('<< /Type /Catalog /Pages 2 0 R >>');addO('PAGES');addO('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');addO('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const kids=[];for(const c of pages){const st=c.join('\n');const cid=addO('<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream');kids.push(addO('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cid+' 0 R >>')+' 0 R')}
 objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
 let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});const xr=out.length;
 out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}

 open(){if(!this.db)this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('agd-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},

 get(id){return this.tx('readonly',st=>st.get(id)).catch(()=>null)},

 async all(){try{const db=await this.open();return await new Promise(res=>{const o={},t=db.transaction('ph'),c=t.objectStore('ph').openCursor();c.onsuccess=()=>{const x=c.result;if(x){o[x.key]=x.value;x.continue()}else res(o)};c.onerror=()=>res(o)})}catch(e){return{}}}
};

/* ========= Importer des anniversaires depuis n'importe quoi : Word, Excel, CSV, texte, calendrier, contacts ========= */
const BD_MO=[['janv',1],['jan',1],['févr',2],['fevr',2],['fév',2],['fev',2],['mars',3],['mar',3],['avr',4],['mai',5],['juin',6],['juil',7],['août',8],['aout',8],['sept',9],['sep',9],['oct',10],['nov',11],['déc',12],['dec',12],
 ['january',1],['february',2],['march',3],['april',4],['may',5],['june',6],['july',7],['august',8],['september',9],['october',10],['november',11],['december',12]];
const BD_MO_RX='(janvier|janv|jan|février|fevrier|févr|fevr|fév|fev|mars|mar|avril|avr|mai|juin|juillet|juil|août|aout|septembre|sept|sep|octobre|oct|novembre|nov|décembre|decembre|déc|dec|january|february|march|april|may|june|july|august|september|october|november|december)\\.?';
const moNum=w=>{w=String(w||'').toLowerCase().replace(/\.$/,'');for(const [k,n] of BD_MO)if(w.indexOf(k)===0)return n;return 0};
function bdParseText(txt){
 const out=[],y0=new Date().getFullYear();let curM=0;
 const lines=String(txt||'').replace(/\r/g,'').split(/\n|;(?=\s*\S+\s*[;:,-]?\s*\d)/);
 for(let raw of lines){
  let l=raw.replace(/[\t|]+/g,' ').replace(/\s+/g,' ').trim();if(!l)continue;
  const onlyMo=l.match(new RegExp('^'+BD_MO_RX+'(\\s+\\d{4})?\\s*:?$','i'));if(onlyMo){curM=moNum(onlyMo[1]);continue}
  let d=0,m=0,y=0,hit='';
  let r=l.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(r){y=+r[1];m=+r[2];d=+r[3];hit=r[0]}
  if(!hit){r=l.match(/(?<![\d])(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?(?![\d])/);if(r){d=+r[1];m=+r[2];if(r[3]){y=+r[3];if(y<100)y+=y>(y0%100)?1900:2000}hit=r[0]}}
  if(!hit){r=l.match(new RegExp('(\\d{1,2})(?:er)?\\s+'+BD_MO_RX+'(?:\\s+(\\d{4}))?','i'));if(r){d=+r[1];m=moNum(r[2]);if(r[3])y=+r[3];hit=r[0]}}
  if(!hit){r=l.match(new RegExp(BD_MO_RX+'\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?','i'));if(r){m=moNum(r[1]);d=+r[2];if(r[3])y=+r[3];hit=r[0]}}
  if(!hit&&curM){r=l.match(/^(\d{1,2})(?:er)?\b|\b(\d{1,2})$/);if(r){d=+(r[1]||r[2]);m=curM;hit=r[0]}}
  if(!hit)continue;
  let n=l.replace(hit,' ');
  const age=n.match(/\(?\s*(\d{1,3})\s*ans?(?:\s+en\s+(\d{4}))?\s*\)?/i);
  if(age){if(!y&&age[2])y=+age[2]-(+age[1]);n=n.replace(age[0],' ')}
  n=n.replace(/["“”«»]/g,' ').replace(/[🎂🎈🎉🎁🔒•·▪◦*]/gu,' ').replace(/\b(joyeux\s+)?anniv(ersaire)?s?\b\.?/gi,' ').replace(/\b(n[ée]e?|le|du|de la|de|des|d['’])\b/gi,' ').replace(/\[[ x]?\]|☐|☑/g,' ').replace(/^[\s:,;\-–—]+|[\s:,;\-–—]+$/g,'').replace(/\s+/g,' ').trim();
  if(!n||n.length>60||/^\d+$/.test(n))continue;
  const mx=[31,29,31,30,31,30,31,31,30,31,30,31][m-1];
  if(!(m>=1&&m<=12&&d>=1&&d<=mx))continue;
  if(y&&(y<1900||y>y0))y=0;
  const key=norm(n)+'|'+d+'|'+m;if(out.some(o=>o.key===key))continue;
  out.push({key,n:n.charAt(0).toUpperCase()+n.slice(1),d,m,y});
 }
 return out.map(({key,...o})=>o);
}
/* lecture minimale d'un .docx / .odt (zip) sans bibliothèque */
async function zipText(buf,names){
 const u=new Uint8Array(buf),dv=new DataView(buf);
 let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Fichier illisible');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),fl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(u.subarray(p+46,p+46+fl));p+=46+fl+xl+cl;
  if(!names.includes(name))continue;
  const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u.subarray(st,st+csz);
  if(meth===0)return new TextDecoder().decode(data);
  if(meth===8){if(!window.DecompressionStream)throw new Error('Ce téléphone est trop ancien pour lire ce fichier');return new TextDecoder().decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
 }
 return null;
}

/* ========= Famille connectée v2 : chacun choisit ce qu'il partage, et avec qui =========
   Clé de la famille (dans le code d'invitation) : sert seulement à se reconnaître entre membres (fiches « m-… »).
   Chaque téléphone a sa propre paire de clés (ECDH P-256). Entre deux personnes, une clé à elles deux est calculée :
   ce que Damien partage avec Morgane est chiffré avec la clé Damien↔Morgane, illisible pour les autres membres et pour le serveur.
   Chaque élément garde son « origine » (S.forg) : on n'envoie que ses propres éléments (selon ce qu'on a autorisé)
   et les éléments de l'autre qu'on a modifiés (case cochée…). Retirer un droit retire les éléments chez l'autre. */
const FAM_URL_DEF='https://agendam-famille.dam-cigogne.workers.dev';
const famUrl=()=>(S.famUrl||FAM_URL_DEF||'').replace(/\/+$/,'');
/* Plusieurs groupes en parallèle (Famille, Amis…) : S.fams. Chaque groupe a sa clé, ses membres, ses partages.
   L'origine des éléments (S.forg) est commune à tous les groupes : ce qui vient d'un ami n'est jamais renvoyé à la famille. */
function famMig(){
 if(S.fam&&!S.fams){S.fams=[S.fam];if(!S.fam.nm)S.fam.nm='Famille';if(!S.fam.em)S.fam.em='👪'}
 if(S.fam){if(S.fam.org){S.forg=Object.assign({},S.fam.org,S.forg||{});delete S.fam.org}delete S.fam}
 if(!S.forg)S.forg={};
}
const famAll=()=>{famMig();return (S.fams||[]).filter(g=>g&&g.k&&g.on)};
const fam=()=>famAll()[0]||null;
const grpOf=id=>famAll().find(g=>g.mb&&g.mb[id]&&id!==g.me)||null;
const mbOf=id=>{const g=grpOf(id);return g?g.mb[id]:null};
const grpIdx=g=>(S.fams||[]).indexOf(g);
const grpLbl=g=>(g.em||'👥')+' '+(g.nm||'Groupe');
let FG=null;
const FAM_G=[['co','🛒 Courses'],['tk','☑ Tâches'],['ag','📅 Agenda'],['rp','🍽 Repas (menu et recettes)'],['bd','🎂 Anniversaires'],['vy','🧳 Voyages']];
let FAM_T=null,FAM_BUSY=false,FAM_ERR='',FAM_PK={};
const FAM_KS={};
async function famKeys(f){
 if(!f||!f.k)return null;
 if(FAM_KS[f.k])return FAM_KS[f.k];
 const raw=shB64.dec(f.k);
 const h=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
 const space=[...h.slice(0,16)].map(b=>b.toString(16).padStart(2,'0')).join('');
 const kb=await crypto.subtle.digest('SHA-256',new Uint8Array([...raw,...new TextEncoder().encode('agendam-cle')]));
 const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['encrypt','decrypt']);
 return FAM_KS[f.k]={k:f.k,space,key};
}
async function famEncK(obj,key){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const z=await shZip(obj);
 const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(z)));
 return{c:shB64.enc(c),iv:shB64.enc(iv)};
}
async function famDecK(o,key){
 const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:shB64.dec(o.iv)},key,shB64.dec(o.c));
 return shUnzip(new TextDecoder().decode(p));
}
function famInit(f){['mb','gr','rg','sent'].forEach(k=>{if(!f[k]||typeof f[k]!=='object')f[k]={}});return f}
async function famMe(f){
 famInit(f);if(f.me&&f.priv&&f.pub)return f;
 f.me=Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
 const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
 f.priv=await crypto.subtle.exportKey('jwk',kp.privateKey);f.pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
 ls.set(K.set,S);return f;
}
async function famPair(f,id){
 const m=f&&f.mb&&f.mb[id];if(!m||!m.pub||!f.priv)return null;
 const ck=f.me+'|'+m.pub.x+m.pub.y;
 if(FAM_PK[id]&&FAM_PK[id].ck===ck)return FAM_PK[id].key;
 const priv=await crypto.subtle.importKey('jwk',f.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);
 const pub=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pub.x,y:m.pub.y},{name:'ECDH',namedCurve:'P-256'},false,[]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:pub},priv,256));
 const kb=await crypto.subtle.digest('SHA-256',new Uint8Array([...bits,...new TextEncoder().encode('agendam-paire:'+[f.me,id].sort().join(':'))]));
 const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['encrypt','decrypt']);
 FAM_PK[id]={ck,key};return key;
}
const famOrg=id=>(S.forg&&S.forg[id])||(FG&&FG.me)||'';
// « À moi » vu de l'interface : sans origine, ou créé sur un de mes appareils
const famMine=id=>{const o=S.forg&&S.forg[id];return !o||famAll().some(g=>g.me===o||(g.mb[o]&&g.mb[o].self))};
const famMembers=g=>(g?[g]:famAll()).flatMap(f=>f.mb?Object.keys(f.mb).filter(id=>id!==f.me):[]);
const famActive=()=>famMembers().filter(id=>{const m=mbOf(id);return m&&!m.x&&!m.self&&!m.gone});
const famDev=()=>{const u=navigator.userAgent||'';return /iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)?'iPad':/iPhone/.test(u)?'iPhone':/Android/.test(u)?(/Mobile/.test(u)?'Android':'Tablette'):'Ordinateur'};
const famName=id=>{const m=mbOf(id);return m?m.n||'?':'?'};
function famCid(id){

 if(m.cid&&pplOf(m.cid))return m.cid;
 const p=ppl().find(x=>norm(x.n)===norm(m.n))||ppl().find(x=>norm(pplName(x))===norm(m.n));

function famCoArr(g){return Array.isArray(g.cos)?g.cos.slice():(g.co?['courses']:[])}
const famCoShared=(g,lid)=>famCoArr(g).includes(lid);
function famGrant(id){const g=grpOf(id);return Object.assign({co:0,tk:0,rp:0,bd:0,vy:0,ag:0},(g&&g.gr&&g.gr[id])||{})}
function famAgOn(){return S.cats.some(c=>c.sh)||famAll().some(f=>Object.values(f.gr||{}).some(g=>g&&g.ag&&!g.removed))}
/* --- catégories communes (agenda dans les deux sens) ---
   Chez celui qui partage : catégorie « cid ». Chez l'autre : catégorie « x-<id du partageur>-cid » marquée sh.
   Chaque événement partagé porte mt (dernière modification) ; les suppressions partent en « pierres tombales » (S.evDel). */
const AGF=['title','allDay','start','end','startTime','endTime','place','icon','rec','ex','hi'];
const agCore=e=>famHash({c:e.cat,f:AGF.map(k=>e[k])});
const agTrim=a=>(Array.isArray(a)?a:[]).filter(d=>d&&d.id&&Date.now()-(d.m||0)<120*864e5).slice(-600);
function agOwnShared(g){if(!g||!g.ag||g.removed||g.agb)return new Set();return new Set(S.cats.filter(c=>!c.sh&&(g.ag===2||(g.agc||[]).includes(c.id))).map(c=>c.id))}
function agWin(e){const from=add(today(),-30),to=add(today(),400);return e.rec?(e.start<=to&&(!e.rec.until||e.rec.until>=from)):(e.end>=from&&e.start<=to)}
/* avant chaque envoi : date de modification et suppressions détectées toutes seules */
function agPrep(){
 const U=new Set();
 for(const f of famAll())for(const id of famMembers(f)){const m=f.mb[id];if(!m||m.x||m.self)continue;const own=agOwnShared(famGrant(id)),px='x-'+id+'-';
  for(const e of EV)if(!e.pv&&(own.has(e.cat)||String(e.cat).indexOf(px)===0))U.add(e.id)}
 const H=S.evH&&typeof S.evH==='object'?S.evH:(S.evH={});let ch=false;const now=Date.now();
 for(const e of EV){if(!U.has(e.id))continue;const h=agCore(e);if(H[e.id]!==h){H[e.id]=h;e.mt=now;ch=true}}
 for(const id of Object.keys(H))if(!U.has(id)){delete H[id];S.evDel=agTrim(S.evDel).filter(d=>d.id!==id).concat([{id,m:now}]);ch=true}
 if(ch&&!demo){ls.set(K.data,{v:1,events:EV});ls.set(K.set,S)}
}
/* rendez-vous envoyés à une personne : pas les privés, pas les notes ni les rappels ; de -30 jours à +400 jours */
function famAgEv(g,id){

 if(g&&g.ag&&!g.removed&&g.agb){const cats=new Set(Array.isArray(g.agc)?g.agc:[]);
  const L=EV.filter(e=>!e.pv&&!String(e.cat).startsWith('x-')&&(g.ag===2||cats.has(e.cat))&&agWin(e)).slice(0,1500);

 }else{

  h+='<p style="margin:.6rem 0 .2rem">'+(FAM_ERR?'⚠️ <b>Pas de connexion au serveur</b> ('+esc(FAM_ERR)+'). Les changements partiront dès que possible.':'✅ <b>Connecté</b> <small class="mut">· dernière mise à jour '+esc(t(last))+'</small>')+'</p>';
  for(const g of G){
   const gi=grpIdx(g),L=famMembers(g),act=L.filter(id=>!g.mb[id].x),out=L.filter(id=>g.mb[id].x&&!g.mb[id].gone);

   if(!act.length)h+='<p class="mut" style="font-size:.88rem;margin:.2rem 0 .5rem">Personne pour l’instant. Touche « 🔢 Inviter » et donne le code.</p>';
   h+=act.map(id=>famMbRow(id,g)).join('');
   if(out.length)h+='<details class="fam-out"><summary>Personnes retirées ('+out.length+')</summary>'+out.map(id=>'<div class="fam-mb"><div class="fam-mb-t"><b>'+esc(famName(id))+'</b><small>Ne reçoit plus rien</small></div><div class="fam-mb-b"><button class="btn" data-act="fam-readd" data-id="'+esc(id)+'">Réintégrer</button><button class="btn" data-act="fam-forget" data-id="'+esc(id)+'" aria-label="Supprimer définitivement">🗑</button></div></div>').join('')+'</details>';
   h+='<button class="fam-quit" data-act="fam-quit" data-g="'+gi+'">Quitter « '+esc(g.nm||'ce groupe')+' »</button></div>';
  }
  h+='<div class="chips" style="margin:.6rem 0 .2rem"><button class="chip" data-act="fam-create">＋ Nouveau groupe (amis…)</button><button class="chip" data-act="fam-code-join">🔢 J’ai reçu un code</button><button class="chip" data-act="fam-sync">🔄 Mettre à jour</button></div>';
 }
 h+='<div style="height:.4rem"></div>'+mrow('fam-inv','📨 Faire installer l’appli','Le lien et les 3 étapes, par SMS')+mrow('sh-recv','📥 Recevoir un partage','Coller un lien reçu par SMS, WhatsApp ou mail')+
  sfold('Comment ça marche ?','<b>Groupes connectés</b> (Famille, Amis…) : chaque personne que tu invites avec un code apparaît dans le groupe. Avec « Choisir », tu décides ce que tu lui partages (courses, tâches, repas, anniversaires, voyages) ; au départ, rien. Les mises à jour arrivent toutes seules, chiffrées de bout en bout. Ce qui vient d’un groupe n’est jamais renvoyé à un autre groupe.<br><b>Retirer</b> une personne : elle ne reçoit plus rien et ce que tu lui avais partagé disparaît de chez elle. 🗑 la supprime définitivement de ta liste.<br><b>Mes contacts</b> servent à dire qui fait quoi (tâches, repas). <b>📥 Recevoir un partage</b> sert aux liens envoyés par SMS, sans groupe.')+'</div>';

/* Code d'invitation : 8 caractères faciles à taper. La clé de la famille est chiffrée avec une clé tirée du code
   (PBKDF2) et déposée 7 jours sur le serveur, à une adresse elle aussi tirée du code. Le serveur ne voit jamais le code. */
const FAM_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const famCodeNorm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const famCodeShow=c=>c.slice(0,4)+'-'+c.slice(4);
function famCodeFind(t){
 t=String(t||'');
 const m=t.match(/(^|[^A-Za-z0-9])([A-HJKMNP-Z2-9]{4})[-\s]([A-HJKMNP-Z2-9]{4})(?![A-Za-z0-9])/);if(m)return m[2]+m[3];
 const n=famCodeNorm(t);return n.length===8&&[...n].every(c=>FAM_ABC.includes(c))?n:'';
}
async function famCodeKeys(code){
 const te=new TextEncoder();
 const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('agendam-invit:'+code)));
 const id=[...h.slice(0,16)].map(b=>b.toString(16).padStart(2,'0')).join('');
 const base=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('agendam-invitation'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 return{id,key};
}
async function famInvCode(f){
 f=f||fam();if(!f||!famUrl())return '';
 if(f.ic&&f.icAt&&Date.now()-f.icAt<6*864e5&&f.icK===f.k)return f.ic;
 const r=crypto.getRandomValues(new Uint8Array(8));let code='';for(const b of r)code+=FAM_ABC[b%FAM_ABC.length];
 const FK=await famCodeKeys(code),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},FK.key,new TextEncoder().encode(JSON.stringify({k:f.k,by:meName(),nm:f.nm||'Famille',em:f.em||'👪'}))));
 const res=await fetch(famUrl()+'/i/'+FK.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:shB64.enc(c),iv:shB64.enc(iv)})});
 if(!res.ok)throw new Error('Serveur : '+res.status);
 f.ic=code;f.icAt=Date.now();f.icK=f.k;ls.set(K.set,S);
 return code;
}
async function famCodeJoin(pre){
 if(!famUrl())return;
 let code=famCodeFind(pre||'');
 if(!code){
  const v={t:''};const pr=ask({title:'🔢 Rejoindre avec un code',html:'<p style="margin:.2rem 0 .5rem">Tape le code d’invitation reçu (8 caractères, par exemple K7P4-9QX2), ou colle tout le message reçu : l’appli trouve le code.</p><input class="in" id="fc-in" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" style="font-size:1.4rem;letter-spacing:.15em;text-align:center;text-transform:uppercase;margin-bottom:.5rem"><button type="button" class="btn blk" id="fc-paste" style="margin-bottom:.6rem">📋 Coller le message reçu</button>',btns:[{label:'Rejoindre',value:'ok',cls:'pri'},{label:'Annuler',value:null}]});
  const root=$('#dlg');
  const fix=i=>{if(i.value.length>9){const c=famCodeFind(i.value);if(c)i.value=famCodeShow(c)}v.t=i.value};
  root.oninput=e=>{if(e.target.id==='fc-in')fix(e.target)};
  const pc=async e=>{if(!e.target.closest||!e.target.closest('#fc-paste'))return;e.preventDefault();e.stopImmediatePropagation();let t='';try{t=await navigator.clipboard.readText()}catch(x){}const i=$('#fc-in');const c=famCodeFind(t);if(c&&i){i.value=famCodeShow(c);v.t=i.value}else toast('Pas de code trouvé : appui long dans la case puis « Coller »',5000)};
  root.addEventListener('click',pc,true);
  setTimeout(()=>{const i=$('#fc-in');if(i)i.focus()},120);
  const r=await pr;root.oninput=null;root.removeEventListener('click',pc,true);if(r!=='ok')return;
  code=famCodeFind(v.t);
 }
 if(!code){toast('Ce code ne semble pas bon : 8 caractères, par exemple K7P4-9QX2',5000);return}
 toast('Recherche de la famille…',2500);
 try{
  const FK=await famCodeKeys(code);
  const res=await fetch(famUrl()+'/i/'+FK.id,{cache:'no-store'});
  if(res.status===404){toast('Code inconnu ou expiré (7 jours). Demande un nouveau code.',6000);return}
  if(!res.ok)throw new Error('Serveur : '+res.status);
  const o=await res.json();
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:shB64.dec(o.iv)},FK.key,shB64.dec(o.c));
  const d=JSON.parse(new TextDecoder().decode(p));
  await famJoin(d.k,d.by||'',true,d.nm,d.em);
 }catch(e){toast('Impossible de rejoindre : '+(e.message||'hors connexion'),5000)}
}
function famSms(p,body){const a=document.createElement('a');a.href=p&&p.tel?'sms:'+telN(p.tel)+(isIOS()?'&':'?')+'body='+encodeURIComponent(body):'sms:'+(isIOS()?'&':'?')+'body='+encodeURIComponent(body);document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),800)}
async function famShowCode(g){
 g=g||fam();let code='';try{code=await famInvCode(g)}catch(e){toast('Pas de connexion au serveur',4000);return}
 if(!code)return;
 const tr=$('#toast');if(tr)tr.innerHTML='';
 const dest=pplSorted().filter(p=>p.tel&&p.id!==S.meId);
 const btns=dest.map(p=>({label:'💬 Juste le code à '+pplName(p),value:'to:'+p.id,cls:'pri'})).concat([{label:'💬 Juste le code par SMS (choisir)',value:'sms',cls:dest.length?'':'pri'},{label:'👪 Message complet (avec l’installation)',value:'inv'},{label:'Copier le code',value:'copy'},{label:'Fermer',value:null}]);
 const r=await ask({title:'🔢 Inviter dans « '+(g.nm||'Famille')+' »',html:'<p style="margin:.2rem 0 .4rem">Dans <b>son appli AgenDam</b> (celle de l’écran d’accueil) : Réglages → Famille et contacts → <b>🔢 Rejoindre avec un code</b>, puis tape :</p><p style="font-size:2rem;font-weight:800;letter-spacing:.12em;text-align:center;margin:.4rem 0 .3rem">'+famCodeShow(code)+'</p><p class="mut" style="font-size:.82rem;margin:0 0 .6rem;text-align:center">Valable 7 jours. « Juste le code » envoie un SMS qui ne contient que le code : facile à copier.</p>',btns});
 if(!r)return;
 if(r==='inv')return inviteFamily(g);
 if(r==='copy'){try{await navigator.clipboard.writeText(famCodeShow(code));toast('Code copié')}catch(e){}return}
 if(r==='sms')return famSms(null,famCodeShow(code));
 if(r.indexOf('to:')===0)famSms(pplOf(r.slice(3)),famCodeShow(code));
}
function famHash2(){const h=location.hash||'';const m=h.match(/^#fam=([A-Za-z0-9_-]+)(?:&by=([^&]*))?/);if(!m)return false;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}setTimeout(()=>famJoin(m[1],decodeURIComponent(m[2]||'')),400);return true}

function registerSW(){
 if(!('serviceWorker' in navigator)||!(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return;
 const hadController=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js').then(reg=>{
  swReg=reg;
  const watch=w=>{w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nouvelle version disponible',15000,{label:'Mettre à jour',fn:()=>w.postMessage('skipWaiting')})})};
  if(reg.waiting&&navigator.serviceWorker.controller)toast('Nouvelle version disponible',15000,{label:'Mettre à jour',fn:()=>reg.waiting.postMessage('skipWaiting')});
  reg.addEventListener('updatefound',()=>watch(reg.installing));
 }).catch(()=>{});
 let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||!hadController)return;reloaded=true;location.reload()});
}
