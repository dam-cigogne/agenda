}
function parseICS(text){
 const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'').split('\n');
 const raw=[];let cur=null,alarm=null;
 for(let ln of lines){
  ln=ln.replace(/\s+$/,'');if(!ln)continue;
  const U=ln.toUpperCase();
  if(U==='BEGIN:VEVENT'){cur={p:{},alarm:null};continue}
  if(!cur)continue;
  if(U==='END:VEVENT'){raw.push(cur);cur=null;alarm=null;continue}
  if(U==='BEGIN:VALARM'){alarm={};continue}
  if(U==='END:VALARM'){if(alarm&&alarm.trigger!=null&&cur.alarm==null)cur.alarm=alarm.trigger;alarm=null;continue}
  const i=ln.indexOf(':');if(i<1)continue;
  const left=ln.slice(0,i),val=ln.slice(i+1),parts=left.split(';'),name=parts[0].toUpperCase(),params={};
  parts.slice(1).forEach(x=>{const q=x.split('=');params[q[0].toUpperCase()]=q.slice(1).join('=')});
  if(alarm){if(name==='TRIGGER'&&!/VALUE=DATE-TIME/i.test(left))alarm.trigger=parseTrigger(val);continue}
  (cur.p[name]=cur.p[name]||[]).push({val,params});
 }
 const out=[];let skipped=0;
 const first=(c,n)=>c.p[n]&&c.p[n][0];
 for(const c of raw){
  const ds0=first(c,'DTSTART');if(!ds0){skipped++;continue}
  const a=parseDT(ds0.val);if(!a){skipped++;continue}
  const de=first(c,'DTEND'),du=first(c,'DURATION');
  let ev={id:null,title:'Sans titre',allDay:a.allDay,start:a.date,end:a.date,startTime:'09:00',endTime:'10:00',place:'',note:'',cat:'autre',rec:null,ex:[],alarm:null};
  if(a.allDay){
   if(de){const b=parseDT(de.val);if(b){let e=b.allDay?add(b.date,-1):b.date;if(e<a.date)e=a.date;ev.end=e}}
   else if(du){const m=du.val.match(/P(?:(\d+)W)?(?:(\d+)D)?/);const days=m?((+m[1]||0)*7+(+m[2]||0)):1;ev.end=add(a.date,Math.max(1,days)-1)}
  }else{
   ev.startTime=hm(a.min);
   let endStamp=stampOf(a.date,ev.startTime)+30;
   if(de){const b=parseDT(de.val);if(b){endStamp=b.allDay?stampOf(b.date,'00:00'):stampOf(b.date,hm(b.min))}}
   else if(du){const m=du.val.match(/^P(?:(\d+)W)?(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/);if(m){const mins=(+m[1]||0)*10080+(+m[2]||0)*1440+(+m[3]||0)*60+(+m[4]||0);if(mins>0)endStamp=stampOf(a.date,ev.startTime)+mins}}
   if(endStamp<=stampOf(a.date,ev.startTime))endStamp=stampOf(a.date,ev.startTime)+30;
   const fe=fromStamp(endStamp);ev.end=fe.d;ev.endTime=fe.t;
  }
  const t=first(c,'SUMMARY');if(t){let tl=icsUnesc(t.val);const mi=tl.match(/^((?:\p{Extended_Pictographic}[\uFE0F\u200D\u{1F3FB}-\u{1F3FF}]*)+)\s+(.+)$/u);if(mi){ev.icon=mi[1];tl=mi[2]}ev.title=tl.slice(0,200)}
  const lo=first(c,'LOCATION');if(lo)ev.place=icsUnesc(lo.val);
  const de2=first(c,'DESCRIPTION');if(de2)ev.note=icsUnesc(de2.val);
  const ca=first(c,'CATEGORIES');
  if(ca){const nm=icsUnesc(ca.val).split(',')[0].trim().toLowerCase();const f=S.cats.find(x=>x.name.toLowerCase()===nm);if(f)ev.cat=f.id}
  const ui=first(c,'UID');if(ui)ev.id=ui.val.replace(/@agd\.agenda$/,'').slice(0,120);
  if(c.alarm!=null){
   if(ev.allDay)ev.alarm=c.alarm>=1440?1440:0;
   else ev.alarm=c.alarm;
  }
  const rr=first(c,'RRULE');
  if(rr){
   const q={};rr.val.split(';').forEach(x=>{const k=x.split('=');q[k[0].toUpperCase()]=k[1]});
   const F={DAILY:'daily',WEEKLY:'weekly',MONTHLY:'monthly',YEARLY:'yearly'}[q.FREQ];
   if(F){
    const rec={type:F,interval:parseInt(q.INTERVAL)||1,days:[],on:1,off:0,until:null};
    if(F==='weekly'&&q.BYDAY)rec.days=q.BYDAY.split(',').map(x=>WD.indexOf(x.replace(/^[+-]?\d+/,'').toUpperCase())).filter(n=>n>=0);
    if(q.UNTIL){const u=parseDT(q.UNTIL);if(u){let d=u.date;if(!u.allDay&&q.UNTIL.endsWith('Z')){d=u.date}rec.until=d}}
    ev.rec=rec;
    if(q.COUNT){
     const n=parseInt(q.COUNT);const tmp=Object.assign({},ev,{rec:Object.assign({},rec,{until:null}),ex:[]});
     let cnt=0,last=ev.start;
     for(let d=ev.start,i=0;i<5000&&cnt<n;d=add(d,1),i++)if(matches(tmp,d)){cnt++;last=d}
     rec.until=last;
    }
   }
  }
  const ex=c.p.EXDATE;
  if(ex)ex.forEach(e=>e.val.split(',').forEach(v=>{const x=parseDT(v);if(x)ev.ex.push(x.date)}));
  const clean=cleanEvent(ev);
  if(clean)out.push(clean);else skipped++;
 }
 return{events:out,skipped};
}

 const gs=mondayOf(first,S.weekStart);
 const dim=new Date(pd(first).getFullYear(),pd(first).getMonth()+1,0).getDate();
 const lead=(pd(first).getDay()-S.weekStart+7)%7;
 const rows=Math.ceil((lead+dim)/7);
 return{gs,rows,month:pd(first).getMonth()};
}
function weekHead(){return Array.from({length:7},(_,i)=>(S.weekStart+i)%7)}
function monthViewDots(){
 const {gs,rows,month}=monthCells(V.date);
 const end=add(gs,rows*7-1);const list=occs(gs,end);const t=today();
 let h='<div class="mo"><div class="mo-h">'+weekHead().map(d=>'<span>'+DS[d].replace('.','')+'</span>').join('')+'</div><div class="mo-g">';
 for(let i=0;i<rows*7;i++){
  const d=add(gs,i);const {ad,ts}=segs(list,d);
  const all=[...ad,...ts.map(x=>x.o)];
  const shown=all.slice(0,4),more=all.length-shown.length;
  const wk=[0,6].includes(dow(d));
  h+='<button class="mc'+(d===t?' today':'')+(d===V.date?' sel':'')+(pd(d).getMonth()!==month?' out':'')+dayCls(d)+'" data-act="selday" data-date="'+d+'"><span class="n">'+pd(d).getDate()+bdMark(d)+'</span><span class="mbars">'+shown.map(o=>'<i class="mbar" style="--c:'+evCol(o.ev)+'"><span>'+evT(o.ev)+'</span></i>').join('')+(more>0?'<span class="mmore">+'+more+'</span>':'')+'</span></button>';
 }
 h+='</div></div>'+dayListHTML(V.date,{inMain:true,openBtn:true});
 return{html:h,fixed:false};
}

function inkOn(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)>150?'#10151c':'#ffffff'}
function monthView(){return S.monthMode==='dots'?monthViewDots():monthViewTitles()}
function fortStart(){if(!V.fs||V.date<V.fs||V.date>add(V.fs,13))V.fs=mondayOf(V.date,S.weekStart);return V.fs}
function monthViewTitles(fort,pr){
 const wk=fort==='wk';fort=!!fort;
 const mc=wk?{gs:mondayOf(V.date,S.weekStart),rows:1,month:null}:fort?{gs:fortStart(),rows:2,month:null}:monthCells(V.date);const {gs,rows,month}=mc;
 const end=add(gs,rows*7-1);const list=occs(gs,end);const t=today();
 const fs=parseFloat(getComputedStyle(document.documentElement).fontSize)||17;
 const mainH=pr?0:($('#main').clientHeight||600);
 const rowH=pr?627/rows:Math.max(fs*5,(mainH-fs*2.2)/rows);
 const tab=isTablet();
 const big=pr&&rows<=2;
 const mx=pr?1:(+S.mTxt||1);
 const bandH=pr?(big?20:17):fs*(fort?(tab?0.9:0.82):(tab?0.8:0.68))*mx*1.46+1;
 const tFs=(fort?(tab?0.86:0.76):(tab?0.74:0.62))*mx;
 const tlH=pr?(big?20:17):fs*tFs*1.25+1;
 const avail=pr?rowH-26:rowH-fs*1.55;
 let h='<div class="mo2'+(fort?' fort':'')+(pr?' pr':'')+(big?' big':'')+'" style="--rows:'+rows+'"><div class="mo2-h"><span></span>'+weekHead().map(d=>'<span>'+DS[d].replace('.','')+'</span>').join('')+'</div>';
 for(let w=0;w<rows;w++){
  const ws=add(gs,w*7),we=add(ws,6);
  const wk=isoWeek(add(ws,S.weekStart===1?3:4));
  const bands=[],timed=Array.from({length:7},()=>[]);
  for(const o of list){
   if(o.endDate<ws||o.date>we)continue;
   if(o.allDay||o.dur>0)bands.push({o,c0:Math.max(0,diff(o.date,ws)),c1:Math.min(6,diff(o.endDate,ws))});
   else{const c=diff(o.date,ws);if(c>=0&&c<=6)timed[c].push(o)}
  }
  bands.sort((a,b)=>a.o.ev.id<b.o.ev.id?-1:a.o.ev.id>b.o.ev.id?1:a.c0-b.c0);
  for(let i=bands.length-1;i>0;i--){const p=bands[i-1],q=bands[i];if(p.o.ev.id===q.o.ev.id&&p.o.allDay&&q.o.allDay&&q.c0===p.c1+1){p.c1=q.c1;p.o=Object.assign({},p.o,{endDate:q.o.endDate});bands.splice(i,1)}}
  bands.sort((a,b)=>a.c0-b.c0||(b.c1-b.c0)-(a.c1-a.c0)||a.o.ev.title.localeCompare(b.o.ev.title));
  const lanes=[];
  bands.forEach(b=>{let i=0;while(lanes[i]!==undefined&&lanes[i]>=b.c0)i++;lanes[i]=b.c1;b.lane=i});
  const anyT=timed.some(a=>a.length);
  /* bandeaux d'une seule colonne (étroits) : le titre passe sur 2-3 lignes au lieu d'être coupé */
  const cw=pr?(big?96:70):(((($('#main')||{}).clientWidth)||390)-fs*1.5)/7;
  const bfs0=pr?(big?14:11):fs*(fort?(tab?0.82:0.66):(tab?0.8:0.7))*mx;
  /* essais : d'abord taille normale, puis bandeaux compacts ; les bandeaux (multi-jours) passent avant les petits événements */
  const trySearch=(sc,resv)=>{
   const bfs=bfs0*sc,bandHs=bandH*sc;
   const cpl=Math.max(4,Math.floor((cw-bfs*0.6)/(bfs*0.66)));
   const budget=avail-(anyT?tlH*resv:0);
   let best=null;
   for(const [withIcon,cap] of (fort&&!pr?[[true,6],[true,5],[true,4],[true,3],[true,2],[false,4],[false,3],[false,2]]:[[true,3],[true,2],[false,2],[false,1]])){
    const lh=lanes.map(()=>1);
    const nis=[];
    const wls=bands.map((b,k)=>{
     nis[k]=false;
     if(b.c0!==b.c1)return 1;
     const tl=Array.from(b.o.ev.title).length;
     if(withIcon&&b.o.ev.icon&&tl>cpl*(cap-1))nis[k]=true;
     const n=tl+(withIcon&&b.o.ev.icon&&!nis[k]?2:0);
     const w=n>cpl?Math.min(cap,Math.ceil(n/cpl)):1;
     if(w>lh[b.lane])lh[b.lane]=w;return w;
    });
    let vis_=0,used_=0;
    const hh=l=>l>1?l*bfs*1.25+bfs*0.3+2:bandHs;
    while(vis_<lanes.length&&(vis_===0||used_+hh(lh[vis_])<=budget)){used_+=hh(lh[vis_]);vis_++}
    if(!best||vis_>best.vis)best={vis:vis_,used:used_,wls,nis,noIcon:!withIcon,sc};
    if(vis_===lanes.length)break;
   }
   return best;
  };
  let best=null;
  const scales=pr?[1]:[1,0.88,0.78];
  outer:for(const sc of scales){
   for(const resv of (anyT?[2,1,0]:[0])){
    const r=trySearch(sc,resv);
    if(!best||r.vis>best.vis)best=r;
    if(r.vis===lanes.length){best=r;break outer}
   }
  }
  bands.forEach((b,k)=>{b.wl=best.wls[k];b.ni=best.nis[k]});
  const vis=best.vis,used=best.used;
  const hid=Array(7).fill(0);
  const room=Math.max(0,avail-used);
  let fg='';
  for(let c=0;c<7;c++){
   const d=add(ws,c);
   fg+='<b class="mn'+(d===t?' today':'')+dayCls(d)+(month!==null&&pd(d).getMonth()!==month?' out':'')+'" style="grid-row:1;grid-column:'+(c+2)+'">'+(fort&&(pd(d).getDate()===1||(w===0&&c===0))?'<small>'+MS[pd(d).getMonth()]+'</small> ':'')+bdMark(d)+pd(d).getDate()+'</b>';
  }
  bands.forEach(b=>{
   if(b.lane>=vis){for(let c=b.c0;c<=b.c1;c++)hid[c]++;return}
   const o=b.o,col=evCol(o.ev);
   fg+='<i class="mband'+hiCls(o.ev)+(b.wl>1?' wn':'')+(o.date<ws?' cl':'')+(o.endDate>we?' cr':'')+'" data-date="'+o.date+'" style="grid-row:'+(2+b.lane)+';grid-column:'+(b.c0+2)+' / '+(b.c1+3)+';--c:'+col+';--ink:'+inkOn(col)+(best.sc*mx!==1?';--bsc:'+(best.sc*mx):'')+(b.wl>1?';--wl:'+b.wl:'')+'">'+((best.noIcon||b.ni)&&b.c0===b.c1?esc(b.wl>1?hyText(o.ev.title):o.ev.title):(b.wl>1?evTh(o.ev):evT(o.ev)))+'</i>';
  });
  timed.forEach((arr,c)=>{
   if(!arr.length)return;
   arr.sort((x,y)=>x.s-y.s);
   const L=Math.max(0,Math.floor(room/tlH));let ln=1;
   for(const t3 of [3,2]){if(arr.length*t3<=L){ln=t3;break}}
   if(pr)ln=Math.max(1,Math.min(6,Math.floor(L/arr.length)));
   const shown=Math.min(arr.length,Math.max(0,Math.floor(L/ln)));
   hid[c]+=arr.length-shown;
   if(!shown)return;
   fg+='<div class="mcol'+(ln===1&&!tab&&!fort&&!pr?' l1':'')+'" style="grid-row:'+(2+vis)+';grid-column:'+(c+2)+';--ln:'+ln+';font-size:'+tFs+'rem">'+arr.slice(0,shown).map(o=>'<i class="ml'+hiCls(o.ev)+'" data-date="'+o.date+'" style="--c:'+evCol(o.ev)+'">'+((tab||pr)?'<em>'+hm(o.s)+'</em> ':'')+(o.ev.hi&4?'★\u00a0':'')+(o.ev.icon?'<span class="ei">'+esc(o.ev.icon)+' </span>':'')+esc(hyText(o.ev.title))+'</i>').join('')+'</div>';
  });
  hid.forEach((n,c)=>{if(n>0)fg+='<span class="mhid" style="grid-row:1;grid-column:'+(c+2)+'">+'+n+'</span>'});
  let bg='<span class="wn">'+wk+'</span>';
  for(let c=0;c<7;c++){
   const d=add(ws,c);
   bg+='<button class="bgc'+(d===t?' today':'')+dayCls(d)+(month!==null&&pd(d).getMonth()!==month?' out':'')+'" data-act="selday" data-date="'+d+'" aria-label="'+fLong(d)+'"></button>';
  }
  h+='<div class="mw"><div class="mw-bg">'+bg+'</div><div class="mw-fg">'+fg+'</div></div>';
 }
 return{html:h+'</div>',fixed:false,after:()=>{if(pr)return;const m=$('#main').clientHeight;if(Math.abs(m-mainH)>4&&!V.re){V.re=1;try{render()}finally{V.re=0}}}};
}

const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function searchResults(q){

 const from=add(today(),-365),to=add(today(),730);

 for(const ev of EV){
  if(!norm(ev.title+' '+ev.place+' '+ev.note).includes(q))continue;
  occsOf(ev,from,to).forEach(o=>res.push(o));
 }
 res.sort((a,b)=>a.date.localeCompare(b.date)||a.s-b.s);
 if(!res.length)return '<p class="empty">Aucun résultat.</p>';

  if(o.date!==last){last=o.date;h+='<div class="gh">'+fLongY(o.date)+' · '+relDay(o.date)+'</div>'}
  h+=rowHTML(o,o.date);

/* ---------- Connexion Outlook / Microsoft (envoi dans un sens : appli -> Outlook) ---------- */
/* Connexion officielle Microsoft (OAuth, code + PKCE), sans serveur : l'appli parle directement
   à Microsoft avec TON compte. Aucune donnée ne passe par un autre intermédiaire. */
const MS_CLIENT_ID='661cb213-42fd-400c-b81a-34a07b5c4046';                       /* identifiant public de l'application Microsoft (pas un secret) */
const MS_AUTH='https://login.microsoftonline.com/consumers/oauth2/v2.0';
const MS_SCOPE='Calendars.ReadWrite MailboxSettings.Read User.Read offline_access';
const MS_CAL_NAME='Agenda (appli)';
const GRAPH='https://graph.microsoft.com/v1.0';
const MS_PROP='String {4f1d8a3e-7b21-4c6e-9d11-0a6a2f5c7e01} Name AgendamKey';
let MSA=Object.assign({token:null,exp:0,refresh:null,calId:null,map:{},acct:'',last:0,err:'',n:0},ls.get(K.ms,{}));
const msSave=()=>ls.set(K.ms,MSA);
const msClientId=()=>String(S.msClientId||MS_CLIENT_ID||'').trim();
/* 1.17 : synchro Outlook mise en sommeil (source de doublons). Code conservé ; OL_ON=true pour la réactiver. */
const OL_ON=false;
const msConnected=()=>OL_ON&&!!MSA.refresh;
const msRedirect=()=>location.origin+location.pathname.replace(/index\.html$/,'');
let msBusy=false,msTimer=null;

const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const msRand=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));

async function msConnect(){
 const cid=msClientId();
 if(!cid){toast('Identifiant d’application Microsoft manquant');return}
 if(!window.crypto||!crypto.subtle){toast('Connexion impossible sur cet appareil (navigateur trop ancien)');return}
 const verifier=msRand(48),state=msRand(16);
 const challenge=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 ls.set(P+'msauth',{verifier,state,t:Date.now()});
 const p=new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:msRedirect(),response_mode:'query',scope:MS_SCOPE,state,code_challenge:challenge,code_challenge_method:'S256',prompt:'select_account'});
 location.href=MS_AUTH+'/authorize?'+p;
}
async function msTokenReq(params){
 const r=await fetch(MS_AUTH+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.access_token)throw Object.assign(new Error(j.error_description||j.error||'Erreur de connexion'),{code:j.error});
 MSA.token=j.access_token;MSA.exp=Date.now()+(j.expires_in||3600)*1000;
 if(j.refresh_token)MSA.refresh=j.refresh_token;
 MSA.err='';msSave();
}
/* Retour de la page de connexion Microsoft (?code=…&state=…) */
async function msHandleReturn(){
 const q=new URLSearchParams(location.search);
 if(!q.has('code')&&!q.has('error'))return false;
 const au=ls.get(P+'msauth',null);
 if(!au||q.get('state')!==au.state)return false;
 const clean=()=>{ls.del(P+'msauth');try{history.replaceState(null,'',msRedirect())}catch(e){}};
 if(q.has('error')){clean();toast('Connexion Outlook annulée');return true}
 try{
  await msTokenReq({client_id:msClientId(),grant_type:'authorization_code',code:q.get('code'),redirect_uri:msRedirect(),code_verifier:au.verifier,scope:MS_SCOPE});
  clean();
  try{const me=await msFetch('/me?$select=mail,userPrincipalName');MSA.acct=me.mail||me.userPrincipalName||'';msSave()}catch(e){}
  V.view='settings';render();
  toast('Outlook connecté. Touche « Envoyer maintenant ».',6000);
 }catch(e){clean();toast('Connexion Outlook impossible : '+e.message,6000)}
 return true;
}
async function msAccessToken(force){
 if(!force&&MSA.token&&MSA.exp>Date.now()+60000)return MSA.token;
 if(!MSA.refresh)throw new Error('Non connecté');
 try{await msTokenReq({client_id:msClientId(),grant_type:'refresh_token',refresh_token:MSA.refresh})}
 catch(e){
  if(e.code==='invalid_grant'||e.code==='interaction_required'){MSA.token=null;MSA.refresh=null;MSA.err='Reconnexion nécessaire';msSave()}
  throw e;
 }
 return MSA.token;
}
async function msFetch(path,opt){
 opt=opt||{};
 for(let k=0;k<2;k++){

async function msEnsureCal(){

  try{await msFetch('/me/calendars/'+MSA.calId+'?$select=id');return MSA.calId}catch(e){if(e.status!==404)throw e;MSA.calId=null;MSA.map={}}

const hash32=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h>>>0)};
const msUTC=(d,m)=>{const [y,mo,da]=d.split('-').map(Number);return new Date(y,mo-1,da,0,m,0).toISOString().slice(0,19)};
function msPayload(o){
 const ev=o.ev;
 let start,end;
 if(o.allDay){start=add(o.date,0)+'T00:00:00';end=add(o.endDate,1)+'T00:00:00'}
 else{start=msUTC(o.date,o.s);end=msUTC(o.endDate,o.e)}
 const p={subject:(ev.icon?ev.icon+' ':'')+ev.title,isAllDay:!!o.allDay,
  start:{dateTime:start,timeZone:'UTC'},end:{dateTime:end,timeZone:'UTC'},
  location:{displayName:ev.place||''},body:{contentType:'text',content:ev.note||''},showAs:'busy'};
 if(ev.ocat)p.categories=[ev.ocat];else p.categories=[];
 if(ev.alarm!=null){p.isReminderOn=true;p.reminderMinutesBeforeStart=o.allDay?(ev.alarm>=1440?900:0):ev.alarm}
 else p.isReminderOn=false;
 return p;
}
async function msBatch(reqs){
 for(let tries=0;;tries++){
  const j=await msFetch('/$batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests:reqs})});
  const res=j.responses||[];
  const th=res.find(r=>r.status===429||r.status===503);
  if(th&&tries<2){const w=Math.min(20,(+((th.headers||{})['Retry-After']||'3')))*1000;await new Promise(r=>setTimeout(r,w));continue}
  return res;
 }
}
async function msSync(silent){
 if(demo){if(!silent)toast('Quitte d’abord le mode démo');return}
 if(!msConnected()){if(!silent)toast('Outlook n’est pas connecté');return}
 if(msBusy)return;
 msBusy=true;if(!silent){toast('Envoi vers Outlook…',4000);}
 let add_=0,upd=0,del=0,err=0;
 try{
  const cal=await msEnsureCal();
  const from=add(today(),-31),to=add(today(),366);
  const want={};
  const seenSig=new Set();
  for(const o of occsMine(from,to)){if(o.ev.src==='ol')continue;const p=msPayload(o);
   const sig=[o.ev.ocal||cal,norm(p.subject).trim(),p.start.dateTime,p.end.dateTime,p.isAllDay].join('|');
   if(seenSig.has(sig))continue;seenSig.add(sig); /* deux événements identiques dans l'appli : un seul envoi (et le doublon déjà dans Outlook est supprimé) */
   p.singleValueExtendedProperties=[{id:MS_PROP,value:o.ev.id+'|'+o.date}];want[o.ev.id+'|'+o.date]={cal:o.ev.ocal||cal,p,h:hash32(JSON.stringify(p.categories&&p.categories.length?p:Object.assign({},p,{categories:undefined})))}}
  const reqs=[];
  /* anti-doublons : si cet appareil ne connaît pas encore un événement, on regarde d'abord ce que les autres appareils ont déjà envoyé */
  const need=Object.keys(want).filter(k=>!MSA.map[k]);
  if(need.length){
   try{
    const found=await olFindOurs([...new Set(need.map(k=>want[k].cal))]);
    for(const k of need){
     const l=found.get(k);
     if(l&&l.length){MSA.map[k]={id:l[0].id,h:'',cal:l[0].cal};for(const x of l.slice(1))reqs.push({k,kind:'xdel',method:'DELETE',url:'/me/events/'+x.id})}
    }
   }catch(e){}
  }
  for(const k in want){
   const m=MSA.map[k];
   if(!m)reqs.push({k,kind:'add',method:'POST',url:'/me/calendars/'+want[k].cal+'/events',body:want[k].p,h:want[k].h,cal:want[k].cal});
   else if((m.cal||cal)!==want[k].cal){reqs.push({k,kind:'mvdel',method:'DELETE',url:'/me/events/'+m.id});reqs.push({k,kind:'add',method:'POST',url:'/me/calendars/'+want[k].cal+'/events',body:want[k].p,h:want[k].h,cal:want[k].cal})}
   else if(m.h!==want[k].h)reqs.push({k,kind:'upd',method:'PATCH',url:'/me/events/'+m.id,body:want[k].p,h:want[k].h,id:m.id});
  }
  for(const k in MSA.map)if(!want[k])reqs.push({k,kind:'del',method:'DELETE',url:'/me/events/'+MSA.map[k].id});
  for(let i=0;i<reqs.length;i+=20){
   const ch=reqs.slice(i,i+20);
   const res=await msBatch(ch.map((r,j)=>({id:String(j),method:r.method,url:r.url,headers:r.body?{'Content-Type':'application/json'}:undefined,body:r.body})));
   ch.forEach((r,j)=>{
    const x=res.find(z=>z.id===String(j))||{status:0};
    const ok=x.status>=200&&x.status<300;
    if(r.kind==='mvdel'||r.kind==='xdel'){}
    else if(r.kind==='add'){if(ok&&x.body&&x.body.id){MSA.map[r.k]={id:x.body.id,h:r.h,cal:r.cal};add_++}else err++}
    else if(r.kind==='upd'){if(ok){MSA.map[r.k].h=r.h;upd++}else if(x.status===404){delete MSA.map[r.k];err++}else err++}
    else{if(ok||x.status===404){delete MSA.map[r.k];del++}else err++}
   });
   msSave();
   if(!silent&&reqs.length>20)toast('Envoi vers Outlook… '+Math.min(i+20,reqs.length)+'/'+reqs.length,4000);
  }
  /* événement importé d'Outlook puis modifié dans l'appli : la copie de l'appli a été envoyée, on retire l'ancien exemplaire d'Outlook (pas de doublon) */
  {const lst=EV.filter(e=>e.old&&e.old.length&&e.src!=='ol'&&Object.keys(MSA.map).some(k=>k.startsWith(e.id+'|')));
   const dl=[];let dok=true;for(const e of lst)for(const id of e.old)dl.push({e,id});
   for(let i=0;i<dl.length;i+=20){const ch=dl.slice(i,i+20);try{await msBatch(ch.map((r,j)=>({id:String(j),method:'DELETE',url:'/me/events/'+r.id})))}catch(x){err++;dok=false}}
   if(lst.length&&dok){for(const e of lst)e.old=[];saveData();del+=dl.length}}
  MSA.last=Date.now();MSA.err=err?(err+' élément(s) non envoyés'):'';msSave();
  try{await olCatsRefresh()}catch(e){}
  if(!silent)toast(reqs.length?('Outlook à jour : '+add_+' ajouté'+(add_>1?'s':'')+', '+upd+' modifié'+(upd>1?'s':'')+', '+del+' supprimé'+(del>1?'s':'')+(err?' · '+err+' erreur(s)':'')):'Outlook déjà à jour',5000);
 }catch(e){
  MSA.err=e.message||'Erreur';msSave();
  if(!silent)toast('Envoi Outlook impossible : '+MSA.err,6000);
 }finally{msBusy=false;if(V.view==='settings')render()}
}

/* événements envoyés par l'appli (marqués d'une clé), par calendrier */
async function olFindOurs(calIds){
 const out=new Map();
 for(const c of calIds){
  let url='/me/calendars/'+c+'/events?$select=id&$top=200&$expand='+encodeURIComponent("singleValueExtendedProperties($filter=id eq '"+MS_PROP+"')"),n=0;
  while(url&&n<25){
   const j=await msFetch(url);n++;
   for(const x of (j.value||[])){const p=(x.singleValueExtendedProperties||[])[0];if(!p||!p.value)continue;if(!out.has(p.value))out.set(p.value,[]);out.get(p.value).push({id:x.id,cal:c})}
   url=j['@odata.nextLink']||null;
  }
 }
 return out;
}

function loadH2C(){
 if(window.html2canvas)return Promise.resolve();
 return new Promise((ok,ko)=>{const s=document.createElement('script');s.src='lib/html2canvas.min.js';s.onload=ok;s.onerror=()=>ko(new Error('lib'));document.head.appendChild(s)});
}
function pdfFromJpeg(jpg,w,h,land){
 const enc=s=>new TextEncoder().encode(s),W=land?841.89:595.28,H=land?595.28:841.89;
 const parts=[],off=[];let len=0;
 const put=u=>{parts.push(u);len+=u.length};
 const obj=(n,body)=>{off[n]=len;put(enc(n+' 0 obj\n'));put(typeof body==='string'?enc(body):body);put(enc('\nendobj\n'))};
 put(enc('%PDF-1.4\n'));
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
 const cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
 obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
 off[5]=len;put(enc('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n'));put(jpg);put(enc('\nendstream\nendobj\n'));
 const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
 for(let n=1;n<=5;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
 put(enc(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF'));
 const out=new Uint8Array(len);let p=0;for(const u of parts){out.set(u,p);p+=u.length}
 return out;
}
async function printPDF(html,land,name){
 toast('Préparation du PDF…',5000);
 let shot;
 const fs0=document.documentElement.style.fontSize;
 try{
  await loadH2C();
  shot=document.createElement('div');shot.className='pz pzshot '+(land?'land':'port');shot.innerHTML=html;document.body.appendChild(shot);
  document.documentElement.style.fontSize='17px';
  await new Promise(r=>setTimeout(r,150));
  const cv=await html2canvas(shot,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:false});
  const b64=cv.toDataURL('image/jpeg',0.92).split(',')[1];
  const bin=atob(b64),jpg=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
  const pdf=pdfFromJpeg(jpg,cv.width,cv.height,land);
  const file=new File([pdf],name,{type:'application/pdf'});
  const r=await ask({title:'Impression prête',text:'Le PDF d’une page A4 est prêt. Touche le bouton, puis choisis « Imprimer » (ou Mail, Enregistrer dans Fichiers…).',btns:[{label:'Imprimer / Partager le PDF',value:'s',cls:'pri'},{label:'Annuler',value:null}]});
  if(r!=='s')return;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);
 }catch(e){toast('Impression impossible ici : '+(e&&e.message?e.message:'erreur'),6000)}
 finally{document.documentElement.style.fontSize=fs0;if(shot)shot.remove()}
}

let SEL={ids:new Set(),per:'future',cats:new Set(),q:''};
function nextD(ev){if(ev.rec){const o=occsOf(ev,today(),add(today(),400));if(o.length)return o[0].date}return ev.start}
function selList(){
 const t=today(),q=norm(SEL.q).trim();
 const to=SEL.per==='m30'?add(t,30):add(t,3650);
 const L=EV.filter(ev=>{
  if(SEL.cats.size&&!SEL.cats.has(ev.cat))return false;
  if(q&&!norm(ev.title+' '+ev.place).includes(q))return false;
  if(SEL.per==='all')return true;
  if(ev.rec)return occsOf(ev,t,to).length>0;
  return ev.end>=t&&ev.start<=to;
 });
 L.sort((a,b)=>nextD(a).localeCompare(nextD(b))||a.title.localeCompare(b.title));
 return L;
}
function selRows(L){

}

 });

function rotGenerate(r){
 const out=[],d0=pd(r.start),dEnd=new Date(d0);dEnd.setMonth(dEnd.getMonth()+r.months);
 const end=ds(dEnd);let si=0,left=r.steps[0].days,day=r.start,block=null;
 const flush=()=>{if(block){out.push(block);block=null}};
 const mk=(s,a,b,t1,t2,all)=>cleanEvent({id:uid(),title:s.lab,icon:s.icon||'',allDay:all,start:a,end:b,startTime:t1,endTime:t2,place:'',note:'Rotation : '+r.name,cat:r.cat,grp:r.id,rec:null,ex:[],alarm:null});
 while(day<end){
  const s=r.steps[si];
  if(s.work||r.showRest){
   if(s.work&&!s.allDay){flush();const night=tmin(s.et)<=tmin(s.st);out.push(mk(s,day,night?add(day,1):day,s.st,s.et,false))}
   else if(block&&block.title===s.lab&&block.end===add(day,-1)&&block._si===si)block.end=day;
   else{flush();block=mk(s,day,day,'09:00','10:00',true);block._si=si}
  }else flush();
  if(--left<=0){si=(si+1)%r.steps.length;left=r.steps[si].days;flush()}
  day=add(day,1);
 }
 flush();
 out.forEach(e=>{delete e._si});
 return out.filter(Boolean);
}
async function rotSave(){
 rotRead();const r=ROT;
 if(!r.name){toast('Donne un nom à la rotation');return}
 if(!r.steps.some(s=>s.work)){toast('Il faut au moins une étape « Travail »');return}
 if(!RX_D.test(r.start)){toast('Date invalide');return}
 const evs=rotGenerate(r);
 if(!evs.length){toast('Aucun jour généré');return}
 const old=EV.filter(e=>e.grp===r.id).length;
 if(old){const go=await ask({title:'Remplacer la rotation',text:'Les '+old+' événements de cette rotation seront remplacés par '+evs.length+' nouveaux (tes modifications manuelles dessus seront perdues).',btns:[{label:'Remplacer',value:'y',cls:'pri'},{label:'Annuler',value:null}]});if(go!=='y')return}
 EV=EV.filter(e=>e.grp!==r.id).concat(evs);
 const L=rotList().filter(x=>x.id!==r.id);const rr=JSON.parse(JSON.stringify(r));L.push(rr);S.rots=L;saveSet();
 touch();ROT=null;closeSheet();V.date=r.start>today()?r.start:today();render();toast(evs.length+' événements créés');
}

}

const XL_EPOCH=Date.UTC(1899,11,30);
const XL_F=[
 ['title','Titre',['titre','title','sujet','subject','objet','evenement','event','summary','intitule','libelle','nom','activite']],
 ['st','Heure de début',['start time','heure debut','heure de debut','heure','time','debut heure']],
 ['et','Heure de fin',['end time','heure fin','heure de fin','fin heure']],
 ['sd','Date de début',['start date','date debut','date de debut','debut','start','date','du','jour','begin']],
 ['ed','Date de fin',['end date','date fin','date de fin','fin','end','au','jusqu','until']],
 ['ad','Toute la journée',['all day','allday','is all day','journee entiere','toute la journee','journee']],
 ['place','Lieu',['lieu','location','adresse','endroit','place']],
 ['note','Notes',['notes','note','description','details','detail','commentaire','memo','body']],
 ['cat','Catégorie',['categories','category','categorie','calendar','calendrier','agenda','groupe']],
 ['al','Rappel',['alert','rappel','alarm','alarme','reminder']]
];
const CAT_COL=['#0ea5e9','#ec4899','#14b8a6','#f97316','#a855f7','#84cc16','#ef4444','#6366f1'];
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'cat';
const hnorm=s=>norm(s).replace(/[^a-z0-9]+/g,' ').trim();

function loadXLSX(){
 if(window.XLSX)return Promise.resolve();
 return new Promise((ok,ko)=>{const s=document.createElement('script');s.src='lib/xlsx.core.min.js';s.onload=ok;s.onerror=()=>ko(new Error('lib'));document.head.appendChild(s)});
}
function xlAutoMap(head){
 const H=head.map(hnorm),cand=[];
 XL_F.forEach((f,fi)=>H.forEach((h,ci)=>{
  if(!h)return;let best=0;
  for(const p of f[2]){
   if(h===p)best=Math.max(best,3);
   else if(p.length>=4&&(' '+h+' ').includes(' '+p+' '))best=Math.max(best,2);
  }
  if(best)cand.push({s:best,fi,ci});
 }));
 cand.sort((a,b)=>b.s-a.s||a.ci-b.ci||a.fi-b.fi);
 const map={},used=new Set();
 XL_F.forEach(f=>map[f[0]]=-1);
 for(const c of cand){const k=XL_F[c.fi][0];if(map[k]>=0||used.has(c.ci))continue;map[k]=c.ci;used.add(c.ci)}
 return map;
}
const xlDay=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const xlOk=(y,m,d)=>m>=1&&m<=12&&d>=1&&d<=31&&y>=1990&&y<=2100;
function xlTime(v){
 if(typeof v==='number'){
  if(v<0)return null;
  if(v<1)return Math.min(1439,Math.floor(v*1440+.5));
  if(v>=20000)return Math.min(1439,Math.floor((v-Math.floor(v))*1440+.5));
  return Number.isInteger(v)&&v<=24?(v%24)*60:null;
 }
 const s=String(v==null?'':v).trim().toLowerCase();if(!s)return null;
 const m=s.match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?(?:\s*:\s*\d{2})?\s*(am|pm)?/);
 if(!m)return null;
 let h=+m[1];const mi=+(m[2]||0);
 if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;
 if(h>24||mi>59)return null;return (h%24)*60+mi;
}
/* retourne {d:'AAAA-MM-JJ', t:minutes|null, n:numéro de jour Excel} */
function xlDate(v,us){
 if(typeof v==='number'){
  if(v<20000||v>80000)return null;
  const day=Math.floor(v),dt=new Date(XL_EPOCH+day*864e5);
  const t=Math.min(1439,Math.floor((v-day)*1440+.5));
  return{d:xlDay(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()),t:(v-day)>0.0005?t:null,n:day};
 }
 const s=String(v==null?'':v).trim();if(!s)return null;
 let m,y,mo,da;
 if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+m[1];mo=+m[2];da=+m[3]}
 else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let a=+m[1],b=+m[2];y=+m[3];if(y<100)y+=2000;if(us){mo=a;da=b}else{da=a;mo=b}}
 else return null;
 if(!xlOk(y,mo,da))return null;
 const rest=s.slice(m[0].length);const t=/\d/.test(rest)?xlTime(rest):null;
 return{d:xlDay(y,mo,da),t,n:Math.round((Date.UTC(y,mo-1,da)-XL_EPOCH)/864e5)};
}
const xlTrue=v=>/^(1|y|yes|oui|true|vrai|x|o)$/i.test(String(v==null?'':v).trim());
function xlAlarm(v,start,allDay){
 if(v===''||v==null)return null;
 if(typeof v==='number'){
  if(v>=20000&&v<80000)return Math.max(0,Math.round(start.n*1440+(allDay?540:start.t)-v*1440));
  return v>=0&&v<=20160?Math.round(v):null;
 }
 const m=String(v).toLowerCase().match(/(\d+)\s*(min|h|heure|hour|j|jour|day)/);
 if(!m)return null;const k=/^(h|heure|hour)/.test(m[2])?60:/^(j|jour|day)/.test(m[2])?1440:1;
 return +m[1]*k;
}
function xlUS(rows,col){
 if(col<0)return false;let fr=0,us=0;
 for(const r of rows){const m=String(r[col]==null?'':r[col]).match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{2,4}/);if(m){if(+m[1]>12)fr++;if(+m[2]>12)us++}}

}
function xlConvert(row,map,us){
 const g=k=>map[k]>=0?row[map[k]]:'';
 const title=String(g('title')).replace(/[\uE000-\uF8FF]/g,'').replace(/\s+/g,' ').trim();
 const sdv=g('sd');
 if(!title&&(sdv===''||sdv==null))return null;
 const D=xlDate(sdv,us);
 if(!D)return{bad:true};
 let sm=map.st>=0?xlTime(g('st')):null;
 if(sm==null&&D.t!=null)sm=D.t;
 let allDay;
 if(map.ad>=0&&String(g('ad')).trim()!=='')allDay=xlTrue(g('ad'));
 else allDay=sm==null;
 let E=map.ed>=0?xlDate(g('ed'),us):null;
 let ed=E&&E.d>=D.d?E.d:D.d;
 let em=map.et>=0?xlTime(g('et')):null;
 if(em==null&&E&&E.t!=null)em=E.t;
 const start=sm==null?540:sm;
 if(!allDay&&em==null)em=Math.min(1439,start+60);
 if(!allDay&&em===0&&ed>D.d){ed=add(ed,-1);em=1439}  /* fin à minuit pile = fin de la veille */
 const ev={id:'',title:title||'Sans titre',allDay,start:D.d,end:ed,startTime:hm(start),endTime:hm(allDay?600:em),place:String(g('place')).trim(),note:String(g('note')).replace(/\r/g,'').trim(),cat:'',icon:'',rec:null,ex:[],alarm:null,_cat:String(g('cat')).trim()};
 ev.alarm=xlAlarm(g('al'),{n:D.n,t:start},allDay);
 ev.id='xl-'+hash32([ev.title,ev.start,ev.startTime,ev.end,ev.endTime,ev.allDay].join('|'));

const evKey=e=>norm(e.title).trim()+'|'+e.start+'|'+(e.allDay?'j':e.startTime);
function resolveCats(list,create){
 /* range chaque événement dans une catégorie existante, en crée au besoin (create), sinon « autre » */
 let made=0;
 const byName=new Map(S.cats.map(c=>[norm(c.name).trim(),c.id]));
 for(const e of list){
  const n=norm(e._cat||'').trim();
  if(!n){e.cat=S.cats.some(c=>c.id==='autre')?'autre':S.cats[S.cats.length-1].id;continue}
  if(byName.has(n)){e.cat=byName.get(n);continue}
  if(S.cats.some(c=>c.id===n)){e.cat=n;continue}
  if(create){
   let id=slug(e._cat),k=2;while(S.cats.some(c=>c.id===id))id=slug(e._cat)+'-'+k++;
   S.cats.push({id,name:e._cat.slice(0,30),color:(typeof olColOf==='function'&&olColOf(e._cat,((typeof MSA!=='undefined'&&(MSA.cats||[]).find(c=>norm(c.name).trim()===n)||{}).color),true))||CAT_COL[(S.cats.length)%CAT_COL.length]});
   byName.set(n,id);e.cat=id;made++;
  }else e.cat=S.cats.some(c=>c.id==='autre')?'autre':S.cats[S.cats.length-1].id;
 }
 if(made)saveSet();
 return made;
}

  wb=XLSX.read(txt.replace(/^﻿/,''),{type:'string',raw:true});
 }else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});

  const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!best||rows.length>best.rows.length)best={name:n,rows};

}

/* ---------- Page de choix : liste claire des événements à importer (cases à cocher) ---------- */
function pickImport(o){
 return new Promise(res=>{
  const items=o.items.slice().sort((a,b)=>a.e.start.localeCompare(b.e.start)||a.e.startTime.localeCompare(b.e.startTime));
  const on=new Set(items.map((_,i)=>i));let q='';
  const root=$('#sheet');
  const vis=()=>items.map((it,i)=>({it,i})).filter(x=>!q||norm(x.it.e.title+' '+x.it.e.place+' '+(x.it.e._cat||'')).includes(q));
  const row=x=>{const e=x.it.e;
   return '<button type="button" class="selrow'+(on.has(x.i)?' on':'')+'" data-pk="t" data-i="'+x.i+'"><span class="selck"></span><span class="selx"><b>'+evT(e)+(x.it.upd?' <span class="mut" style="font-weight:700;font-size:.78rem">· mis à jour</span>':'')+'</b><small>'+fShort(e.start)+(e.end!==e.start?' → '+fShort(e.end):'')+' · '+(e.allDay?'Journée':e.startTime+'–'+e.endTime)+(e.place?' · '+esc(e.place):'')+(e._cat?' · '+esc(e._cat):'')+'</small></span></button>'};
  const bits=()=>{
   const n=items.filter((_,i)=>on.has(i)).length;
   const b=$('#pk-ok');if(b){b.textContent='Importer ('+n+')';b.disabled=!n}
   const g=$('#pk-ign');if(g){const m=items.filter((x,i)=>!on.has(i)&&!x.upd).length;g.textContent=m?'Ne plus proposer les '+m+' décoché'+(m>1?'s':''):'Décoche ce que tu ne veux plus jamais voir';g.disabled=!m}
   const c=$('#pk-cnt');if(c)c.textContent=items.length+' événement'+(items.length>1?'s':'')+' · '+n+' coché'+(n>1?'s':'');
  };
  const draw=()=>{const l=$('#pk-list');if(l){const v=vis();l.innerHTML=v.length?v.map(row).join(''):'<p class="empty">Aucun événement avec cette recherche.</p>'}bits()};
  openSheet('<div class="sh-h"><b style="font-size:1.2rem;color:var(--text)">'+esc(o.title)+'</b><span class="sp1"></span><button class="x" data-pk="x" aria-label="Fermer">'+ic('x')+'</button></div>'+
   '<p class="mut" style="margin:0 0 .3rem">'+esc(o.intro||'')+'</p>'+
   '<div class="fld" style="margin:.4rem 0"><input class="in" id="pk-q" type="search" placeholder="Chercher dans la liste…" autocomplete="off"></div>'+
   '<div class="selbar"><span id="pk-cnt" class="mut"></span><span><button class="btn sm" data-pk="all">Tout cocher</button> <button class="btn sm" data-pk="none">Tout décocher</button></span></div>'+
   '<div id="pk-list"></div>'+
   '<div class="sticky-save"><button class="btn grow" data-pk="x">Annuler</button><button class="btn pri grow" id="pk-ok" data-pk="ok">Importer</button></div>'+(o.ignoreBtn?'<button type="button" class="btn blk sm" id="pk-ign" data-pk="ign" style="margin-top:.4rem">Ne plus proposer les décochés</button>':''),'full');
  const cleanup=()=>{root.removeEventListener('click',h);root.removeEventListener('input',inp);mo.disconnect()};
  const h=e=>{
   const t=e.target.closest('[data-pk]');if(!t)return;const k=t.dataset.pk;
   if(k==='t'){const i=+t.dataset.i;if(on.has(i))on.delete(i);else on.add(i);t.classList.toggle('on',on.has(i));bits()}
   else if(k==='all'){vis().forEach(x=>on.add(x.i));draw()}
   else if(k==='none'){vis().forEach(x=>on.delete(x.i));draw()}
   else if(k==='x'){cleanup();closeSheet();res(null)}
   else if(k==='ok'){const out=items.filter((_,i)=>on.has(i));cleanup();closeSheet();res(out)}
   else if(k==='ign'){const out=items.filter((_,i)=>on.has(i));out.ignored=items.filter((x,i)=>!on.has(i)&&!x.upd);cleanup();closeSheet();res(out)}
  };
  const inp=e=>{if(e.target.id==='pk-q'){q=norm(e.target.value).trim();draw()}};
  const mo=new MutationObserver(()=>{if(!root.firstChild){cleanup();res(null)}});
  root.addEventListener('click',h);root.addEventListener('input',inp);mo.observe(root,{childList:true});
  draw();
 });
}

/* ---------- Outlook -> AgenDam (lecture de tes autres calendriers Outlook) ---------- */
const htmlText=h=>{try{const d=new DOMParser().parseFromString(h,'text/html');return (d.body.textContent||'').replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim()}catch(e){return ''}};
function msConv(x,calName,calId){
 if(x.isCancelled)return null;
 const allDay=!!x.isAllDay;
 let start,end,sm=540,em=600;
 const L=s=>new Date(String(s).replace(/\.\d+$/,'')+'Z');
 if(allDay){start=x.start.dateTime.slice(0,10);end=add(x.end.dateTime.slice(0,10),-1);if(end<start)end=start}
 else{const a=L(x.start.dateTime),b=L(x.end.dateTime);start=ds(a);end=ds(b);sm=a.getHours()*60+a.getMinutes();em=b.getHours()*60+b.getMinutes()}
 const body=x.body&&x.body.content?(x.body.contentType==='html'?htmlText(x.body.content):String(x.body.content).trim()):'';
 const ev={id:'ol-'+hash32(x.id),title:String(x.subject||'Sans titre').trim(),allDay,start,end,startTime:hm(sm),endTime:hm(em),place:(x.location&&x.location.displayName)||'',note:body,cat:'',icon:'',rec:null,ex:[],alarm:(!allDay&&x.isReminderOn&&x.reminderMinutesBeforeStart>=0)?x.reminderMinutesBeforeStart:null,src:'ol',oc:calId||'',oid:[x.id],ocat:String((x.categories&&x.categories[0])||'').slice(0,60),_cat:(x.categories&&x.categories[0])||calName};
 return ev;
}

const olDiff=(a,b)=>['title','allDay','start','end','startTime','endTime','place','note','alarm','ocat'].some(k=>(a[k]==null?'':a[k])!==(b[k]==null?'':b[k]));
/* Regroupe les jours identiques (même titre, catégorie, lieu, notes…) en un seul événement sur plusieurs jours */
function mergeDays(list){
 const key=e=>[norm(e.title),e.icon||'',e.place||'',e.note||'',e._cat||e.cat||'',e.ocat||'',e.alarm==null?'':e.alarm,e.src||''].join('|');
 const g=new Map(),out=[];
 for(const e of list){
  if(!e.allDay||e.rec){out.push(e);continue}
  const k=key(e);if(!g.has(k))g.set(k,[]);g.get(k).push(e);
 }
 for(const arr of g.values()){
  arr.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
  let cur=null;
  for(const e of arr){
   if(cur&&e.start<=add(cur.end,1)){if(e.end>cur.end)cur.end=e.end;cur.mids.push(e.id,...(e.mids||[]));cur.oid=(cur.oid||[]).concat(e.oid||[])}
   else{cur=Object.assign({},e,{mids:[e.id].concat(e.mids||[])});out.push(cur)}
  }
 }
 for(const e of out)if(e.mids){e.mids=[...new Set(e.mids)];if(e.mids.length<2)delete e.mids}
 return out;
}
function mergeLocal(){
 const isImp=e=>/^(ol|xl)-/.test(e.id)&&e.allDay&&!e.rec;
 const a=EV.filter(isImp);if(a.length<2)return 0;
 const m=mergeDays(a);const n=a.length-m.length;if(n<=0)return 0;
 const rest=EV.filter(e=>!isImp(e));
 EV.length=0;EV.push(...rest,...m.map(cleanEvent).filter(Boolean));
 touch();render();return n;
}
const isIgn=e=>{const s=S.olIgn;return !!(s&&s.length&&[e.id,...(e.mids||[])].some(i=>s.includes(i)))};
async function olPull(calList,per,catFlag,silent){
 const quiet=!!silent;silent=(silent===true); /* 'ask' = fenêtre à l'ouverture : on ne dit rien s'il n'y a rien de nouveau */
 mergeLocal();await olCatsRefresh();
 const back={m1:31,m3:92,now:0,y1:366}[per]||31;
 const from=add(today(),-back),to=add(today(),366);
 let all=[];let n=0;
 try{
  for(const c of calList){
   if(!quiet)toast('Lecture de « '+c.name+' »…',4000);
   let url='/me/calendars/'+c.id+'/calendarView?startDateTime='+encodeURIComponent(from+'T00:00:00Z')+'&endDateTime='+encodeURIComponent(to+'T00:00:00Z')+'&$top=200&$select=id,subject,start,end,isAllDay,location,body,categories,isReminderOn,reminderMinutesBeforeStart,isCancelled';
   while(url&&n<3000){
    const j=await msFetch(url,{headers:{Prefer:'outlook.timezone="UTC"'}});
    for(const x of (j.value||[])){const e=msConv(x,c.name,c.id);if(e){all.push(e);n++}}
    url=j['@odata.nextLink']||null;
   }
  }
 }catch(e){if(!quiet)toast('Lecture Outlook impossible : '+e.message,6000);return}
 const rawIds=new Set(all.map(e=>e.id)),complete=n<3000,pulled=new Set(calList.map(c=>c.id));
 all=mergeDays(all);
 const byId=new Map(EV.map(e=>[e.id,e])),keys=new Set(EV.map(evKey)),seen=new Set();
 for(const l of EV)if(l.mids)for(const m of l.mids)if(!byId.has(m))byId.set(m,l);
 const fresh=[],upd=[];let dup=0;
 for(const e of all){
  if(seen.has(e.id))continue;seen.add(e.id);
  {const l=byId.get(e.id)||(e.mids||[]).map(m=>byId.get(m)).find(Boolean);if(l)e.id=l.id}
  if(byId.has(e.id)){if(olDiff(byId.get(e.id),e))upd.push(e)}
  else if(keys.has(evKey(e)))dup++;
  else if(!isIgn(e))fresh.push(e);
 }
 /* Événements supprimés dans Outlook : importés d'un calendrier lu cette fois, dans la période lue, et absents maintenant */
 for(const e of all){const l=byId.get(e.id);if(l&&l.src==='ol'){if(!l.oc&&e.oc)l.oc=e.oc;if(!(l.oid&&l.oid.length)&&e.oid)l.oid=e.oid}}
 const gone=complete?EV.filter(l=>l.src==='ol'&&!l.rec&&l.oc&&pulled.has(l.oc)&&l.start>=from&&l.end<=to&&![l.id,...(l.mids||[])].some(i=>rawIds.has(i))):[];
 if(!fresh.length&&!upd.length&&!gone.length){if(!quiet)toast(all.length?'Déjà à jour : rien de nouveau dans Outlook'+(dup?' ('+dup+' déjà présent'+(dup>1?'s':'')+')':''):'Aucun événement trouvé sur cette période',5000);return}
 let F=fresh,U=upd;
 if(!silent&&(fresh.length||upd.length)){
  const pk=await pickImport({ignoreBtn:true,title:'Importer depuis Outlook',intro:(dup?dup+' déjà présent'+(dup>1?'s':'')+' (ignoré'+(dup>1?'s':'')+'). ':'')+'Décoche ce que tu ne veux pas.',items:fresh.map(e=>({e,upd:false})).concat(upd.map(e=>({e,upd:true})))});
  if(!pk){return}
  if(pk.ignored&&pk.ignored.length){const s=new Set(S.olIgn||[]);for(const x of pk.ignored){s.add(x.e.id);for(const m of (x.e.mids||[]))s.add(m)}S.olIgn=[...s].slice(-4000);saveSet();toast(pk.ignored.length+' événement'+(pk.ignored.length>1?'s':'')+' ne seront plus proposés',4000)}
  F=pk.filter(x=>!x.upd).map(x=>x.e);U=pk.filter(x=>x.upd).map(x=>x.e);
 }
 const made=resolveCats(F.concat(U),catFlag);
 for(const e of U)Object.assign(byId.get(e.id),{title:e.title,allDay:e.allDay,start:e.start,end:e.end,startTime:e.startTime,endTime:e.endTime,place:e.place,note:e.note,alarm:e.alarm,ocat:e.ocat||'',mids:e.mids,oid:e.oid||[]});
 EV.push(...F.map(e=>{const x=Object.assign({},e);delete x._cat;return cleanEvent(x)}).filter(Boolean));
 let removed=0;
 if(gone.length){
  if(silent)toast('Outlook : '+gone.length+' événement'+(gone.length>1?'s':'')+' supprimé'+(gone.length>1?'s':'')+' là-bas. Réglages → Récupérer depuis Outlook pour les retirer ici.',6000);
  else{
   const L=gone.slice().sort((a,b)=>a.start<b.start?-1:1);
   const r=await ask({title:'Supprimés dans Outlook',html:'<p style="margin:0 0 .5rem">'+L.length+' événement'+(L.length>1?'s':'')+' n’existe'+(L.length>1?'nt':'')+' plus dans Outlook. Les retirer aussi de l’appli ?</p><ul style="margin:0;padding-left:1.1rem">'+L.slice(0,10).map(e=>'<li>'+evT(e)+' <span class="mut">· '+esc(e.start.slice(8,10)+'/'+e.start.slice(5,7))+'</span></li>').join('')+(L.length>10?'<li>… et '+(L.length-10)+' autre'+(L.length-10>1?'s':'')+'</li>':'')+'</ul>',btns:[{label:'Retirer de l’appli',value:'y',cls:'dng'},{label:'Les garder',value:null}]});
   if(r==='y'){const ids=new Set(L.map(e=>e.id));const keep=EV.filter(e=>!ids.has(e.id));EV.length=0;EV.push(...keep);removed=L.length}
  }
 }
 if(!F.length&&!U.length&&!removed)return;
 touch();render();
 toast((silent?'Outlook : ':'')+F.length+' ajouté'+(F.length>1?'s':'')+(U.length?' · '+U.length+' mis à jour':'')+(made?' · '+made+' catégorie'+(made>1?'s':'')+' créée'+(made>1?'s':''):''),5000);
}

function emoRecent(){
 /* récents (dernier utilisé d'abord) puis les plus utilisés dans l'agenda */
 const cnt={};for(const e of EV)if(e.icon)cnt[e.icon]=(cnt[e.icon]||0)+1;
 const used=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
 const seen=new Set(),out=[];
 for(const e of [...(S.emRecent||[]),...used]){if(!seen.has(e)){seen.add(e);out.push(e)}}
 return out.slice(0,40);
}
function emoRemember(e){
 if(!e)return;
 S.emRecent=[e,...(S.emRecent||[]).filter(x=>x!==e)].slice(0,24);saveSet();
}
/* Ouvre le sélecteur. Résultat : l'emoji choisi, 'none' (retirer), ou null (annulé). */
function pickEmoji(cur){
 return new Promise(res=>{
  const root=$('#dlg');
  const cats=['Récents',...EMO_CATS.map(c=>c[0])];
  const st={cat:emoRecent().length?'Récents':'Visages',q:''};
  const list=()=>{
   if(st.q){const q=norm(st.q).trim();return EMO_INDEX.filter(x=>x.k.includes(q)).map(x=>x.e).filter((e,i,a)=>a.indexOf(e)===i)}
   if(st.cat==='Récents')return emoRecent();
   return EMO_INDEX.filter(x=>x.c===st.cat).map(x=>x.e);
  };
  const grid=()=>{
   const l=list();
   return l.length?l.map(e=>'<button type="button" class="emo" data-em="'+esc(e)+'" aria-label="'+esc(e)+'">'+esc(e)+'</button>').join(''):'<p class="mut" style="grid-column:1/-1;margin:.6rem 0">'+(st.q?'Aucun emoji pour « '+esc(st.q)+' ». Tu peux aussi taper ton emoji directement dans le champ de l’événement.':'Rien ici pour le moment : les emojis que tu utilises apparaîtront ici.')+'</p>';
  };
  const draw=()=>{
   const g=$('#em-grid');if(g){g.innerHTML=grid();g.scrollTop=0}
   $$('#em-cats .chip').forEach(c=>c.classList.toggle('on',!st.q&&c.dataset.cat===st.cat));
  };
  const p=ask({title:'Choisir un emoji',html:
   '<input class="in" id="em-q" type="search" placeholder="Chercher : dentiste, gâteau, avion…" autocomplete="off" style="margin:.2rem 0 .5rem">'+
   '<div class="chips emcats" id="em-cats">'+cats.map(c=>'<button type="button" class="chip" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'+
   '<div id="em-grid" class="emgrid"></div>'+(cur?'<p class="mut" style="margin:.3rem 0 .1rem;font-size:.85rem">Actuel : <span style="font-size:1.3rem">'+esc(cur)+'</span></p>':''),
   btns:[{label:cur?'Aucun emoji (retirer)':'Fermer',value:cur?'none':null},{label:'Annuler',value:null}]});
  let chosen=null;
  const h=e=>{
   const b=e.target.closest('[data-em]');
   if(b){chosen=b.dataset.em;cleanup();const x=root.querySelector('[data-v="1"]');if(x)x.click();return}
   const c=e.target.closest('[data-cat]');
   if(c){st.cat=c.dataset.cat;st.q='';const q=$('#em-q');if(q)q.value='';draw()}
  };
  const inp=e=>{if(e.target.id==='em-q'){st.q=e.target.value;draw()}};
  const cleanup=()=>{root.removeEventListener('click',h);root.removeEventListener('input',inp)};
  root.addEventListener('click',h);root.addEventListener('input',inp);
  draw();
  p.then(v=>{cleanup();res(chosen!=null?chosen:v)});
 });
}

/* jours fériés français (fixes + Pâques, Ascension, Pentecôte) */
const HOL_CACHE={};
function holidaysOf(y){
 if(HOL_CACHE[y])return HOL_CACHE[y];
 const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
 const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
 const easter=new Date(y,mo-1,da);const P=n=>ds(new Date(y,mo-1,da+n));
 const o={};const fx=(mm,dd,n)=>{o[y+'-'+pad(mm)+'-'+pad(dd)]=n};
 fx(1,1,'Jour de l’an');fx(5,1,'Fête du Travail');fx(5,8,'Victoire 1945');fx(7,14,'Fête nationale');fx(8,15,'Assomption');fx(11,1,'Toussaint');fx(11,11,'Armistice');fx(12,25,'Noël');
 o[P(0)]='Pâques';o[P(1)]='Lundi de Pâques';o[P(39)]='Ascension';o[P(49)]='Pentecôte';o[P(50)]='Lundi de Pentecôte';
 return HOL_CACHE[y]=o;
}
const holName=d=>holidaysOf(+d.slice(0,4))[d]||'';
const isHoliday=d=>!!holName(d);
function dayCls(d){let c='';const w=dow(d);if(w===0||w===6)c+=' we';if(S.holi&&isHoliday(d))c+=' hol';if(vacName(d))c+=' vac';return c}

/* ---------- Vacances scolaires (zones A, B, C) : liseré coloré sur les jours de vacances ----------
   Source facultative : calendrier officiel du ministère de l'Éducation nationale (data.education.gouv.fr, open data).
   Seule la zone choisie est envoyée. Périodes ajoutées à la main possibles (hors connexion, autre zone, Corse…). */
const VAC_URL='https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records';
const K_VAC=P+'vac';
let VACD=ls.get(K_VAC,null),VAC_IDX=null,VAC_BUSY=false;
const VAC_COLS=[['#f59e0b','Orange'],['#22c55e','Vert'],['#3b82f6','Bleu'],['#a855f7','Violet'],['#ec4899','Rose'],['#ef4444','Rouge'],['#14b8a6','Turquoise'],['#64748b','Gris']];
const VAC_ACAD={A:'Besançon, Bordeaux, Clermont-Ferrand, Dijon, Grenoble, Limoges, Lyon, Poitiers',B:'Aix-Marseille, Amiens, Lille, Nancy-Metz, Nantes, Nice, Normandie, Orléans-Tours, Reims, Rennes, Strasbourg',C:'Créteil, Montpellier, Paris, Toulouse, Versailles'};
function vacPeriods(){
 const L=[];
 if(VACD&&VACD.zone===S.vacZone&&Array.isArray(VACD.list))VACD.list.forEach(x=>L.push({a:x.a,b:x.b,n:x.n,off:1}));
 (Array.isArray(S.vacMan)?S.vacMan:[]).forEach((x,i)=>L.push({a:x.a,b:x.b,n:x.n||'Vacances',i}));
 return L.filter(x=>RX_D.test(x.a)&&RX_D.test(x.b)&&x.b>=x.a).sort((x,y)=>x.a<y.a?-1:x.a>y.a?1:0);
}
function vacIndex(){
 if(VAC_IDX)return VAC_IDX;
 const m={};
 for(const x of vacPeriods()){let d=x.a,k=0;while(d<=x.b&&k<120){if(!m[d])m[d]=x.n;d=add(d,1);k++}}
 return VAC_IDX=m;
}

/* date du jour (heure de Paris) à partir d'une date ISO de l'open data */
function vacDay(v){
 const t=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
 const d=new Date(t);if(isNaN(d))return '';
 try{const f=new Intl.DateTimeFormat('fr-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);if(RX_D.test(f))return f}catch(e){}
 return ds(d);
}
async function vacFetch(quiet){
 if(VAC_BUSY)return false;
 const z=['A','B','C'].includes(S.vacZone)?S.vacZone:'B';
 const from=(new Date().getFullYear()-1)+'-08-01';
 const F='description,start_date,end_date,population';
 const url=VAC_URL+'?select='+encodeURIComponent(F)+'&where='+encodeURIComponent('zones="Zone '+z+'" and end_date>=date\''+from+'\' and population!="Enseignants"')+'&group_by='+encodeURIComponent(F)+'&order_by=start_date&limit=100';
 VAC_BUSY=true;
 try{
  const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(),seen={},list=[];
  for(const x of (j.results||[])){
   const n=String(x.description||'').trim();
   if(!n||!/vacances|pont/i.test(n)||/^d[ée]but|^fin /i.test(n)||/enseignant/i.test(String(x.population||'')))continue;
   const a=vacDay(x.start_date),e=vacDay(x.end_date);if(!a||!e)continue;
   const b=e>a?add(e,-1):a;
   const key=n+'|'+a;if(seen[key])continue;seen[key]=1;
   list.push({a,b,n:n.replace(/'/g,'’').slice(0,60)});
  }
  if(!list.length)throw new Error('vide');
  list.sort((x,y)=>x.a<y.a?-1:1);
  VACD={zone:z,at:Date.now(),list};ls.set(K_VAC,VACD);vacReset();
  if(!quiet)toast('Vacances scolaires zone '+z+' à jour ('+list.length+' périodes)');
  return true;
 }catch(e){
  if(!quiet)toast('Calendrier officiel indisponible (hors connexion ?). Tu peux ajouter les périodes à la main.',6000);
  return false;
 }finally{VAC_BUSY=false;if(V.view==='settings'||!quiet)render()}
}

}

  for(const c of cals){
   ncal++;
   let url='/me/calendars/'+encodeURIComponent(c.id)+'/events?$select=id,subject,start,end,isAllDay&$top=200&$expand='+encodeURIComponent("singleValueExtendedProperties($filter=id eq '"+MS_PROP+"')"),n=0;

   }

  for(const arr of all.values()){

/* ========= Jour : déplacer un bloc (appui long), avertissement de chevauchement, vues « Journée entière » et « Liste » ========= */
let DRAGGING=false,lastDrag=0;
const hmin=t=>{t=String(t||'0:0').split(':');return (+t[0]||0)*60+(+t[1]||0)};

/* événements horaires qui se chevauchent avec b (même forme qu'un événement : start,end,startTime,endTime,allDay) */
function conflictsFor(b,ignoreId){
 if(!b||b.allDay)return[];
 const list=occsMine(b.start,b.end).filter(o=>o.ev.id!==ignoreId);
 const out=[];
 for(let d=b.start;d<=b.end;d=add(d,1)){
  const s=d===b.start?hmin(b.startTime):0,e=d===b.end?hmin(b.endTime):1440;
  for(const x of segs(list,d).ts){if(x.s<e&&x.e>s)out.push({title:(x.o.ev.icon?x.o.ev.icon+' ':'')+x.o.ev.title,time:hm(x.s)+'–'+hm2(x.e),date:d})}
 }
 return out;
}
function cflText(cf,max){
 const seen=new Set(),l=[];
 for(const c of cf){const k=c.title+c.time+c.date;if(seen.has(k))continue;seen.add(k);l.push(c)}
 return l.slice(0,max||3).map(c=>'« '+c.title+' » '+c.time).join(', ')+(l.length>(max||3)?' …':'');
}

(function(){

  const tg=el.closest('.tg');
  D={el,o,x,y,active:false,hh:parseFloat(getComputedStyle(tg).getPropertyValue('--hh'))||72,s0:o.s,dur:o.e-o.s,ns:o.s,sy:wrap().scrollTop};
  D.timer=setTimeout(()=>{if(!D)return;D.active=true;DRAGGING=true;el.classList.add('lift');try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}label()},450);
 }
 function label(){
  if(!D)return;let b=D.el.querySelector('.dragt');
  if(!b){b=document.createElement('i');b.className='dragt';D.el.appendChild(b)}
  b.textContent=hm(D.ns)+'–'+hm2(D.ns+D.dur);
 }
 function move(x,y,e){
  if(!D)return;
  if(!D.active){if(Math.hypot(x-D.x,y-D.y)>10){clearTimeout(D.timer);D=null}return}
  if(e&&e.cancelable)e.preventDefault();
  const w=wrap();
  if(w){const r=w.getBoundingClientRect();if(y>r.bottom-50)w.scrollTop+=10;else if(y<r.top+90)w.scrollTop-=10}
  const dy=y-D.y+((w?w.scrollTop:0)-D.sy);
  const dm=Math.round(dy/D.hh*60/15)*15;
  D.ns=Math.max(0,Math.min(1440-D.dur,D.s0+dm));
  D.el.style.transform='translateY('+((D.ns-D.s0)/60*D.hh)+'px)';
  label();
 }
 function end(){
  if(!D)return;clearTimeout(D.timer);

  toast('Déplacé à '+ev.startTime+'–'+hm2(d.ns+d.dur)+(cf.length?' · ⚠ chevauche '+cflText(cf,2):''),cf.length?6000:3500);
 }
 document.addEventListener('touchstart',e=>{if(e.touches.length===1)start(e.touches[0].clientX,e.touches[0].clientY,e.target);else{clearTimeout(D&&D.timer);D=null}},{passive:true});

 document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
 document.addEventListener('mousedown',e=>{if(e.button===0)start(e.clientX,e.clientY,e.target)});

})();

/* ---------- Anniversaires (1.16.16) : liste à part, rappels à l'ouverture, export avec alarme ---------- */
const leapY=y=>(y%4===0&&y%100!==0)||y%400===0;
function bdClean(){
 if(!Array.isArray(S.bd))S.bd=[];
 return S.bd.filter(b=>b&&b.n&&b.m>=1&&b.m<=12&&b.d>=1&&b.d<=31);
}
/* date de l'anniversaire pour une année donnée (29 fév. -> 28 fév. si année non bissextile) */
function bdDateIn(b,y){let d=b.d;if(b.m===2&&d===29&&!leapY(y))d=28;return y+'-'+pad(b.m)+'-'+pad(d)}
function bdNext(b,from){
 const y=+from.slice(0,4);let x=bdDateIn(b,y);
 if(x<from)x=bdDateIn(b,y+1);return x;
}
function bdAge(b,date){return b.y>0?(+date.slice(0,4))-b.y:null}
function bdOn(date){
 const y=+date.slice(0,4);
 return bdClean().filter(b=>bdDateIn(b,y)===date);
}
const bdAgeTxt=(b,date)=>{const a=bdAge(b,date);return a!=null&&a>=0?(a<=1?a+' an':a+' ans'):''};
function bdGifts(b){
 if(Array.isArray(b.g))return b.g.filter(x=>x&&x.t);
 /* ancienne note libre : « - vélo - planète » devient une liste */
 const n=String(b.note||'').trim();if(!n)return [];

/* ---------- Code de protection (cache les noms, pas un vrai chiffrement) ---------- */
let BD_OK=false,BD_T=0;
/* déverrouillé pour 2 minutes seulement, puis tout se recache */
function bdUnlock(){BD_OK=true;clearTimeout(BD_T);BD_T=setTimeout(()=>{BD_OK=false;const bl=$('#sheet .bdrow');if(bl&&SHEET_OPEN)bdShow();render()},120000)}
function bdRelock(){BD_OK=false;clearTimeout(BD_T)}
const bdLocked=()=>!!S.bdPin&&!BD_OK;
/* le nom n'est jamais caché : la protection ne cache que les idées cadeaux */
const bdHide=b=>false;
const bdName=b=>bdHide(b)?'🔒 Anniversaire protégé':b.n;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.bdPin){bdRelock()}});
async function bdHash(pin,salt){
 const s=salt+':'+pin;
 try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'f'+h.toString(16);
}
/* Face ID / empreinte : WebAuthn en local (le système demande le visage ou l'empreinte) */
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bdBioAvail(){try{return !!(window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bdBioEnable(){
 try{
  const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'AgenDam'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'agendam',displayName:'AgenDam'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  if(!cr)return false;S.bdBio=b64u(cr.rawId);saveSet();return true;
 }catch(e){return false}
}
async function bdBioCheck(){
 if(!S.bdBio)return false;
 try{
  const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64u(S.bdBio)}],userVerification:'required',timeout:60000}});
  return !!r;
 }catch(e){return false}
}
async function bdAskPin(title,extra,confirm2){

 const html=(extra||'')+'<input id="bd-p1" '+inp+' placeholder="••••">'+(confirm2?'<p class="mut" style="margin:.5rem 0 .2rem;font-size:.85rem">Retape le code pour confirmer</p><input id="bd-p2" '+inp+' placeholder="••••">':'');
 const h=e=>{const x=e.target.closest('[data-v]');if(x&&x.dataset.v==='0'){a=$('#bd-p1').value;b=confirm2?$('#bd-p2').value:a}};

/* demande le code si nécessaire ; renvoie true si l'accès est autorisé */
async function bdGate(){
 if(!S.bdPin||BD_OK)return true;
 let msg='';
 if(S.bdBio&&await bdBioCheck()){bdUnlock();render();return true}
 for(;;){
  const {r,a}=await bdAskPin('Anniversaires protégés',msg);
  if(r==='bio'){if(await bdBioCheck()){bdUnlock();render();return true}msg='<p style="margin:.2rem 0 .5rem;color:#c0392b;font-weight:650">Face ID / empreinte non reconnu, utilise le code.</p>';continue}
  if(r==='forgot'){
   const f=await ask({title:'Code oublié',html:'<p style="margin:.2rem 0 .5rem">Il n’existe aucun moyen de retrouver le code. Tu peux <b>effacer la liste des anniversaires et le code</b>, puis recommencer (ta sauvegarde .json, si tu en as une, les contient encore).</p>',btns:[{label:'Effacer la liste et le code',value:'y',cls:'danger'},{label:'Annuler',value:null}]});
   if(f==='y'){S.bd=[];S.bdPin='';S.bdBio='';saveSet();bdRelock();render();toast('Liste et code effacés');return true}
   return false;
  }
  if(r!=='ok')return false;
  const salt=String(S.bdPin).split(':')[0];
  if(a&&await bdHash(a,salt)===String(S.bdPin).split(':')[1]){bdUnlock();render();return true}
  msg='<p style="margin:.2rem 0 .5rem;color:#c0392b;font-weight:650">Code incorrect, réessaie.</p>';
 }
}
async function bdSetPin(){
 if(S.bdPin&&!(await bdGate()))return;
 const cur=!!S.bdPin;
 if(cur){
  const r=await ask({title:'Code de protection',text:'Un code protège actuellement tes anniversaires.',btns:[{label:'Changer le code',value:'chg',cls:'pri'},{label:'Retirer le code',value:'off'},{label:'Annuler',value:null}]});
  if(r==='off'){S.bdPin='';S.bdBio='';saveSet();render();toast('Code retiré');return}
  if(r!=='chg')return;
 }
 const {r,a,b}=await bdAskPin('Choisis un code (4 à 8 chiffres)','<p class="mut" style="margin:.2rem 0 .5rem;font-size:.85rem">Il cache les noms (liste, rappel, jour) à quelqu’un qui prendrait ton téléphone ouvert. Ce n’est pas un chiffrement : ne l’utilise pas pour des secrets.</p>',true);
 if(r!=='ok')return;

 const salt=uid();S.bdPin=salt+':'+await bdHash(a,salt);bdRelock();saveSet();render();toast('🔒 Code enregistré');
}

/* PDF écrit à la main (texte, Helvetica) : léger, plusieurs pages, sans capture d'écran */
const CP1252={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
function pdfStr(t){
 let o='(';
 for(const ch of String(t)){
  let c=ch.codePointAt(0);
  if(CP1252[ch]!=null)c=CP1252[ch];else if(c>255||(c>=0x80&&c<0xA0))c=0x3F;
  if(c===0x28||c===0x29||c===0x5C)o+='\\'+ch;
  else if(c<32)o+=' ';
  else if(c>126)o+='\\'+c.toString(8).padStart(3,'0');
  else o+=ch;
 }
 return o+')';
}
function bdPDF(L){
 const W=595,H=842,M=42,colW=(W-2*M-24)/2,y0=new Date().getFullYear();
 const pages=[];let cur=null,col=0,y=0;
 const top=H-M-34,bot=M+22;
 const newPage=first=>{cur=[];pages.push(cur);col=0;y=first?top-30:top;
  if(first){cur.push('BT /F2 20 Tf '+M+' '+(H-M-8)+' Td '+pdfStr('Anniversaires')+' Tj ET');
   cur.push('BT /F1 11 Tf '+(M+140)+' '+(H-M-8)+' Td '+pdfStr(L.length+' personne'+(L.length>1?'s':''))+' Tj ET')}};
 const X=()=>M+col*(colW+24);
 const need=h=>{if(y-h<bot){if(col===0){col=1;y=pages.length===1?top-30:top}else newPage(false)}};
 const wrap=(t,n)=>{const w=[];let l='';for(const word of String(t).split(' ')){if((l+' '+word).trim().length>n&&l){w.push(l);l=word}else l=(l+' '+word).trim()}if(l)w.push(l);return w};
 newPage(true);
 for(let m=1;m<=12;m++){
  const l=L.filter(b=>b.m===m);if(!l.length)continue;
  need(60);
  cur.push('BT /F2 12.5 Tf '+X()+' '+y+' Td '+pdfStr(cap(ML[m-1]))+' Tj ET');
  cur.push('0.5 w '+X()+' '+(y-3)+' m '+(X()+colW)+' '+(y-3)+' l S');
  y-=18;
  for(const b of l){
   const a=b.y?y0-b.y:null,g=bdGifts(b);
   const head=b.d+'  '+b.n+(a!=null&&a>=0?'  ('+a+' an'+(a>1?'s':'')+' en '+y0+')':'');
   const hl=wrap(head,44),gl=g.length?wrap(g.map(x=>(x.x?'[x] ':'[ ] ')+x.t).join('    '),52):[];
   need(14*hl.length+12*gl.length+4);
   hl.forEach((t,i)=>{cur.push('BT /F1 10.5 Tf '+(X()+(i?12:0))+' '+y+' Td '+pdfStr(t)+' Tj ET');y-=14});
   gl.forEach(t=>{cur.push('BT /F1 9.5 Tf '+(X()+12)+' '+y+' Td 0.25 g '+pdfStr(t)+' Tj 0 g ET');y-=12});
   y-=3;
  }
  y-=6;
 }
 const foot='AgenDam - imprimé le '+fmtDate(Date.now());
 pages.forEach((c,i)=>c.push('BT /F1 8 Tf 0.4 g '+M+' '+(M-6)+' Td '+pdfStr(foot+(pages.length>1?'  -  page '+(i+1)+'/'+pages.length:''))+' Tj 0 g ET'));
 /* assemblage */
 const objs=[];const add=s=>{objs.push(s);return objs.length};
 add('<< /Type /Catalog /Pages 2 0 R >>');
 add('PAGES');
 add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const kids=[];
 for(const c of pages){
  const st=c.join('\n');
  const cid=add('<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream');
  const pid=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cid+' 0 R >>');
  kids.push(pid+' 0 R');
 }
 objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
 let out='%PDF-1.4\n';const off=[];
 objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
 const xr=out.length;
 out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
 return u;
}

/* ---------- Conversion des événements « anniversaire » existants ---------- */
const BD_RE=/anniv|birthday|🎂/i;
function bdNameOf(t){
 let n=String(t||'').replace(/[🎂🎈🎉🎁]/g,'').replace(/^\s*(joyeux\s+)?anniv(ersaire)?\.?\s*(de\s+|d['’]\s*|du\s+|des\s+)?/i,'').replace(/\s*[-–:(]*\s*anniv(ersaire)?\)?\s*$/i,'').replace(/\s*\(\d+\s*ans?\)\s*$/i,'').trim();
 return n||String(t||'').trim();
}
function bdCandidates(){
 const out=new Map();
 for(const e of EV){
  const c=catOf(e.cat);
  if(!(BD_RE.test(e.title||'')||BD_RE.test((c&&c.name)||'')||BD_RE.test(e.ocal||'')||BD_RE.test(e.ocat||'')))continue;
  if(!e.allDay)continue;
  const n=bdNameOf(e.title),m=+e.start.slice(5,7),d=+e.start.slice(8,10);
  const k=norm(n)+'|'+m+'|'+d;
  if(bdClean().some(b=>norm(b.n)===norm(n)&&b.m===m&&b.d===d)){ /* déjà dans la liste : on propose quand même de retirer l'événement */ }
  if(!out.has(k))out.set(k,{n,m,d,ids:[],evs:[]});
  const g=out.get(k);g.ids.push(e.id);g.evs.push(e);
 }
 return [...out.values()].sort((a,b)=>a.m-b.m||a.d-b.d||a.n.localeCompare(b.n));
}

/* ---------- Import des contacts (.vcf) ---------- */
function parseVCF(text){
 const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'').split('\n');
 const out=[];let cur=null;
 for(const ln of lines){
  const u=ln.toUpperCase();
  if(u.startsWith('BEGIN:VCARD')){cur={fn:'',n:'',bday:''};continue}
  if(u.startsWith('END:VCARD')){if(cur&&cur.bday)out.push(cur);cur=null;continue}
  if(!cur)continue;
  const i=ln.indexOf(':');if(i<0)continue;
  const key=ln.slice(0,i).split(';')[0].toUpperCase().replace(/^ITEM\d+\./,''),val=ln.slice(i+1).trim();
  if(key==='FN')cur.fn=val;
  else if(key==='N'){const p=val.split(';');cur.n=((p[1]||'')+' '+(p[0]||'')).trim()}
  else if(key==='BDAY')cur.bday=val;
 }
 const res=[];
 for(const c of out){
  const v=c.bday.replace(/[^0-9T-]/g,'');
  let y=0,m=0,d=0,mm;
  if((mm=v.match(/^(\d{4})-?(\d{2})-?(\d{2})/))){y=+mm[1];m=+mm[2];d=+mm[3]}
  else if((mm=v.match(/^--?-?(\d{2})-?(\d{2})/))){m=+mm[1];d=+mm[2]}
  else continue;
  if(y<1900||y>2100)y=0; /* Apple met 1604 quand l'année est inconnue */
  const n=(c.fn||c.n||'').trim();
  if(!n||m<1||m>12||d<1||d>31)continue;
  res.push({n:n.slice(0,60),m,d,y});
 }
 return res;
}

 if(r!=='ok')return;

 bdShow();
}

/* ---------- Export .ics avec alarme (iPhone, Android, ordinateur) ---------- */
function bdICS(list){
 const stampv=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda agd//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:Anniversaires AgenDam'];
 const y0=new Date().getFullYear();
 for(const b of (list||bdClean())){
  const st=bdDateIn(b,y0),en=add(st,1);
  L.push('BEGIN:VEVENT','UID:bd-'+b.id+'@agd.agenda','DTSTAMP:'+stampv,'DTSTART;VALUE=DATE:'+icsD(st),'DTEND;VALUE=DATE:'+icsD(en),
   'SUMMARY:'+icsEsc('🎂 Anniversaire de '+b.n),'RRULE:FREQ=YEARLY','TRANSP:TRANSPARENT','CATEGORIES:Anniversaire');
  /* volontairement sans les idées cadeaux : elles restent dans l'appli */
  /* le jour même à 9 h, et la veille à 18 h */
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Anniversaire de '+b.n),'TRIGGER:PT9H','END:VALARM');
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Demain : anniversaire de '+b.n),'TRIGGER:-PT6H','END:VALARM');
  L.push('END:VEVENT');
 }
 L.push('END:VCALENDAR');
 return L.map(fold).join('\r\n')+'\r\n';
}

/* ---------- Toast & dialogues ---------- */
function toast(msg,ms,action){
 const root=$('#toast');if(!root)return;
 const el=document.createElement('div');el.className='tst';
 el.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button>'+esc(action.label)+'</button>':'');
 if(action)el.querySelector('button').onclick=()=>{el.remove();action.fn()};
 [...root.children].forEach(x=>{if(x.firstChild&&x.firstChild.textContent===msg)x.remove()});while(root.children.length>=2)root.firstChild.remove();
 root.appendChild(el);
 setTimeout(()=>el.remove(),ms||3200);
}
function ask(o){
 return new Promise(res=>{
  const root=$('#dlg');
  const btns=o.btns||[];
  root.innerHTML='<div class="ov dlgov"><div class="sh dlgbox" role="dialog" aria-modal="true"><h2 style="font-size:1.25rem">'+esc(o.title||'')+'</h2>'+(o.html?o.html:'<p style="margin:.3rem 0 .6rem">'+esc(o.text||'')+'</p>')+
   btns.map((b,i)=>'<button class="btn blk '+(b.cls||'')+'" data-v="'+i+'">'+esc(b.label)+'</button>').join('')+'</div></div>';
  const done=v=>{root.innerHTML='';root.onclick=null;res(v)};
  root.onclick=e=>{
   const b=e.target.closest('[data-v]');
   if(b){e.stopPropagation();done(btns[+b.dataset.v].value)}
   else if(e.target.classList.contains('ov')){e.stopPropagation();done(null)}
  };
 });
}

 if(!RX_D.test(b.start)||!RX_D.test(b.end)){toast('Date invalide');return}

 const ev0=ED.id?findEv(ED.id):null;
 if(!b.allDay){const cf=conflictsFor(b,ev0?ev0.id:null);if(cf.length){const r=await ask({title:'Attention : horaire déjà pris',html:'<p style="margin:.2rem 0 .6rem">Il y a déjà '+(cf.length>1?'des événements':'un événement')+' à cette période :</p><p style="margin:0 0 .6rem;font-weight:650">'+esc(cflText(cf,4))+'</p>',btns:[{label:'Enregistrer quand même',value:'y',cls:'pri'},{label:'Modifier l’horaire',value:null}]});if(r!=='y')return}}
 let target=b.start,saved=null;

 if(!ev0){saved=cleanEvent(Object.assign({id:uid()},b));EV.push(saved)}
 else if(!ev0.rec){Object.assign(ev0,cleanEvent(Object.assign({},b,{id:ev0.id,grp:ev0.grp,old:ev0.src==='ol'?(ev0.oid||[]):(ev0.old||[])})));saved=ev0}
 else{

  if(!r)return;

   if(!ev0.ex.includes(ED.occ))ev0.ex.push(ED.occ);

  }else{

  }
 }
 S.lastCat=b.cat;S.askPhone=wantPhone;saveSet();touch();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

 if(wantPhone&&saved&&!demo)askPhone(saved,!!ev0);
}
