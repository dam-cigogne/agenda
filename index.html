<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--text:#10151c;--muted:#5b6574;--line:#e2e6ec;--line2:#eef1f5;
  --accent:#2f5bea;--on-accent:#fff;--accent-soft:rgba(47,91,234,.10);--todaybg:rgba(47,91,234,.09);--todayc:rgba(47,91,234,.16);
  --danger:#d92d20;--warn:#f59e0b;--shadow:0 10px 40px rgba(16,24,40,.22);--scale:1;
}
html[data-theme=dark]{
  --bg:#0d1117;--surface:#161b22;--surface2:#212833;--text:#eef1f5;--muted:#9aa5b4;--line:#2b3340;--line2:#202731;
  --accent:#7b97ff;--on-accent:#0b1020;--accent-soft:rgba(123,151,255,.16);--todaybg:rgba(123,151,255,.13);--todayc:rgba(123,151,255,.24);
  --danger:#ff6b5f;--shadow:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(17px*var(--scale)*var(--dev,1));-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
.ic{width:1.45rem;height:1.45rem;flex:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:calc(1500px*var(--dev,1));margin:0 auto;background:var(--bg);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* header */
#top{display:flex;align-items:center;gap:.15rem;padding:calc(env(safe-area-inset-top,0px) + .55rem) .6rem .5rem .95rem;background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:1.32rem;font-weight:780;letter-spacing:-.015em;line-height:1.15}
.ttl small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.nav{display:flex;align-items:center;gap:.1rem}
.ib{width:2.7rem;height:2.7rem;border-radius:.8rem;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.ib:active,.pill:active{background:var(--surface2)}
.pill{padding:.45rem .8rem;border:1.5px solid var(--line);border-radius:999px;font-weight:700;font-size:.82rem}

@media(max-width:560px){
  #top{display:grid;grid-template-columns:1fr auto auto auto auto;row-gap:.35rem;padding-bottom:.55rem}
  #top>#gearbtn{grid-column:4;grid-row:1}
  #top>.ib[data-act=help]{grid-column:3;grid-row:1}
  #top>.ib[data-act=print]{grid-column:2;grid-row:1}
  .nav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:3.2rem 1fr 3.2rem;gap:.5rem}
  .nav .ib{background:var(--surface2);width:auto}
  .nav .pill{text-align:center;display:grid;place-items:center;height:2.7rem;font-size:.95rem}
}
/* body */
#body{flex:1;display:flex;min-height:0;position:relative}
#main{flex:1;min-width:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#main.fixed{overflow:hidden}
#side{display:none;width:21rem;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto}
@media(min-width:900px){#body.has-side #side{display:block}}
#fab{position:absolute;right:1rem;bottom:1rem;width:3.7rem;height:3.7rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(47,91,234,.4);z-index:20}
#fab .ic{width:1.8rem;height:1.8rem;stroke-width:2.4}
#body.nofab #fab{display:none}
@media(min-width:900px){#body.has-side #fab{right:22.2rem}}

/* tabs */
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem 0 .4rem;color:var(--muted);text-align:center}
#tabs em{font-style:normal;font-size:.72rem;font-weight:700}
#tabs button.on{color:var(--accent)}
#tabs button .ic{width:1.6rem;height:1.6rem}

/* banners */
#banner:empty{display:none}
.bn{display:flex;align-items:center;gap:.4rem .6rem;flex-wrap:wrap;margin:.45rem .7rem 0;padding:.45rem .7rem;border-radius:.9rem;font-size:.8rem;background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1.5px solid var(--warn)}
.bn span{flex:1 1 10rem}
.bn.demo{background:var(--accent-soft);border-color:var(--accent)}
.bn button{font-weight:800;color:var(--accent);padding:.3rem .5rem}

/* time grid */
.tg-wrap{height:100%;overflow:auto;position:relative;background:var(--surface);-webkit-overflow-scrolling:touch}
.tg{min-width:var(--tgmin,0);--hw:3.1rem;position:relative}
.tg-top{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-row{display:grid;grid-template-columns:var(--hw) repeat(var(--cols),minmax(0,1fr))}
.gut{position:sticky;left:0;background:var(--surface);z-index:4}
.dh{display:flex;flex-direction:column;align-items:center;padding:.35rem 0 .3rem;border-left:1px solid var(--line);color:var(--muted);font-size:.78rem;font-weight:700;text-transform:capitalize}
.dh b{font-size:1.25rem;line-height:1.4;width:2.1rem;height:2.1rem;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.dh.today{color:var(--accent)}
.dh.today b{background:var(--accent);color:var(--on-accent)}
.adc{border-left:1px solid var(--line);padding:.2rem .15rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.adchip{display:block;width:100%;padding:.15rem .4rem;border-radius:.4rem;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:4px solid var(--c);font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adlab{font-size:.68rem;color:var(--muted);font-weight:700;padding:.35rem .3rem 0 0;text-align:right}
.tg-body{display:grid;grid-template-columns:var(--hw) repeat(var(--cols),minmax(0,1fr));height:calc(var(--hh)*24)}
.tg-hours{position:sticky;left:0;z-index:4;background:var(--surface)}
.tg-hours span{position:absolute;right:.45rem;transform:translateY(-50%);font-size:.72rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% var(--hh),100% calc(var(--hh)/2)}
.tg-col.today{background-color:var(--todaybg)}
.ev{position:absolute;overflow:hidden;border-radius:.6rem;padding:.25rem .45rem;background:var(--surface2);background:color-mix(in srgb,var(--c) 17%,var(--surface));border-left:5px solid var(--c);font-size:.88rem;line-height:1.2;min-height:calc(var(--hh)*.4);z-index:2}
.ev b{display:block;font-weight:720;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;color:var(--muted);font-size:.78em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sm{display:flex;gap:.4rem;align-items:baseline;white-space:nowrap}
.ev.sm b{flex:0 1 auto}.ev.sm .tt{font-size:.76em;color:var(--muted);font-weight:600}
.wk .ev{font-size:.78rem;padding:.2rem .3rem;border-left-width:4px}
.nowline{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:3;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444}

/* week list (phone) */
.wl{padding:.4rem .7rem 6rem}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;margin:.55rem 0;overflow:hidden}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wd-h{display:flex;align-items:center;gap:.7rem;width:100%;padding:.6rem .85rem;border-bottom:1px solid var(--line2)}
.wd-n{font-size:1.5rem;font-weight:800;line-height:1;min-width:2.2rem}
.wd.today .wd-n{color:var(--accent)}
.wd-w{flex:1;font-weight:700;text-transform:capitalize}
.wd-w small{display:block;color:var(--muted);font-weight:600;font-size:.76rem;text-transform:none}
.wd-add{color:var(--accent);width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:.7rem}
.wd .empty{padding:.7rem .85rem;margin:0}

/* rows */
.row{display:flex;align-items:stretch;gap:.7rem;width:100%;padding:.65rem .85rem}
.row+.row{border-top:1px solid var(--line2)}
.row:active{background:var(--surface2)}
.rt{width:3.7rem;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rt b.ad{font-size:.8rem;color:var(--muted);padding-top:.1rem}
.rt b{display:block;font-weight:780;font-size:1rem}
.rt small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.row .bar{width:.3rem;border-radius:.2rem;background:var(--c);flex:none}
.rx{flex:1;min-width:0}
.rx b{display:block;font-size:1.05rem;font-weight:740;line-height:1.25}
.rx small{display:flex;align-items:center;gap:.25rem;color:var(--muted);font-size:.84rem;font-weight:600;margin-top:.1rem}
.rx small .ic{width:.9rem;height:.9rem}
.empty{color:var(--muted);font-weight:600;padding:1rem;margin:0}

/* month */
.mo{padding:.4rem .5rem .5rem}
.mo-h,.mo-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-h span{text-align:center;font-size:.78rem;color:var(--muted);font-weight:750;padding:.4rem 0;text-transform:capitalize}
.mo-g{border-top:1px solid var(--line);background:var(--surface);border-radius:1rem;overflow:hidden;border:1px solid var(--line)}
.mc{min-height:4.6rem;border-top:1px solid var(--line2);border-left:1px solid var(--line2);padding:.25rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:0}
.mc:nth-child(-n+7){border-top:0}.mc:nth-child(7n+1){border-left:0}
.mc .n{width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:1rem}
.mc.today .n{background:var(--accent);color:var(--on-accent)}
.mc.sel{background:var(--accent-soft)}
.mc.out{opacity:.38}
.mc.we .n{color:var(--muted)}
.mc.today.we .n{color:var(--on-accent)}
.mbars{width:100%;display:flex;flex-direction:column;gap:3px;padding:0 .15rem}
.mbar{display:block;height:.38rem;border-radius:.2rem;background:var(--c)}
.mbar span{display:none}
.mmore{font-size:.7rem;color:var(--muted);font-weight:800;text-align:center}
@media(min-width:700px){
  .mo{padding:.6rem .9rem 1rem}
  .mc{min-height:7.4rem;align-items:stretch;padding:.3rem .3rem}
  .mc .n{align-self:flex-start;width:1.9rem;height:1.9rem;font-size:.95rem}
  .mbars{padding:0;gap:2px}
  .mbar{height:auto;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:4px solid var(--c);border-radius:.3rem;padding:.08rem .3rem;font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar span{display:inline}
  .mmore{text-align:left;padding-left:.3rem}
}
.dl{background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;margin:.7rem .5rem 6rem;overflow:hidden}
.dl-h{display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;border-bottom:1px solid var(--line2)}
.dl-h>div{flex:1}.dl-h b{display:block;font-size:1.1rem}.dl-h small{color:var(--muted);font-weight:600}
.dl .btn.blk{width:calc(100% - 1.4rem);margin:.5rem .7rem .7rem}
#main .dl.inmain{display:block}
@media(min-width:900px){#body.has-side #main .dl.inmain{display:none}}

/* month 2 : titres dans les cases */
.mo2{display:flex;flex-direction:column;height:100%;min-height:calc(var(--rows)*5rem + 2.2rem);background:var(--surface)}
.mo2-h,.mw-bg,.mw-fg{display:grid;grid-template-columns:1.5rem repeat(7,minmax(0,1fr))}
.mo2-h{position:sticky;top:0;z-index:2;background:var(--surface);padding:.4rem 0 .3rem;border-bottom:1px solid var(--line);font-size:.74rem;color:var(--muted);font-weight:750;text-align:center;text-transform:capitalize}
.mw{position:relative;flex:1 1 0;min-height:5rem;border-top:1px solid var(--line)}
.mw:first-of-type{border-top:0}
.mw-bg{position:absolute;inset:0}
.mw-fg{position:absolute;inset:0;grid-template-rows:1.5rem;grid-auto-rows:min-content;align-content:start;pointer-events:none;overflow:hidden}
.wn{font-size:.62rem;color:var(--muted);font-weight:700;padding:.35rem 0 0 .25rem}
.bgc{border-left:1px solid var(--line2);display:block;width:100%;height:100%}
.bgc.out{background:var(--surface2)}
.bgc.sel{background:var(--accent-soft)}
.bgc.today{background:var(--todayc);box-shadow:inset 0 0 0 2px var(--accent);border-radius:.35rem}
.mn.today{box-shadow:0 0 0 3px var(--todayc)}
.mn{justify-self:end;align-self:start;font-size:.78rem;font-weight:750;line-height:1.25;padding:.05rem .3rem;margin:.12rem .12rem 0 0;border-radius:999px;min-width:1.45rem;text-align:center}
.mn.today{background:var(--accent);color:var(--on-accent)}
.mn.out{color:var(--muted);opacity:.65}
.mhid{justify-self:start;align-self:start;font-size:.62rem;color:var(--muted);font-weight:800;padding:.3rem 0 0 .25rem}
.mband{display:block;font-style:normal;font-size:calc(.7rem*var(--bsc,1));line-height:1.46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 1px 1px}
.mband{font-weight:700;padding:0 .3rem;border-radius:.3rem;background:var(--c);color:var(--ink)}
.mband.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.mband.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.mcol{display:flex;flex-direction:column;gap:1px;min-width:0;margin:0 1px;align-self:start;overflow:hidden}
.mcol.l1 .ei{display:none}
.ml{font-style:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--ln,1);white-space:normal;overflow:hidden;overflow-wrap:anywhere;margin:0;font-weight:650;line-height:1.25;padding:0 .12rem 0 .2rem;border-left:3px solid var(--c);border-radius:.15rem;background:rgba(127,127,127,.13);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ml em{font-style:normal;color:var(--muted);font-weight:600}
@media(min-width:700px){.mband{font-size:calc(.8rem*var(--bsc,1))}.mn{font-size:.9rem}}
#body.mview #fab{width:3.1rem;height:3.1rem;right:.7rem;bottom:.7rem}
#body.mview #fab .ic{width:1.5rem;height:1.5rem}
@media(min-width:900px){#body.has-side.mview #fab{right:22rem}}

/* side panel */
.sp{padding:1rem}
.sp h3{margin:1rem 0 .4rem;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem}
.mini-h b{font-size:1.05rem;text-transform:capitalize}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini span.w{font-size:.7rem;color:var(--muted);font-weight:700;padding:.2rem 0;text-transform:capitalize}
.mini button{height:2.1rem;border-radius:50%;font-size:.88rem;font-weight:650;position:relative}
.mini button.out{opacity:.35}
.mini button.today{background:var(--accent);color:var(--on-accent)}
.mini button.sel:not(.today){background:var(--accent-soft);color:var(--accent)}
.mini button i{position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mini button.today i{background:var(--on-accent)}
.sp .dl{margin:.4rem 0 0}

/* sheets & dialogs */
#sheet:empty,#dlg:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.dlgov{z-index:80;align-items:center}
.sh{background:var(--surface);width:100%;max-width:40rem;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:1.4rem 1.4rem 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
.sh.full{height:92vh;height:92dvh}
.dlgbox{border-radius:1.3rem;max-width:26rem;margin:1rem;width:calc(100% - 2rem);padding:1.1rem}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:1.4rem;max-height:88vh}.sh.full{height:auto;max-height:90vh}}
.sh-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;color:var(--muted);font-weight:700;font-size:.85rem}
.sh-h .sp1{flex:1}
.sh h2{margin:.1rem 0 .5rem;font-size:1.5rem;line-height:1.2;letter-spacing:-.01em}
.sh h3{margin:1rem 0 .35rem;font-size:1rem}
.cdot{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.x{width:2.5rem;height:2.5rem;border-radius:.8rem;display:grid;place-items:center}
.info{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;border-top:1px solid var(--line2)}
.info .ic{color:var(--muted);margin-top:.1rem}
.info div{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.info b{display:block}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.btn{padding:.75rem 1rem;border-radius:.95rem;font-weight:750;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-align:center}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.blk{display:flex;width:100%;margin-top:.5rem}
.btn.sm{padding:.45rem .75rem;font-size:.85rem}
.btn .ic{width:1.15rem;height:1.15rem}
.grow{flex:1}

/* forms */
.fld{margin:.85rem 0}
.lbl{display:block;font-size:.76rem;color:var(--muted);font-weight:750;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:.85rem;padding:.7rem .8rem;min-height:2.9rem;color:var(--text)}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.in.big{font-size:1.25rem;font-weight:700}
textarea.in{min-height:5rem;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.45rem .8rem;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.88rem;background:var(--surface)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.cat{display:inline-flex;align-items:center;gap:.4rem}
.chip.cat:before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.chip.cat.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c);color:var(--text)}
.chip.dayc{min-width:2.7rem;text-align:center;padding:.5rem .3rem}
.sub{background:var(--surface2);border-radius:.9rem;padding:.7rem .8rem;margin-top:.5rem}
.sub .fld:first-child{margin-top:0}.sub .fld:last-child{margin-bottom:0}
.hide{display:none!important}
.hint{font-size:.82rem;color:var(--muted);margin:.35rem 0 0;font-weight:550}
.tgl-row{display:flex;align-items:center;gap:.8rem;justify-content:space-between;padding:.2rem 0}
.tgl-row b{font-weight:700}
.tgl{position:relative;width:3.1rem;height:1.85rem;flex:none}
.tgl input{appearance:none;-webkit-appearance:none;width:100%;height:100%;margin:0;border-radius:999px;background:var(--line);cursor:pointer;transition:.15s}
.tgl input:checked{background:var(--accent)}
.tgl:after{content:"";position:absolute;left:.2rem;top:.2rem;width:1.45rem;height:1.45rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s;pointer-events:none}
.tgl:has(input:checked):after{left:1.45rem}
.sticky-save{position:sticky;bottom:calc(-1rem - env(safe-area-inset-bottom,0px));background:var(--surface);padding:.7rem 0 .2rem;margin-top:1rem;display:flex;gap:.5rem;border-top:1px solid var(--line2)}

/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;padding:1rem;margin:.7rem}
.card h3{margin:0 0 .6rem;font-size:1.05rem}
.card p{margin:.4rem 0}
.seg{display:flex;background:var(--surface2);border-radius:.85rem;padding:3px;gap:2px}
.seg button{flex:1;padding:.5rem .2rem;border-radius:.65rem;font-weight:700;font-size:.85rem;text-align:center}
.seg button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18);color:var(--accent)}
.set-row{margin:.8rem 0}
.set-row>.lbl{margin-bottom:.35rem}
.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surface));border:2px solid var(--warn);border-radius:1rem;padding:.8rem .9rem;margin:.6rem 0}
.warn b{display:block;margin-bottom:.25rem}
.warn ol{margin:.4rem 0 0;padding-left:1.2rem}
.catrow{display:flex;align-items:center;gap:.5rem;margin:.45rem 0}
.catrow input[type=color]{width:2.6rem;height:2.6rem;border:0;padding:0;background:none;border-radius:.7rem;flex:none}
.catrow .in{flex:1}
.mut{color:var(--muted)}
details{border-top:1px solid var(--line2);padding:.3rem 0}
details summary{font-weight:750;padding:.6rem 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"＋";color:var(--muted)}
details[open] summary:after{content:"－"}
details p,details li{font-size:.95rem}
details ul,details ol{padding-left:1.2rem;margin:.3rem 0}
.ver{margin:.6rem 0}.ver b{display:block}

/* search */
.sbox{position:sticky;top:0;background:var(--bg);padding:.7rem .7rem .4rem;z-index:5}
.sres{margin:.3rem .7rem 6rem;background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;overflow:hidden}
.sres:empty{display:none}
.sres .gh{padding:.4rem .85rem;background:var(--surface2);font-size:.78rem;font-weight:800;color:var(--muted);text-transform:capitalize}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:calc(100% - 2rem);max-width:26rem}
.tst{pointer-events:auto;background:#1b222c;color:#fff;padding:.7rem 1rem;border-radius:.95rem;box-shadow:var(--shadow);font-weight:650;font-size:.92rem;display:flex;gap:.8rem;align-items:center;animation:up .2s}
.tst button{color:#9db4ff;font-weight:800}
html[data-theme=dark] .tst{background:#eef1f5;color:#10151c}
html[data-theme=dark] .tst button{color:#2f5bea}
#printzone{display:none}
/* mise en page des impressions (écran = capture PDF, papier = @media print) */
.pz h1{font-size:20pt;margin:0 0 .5rem;font-weight:800}.pz h1 small{font-size:12pt;font-weight:600;color:#444;margin-left:.4rem}
.pz .pr-f{margin:.8rem 0 0;font-size:8pt;color:#555;text-align:right}
.pz .pr-d{break-inside:avoid;margin:0 0 .5rem}.pz .pr-d h2{font-size:12pt;margin:.4rem 0 .15rem;border-bottom:1.5px solid #000;padding-bottom:.1rem}
.pz .pr-e{margin:.2rem 0;color:#666}
.pz .pr-r{display:flex;gap:.5rem;align-items:flex-start;padding:.2rem 0;break-inside:avoid;border-bottom:1px solid #ddd}
.pz .pr-t{flex:0 0 3.4rem;font-size:10.5pt}.pz .pr-t small{display:block;font-weight:500;color:#444}
.pz .pr-b{flex:0 0 5px;align-self:stretch;border-radius:3px;background:var(--c)}
.pz .pr-x{flex:1;min-width:0}.pz .pr-x small{display:block;color:#333;font-size:9.5pt}.pz .pr-n{white-space:pre-line;color:#444}
.pz .mo2{display:flex;flex-direction:column;height:166mm;min-height:0}
.pz .mo2-h{position:static;padding:.2rem 0;border-bottom:1.5px solid #000;color:#000}
.pz .mw{flex:1 1 0;min-height:0;overflow:hidden;border-top:1px solid #8a8f98}
.pz .mcol{font-size:8pt!important}
.pz .mo2.big .mcol{font-size:10pt!important}.pz .mo2.big .mband{font-size:10.5pt}
.pz .mhid{font-size:8pt}
.pz .mband{border:1px solid rgba(0,0,0,.4)}
.pz .ml{background:#fff;border:1px solid #bbb;border-left:3px solid var(--c);color:#000}
.pz .mband,.pz .ml{font-size:8.5pt}.pz .mn{font-size:10pt}
.pz .bgc.sel,.pz .bgc.today{background:none;box-shadow:none}
.pzshot{position:absolute;left:-30000px;top:0;background:#fff;color:#000;box-sizing:border-box;padding:10mm;font-size:11pt;line-height:1.3;--bg:#fff;--surface:#fff;--surface2:#eef0f4;--text:#000;--muted:#444;--line:#8a8f98;--line2:#c9ccd2;--accent:#2f5bea;--on-accent:#fff;--accent-soft:rgba(47,91,234,.1)}
.pzshot.land{width:297mm;height:210mm}.pzshot.port{width:210mm;height:297mm}
@media print{
 html{font-size:17px!important}
 html,body{height:auto!important;background:#fff!important;color:#000!important;overflow:visible!important}
 #app,#sheet,#dlg,#toast{display:none!important}
 #printzone{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11pt;line-height:1.3;
  --bg:#fff;--surface:#fff;--surface2:#eef0f4;--text:#000;--muted:#444;--line:#8a8f98;--line2:#c9ccd2;--accent:#2f5bea;--on-accent:#fff;--accent-soft:rgba(47,91,234,.1);color:#000;background:#fff}
}

.icorow{display:flex;flex-direction:column;gap:.5rem}
.icoin{width:5rem;text-align:center;font-size:1.5rem;padding:.35rem}
.icos{gap:.35rem}
.chip.ico{padding:.3rem .5rem;font-size:1.3rem;min-width:2.6rem;justify-content:center}

.mo2.fort .mband{font-size:calc(.66rem*var(--bsc,1))}
.mo2.fort .mn{font-size:.9rem}
.mo2.fort .mn small{font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.mo2.fort .mn.today small{color:inherit}
@media(min-width:700px){.mo2.fort .mband{font-size:calc(.9rem*var(--bsc,1))}}
#tabs em{white-space:nowrap}
.mn{white-space:nowrap}
.mo2.fort .mn.today small{display:none}

/* choisir quoi envoyer */
.selbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.selrow{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;padding:.7rem .3rem;border-bottom:1px solid var(--line2)}
.selck{flex:0 0 1.7rem;height:1.7rem;border-radius:.45rem;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--on-accent)}
.selrow.on .selck{background:var(--accent);border-color:var(--accent)}
.selrow.on .selck:after{content:"✓"}
.selx{min-width:0}.selx b{display:block;overflow-wrap:anywhere}.selx small{display:block;color:var(--muted);overflow-wrap:anywhere}

.rotrow{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem 0;border-bottom:1px solid var(--line2)}
.rotrow small{display:block;color:var(--muted)}
.rstep{border:1.5px solid var(--line);border-radius:.9rem;padding:.7rem;margin:.5rem 0;display:flex;flex-direction:column;gap:.5rem}

#gearbtn.on{background:var(--accent-soft);color:var(--accent)}
#gearbtn .ic{width:1.5rem;height:1.5rem}
.stp{margin:.2rem 0 .8rem}.stp h4{margin:.6rem 0 .2rem;font-size:1.05rem}
.fiche{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.6rem 0}
.fiche button{border:1.5px solid var(--line);border-radius:1rem;padding:.5rem;background:var(--surface);display:flex;flex-direction:column;gap:.35rem;align-items:center;font-size:.95rem;color:var(--muted)}
.fiche img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:.6rem;background:var(--surface2)}
.fiche button.wide img{aspect-ratio:40/21}

.info.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.info.tap .maphint{display:block;font-size:.85rem;color:var(--accent);font-weight:600;margin-top:.15rem}
.ficheview{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:.7rem;background:var(--surface2);margin:.3rem 0}
.dlgbox a.btn{color:var(--text,inherit);display:flex;align-items:center;justify-content:center;text-decoration:none}

.sect{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.4rem .25rem .5rem;scroll-margin-top:.5rem}
.jump{display:flex;gap:.45rem;overflow-x:auto;padding:.1rem .25rem .2rem;margin:0 0 .2rem}
.jump .chip{flex:0 0 auto}
details.dev summary{cursor:pointer;padding:.1rem 0}
details.dev[open] summary{margin-bottom:.5rem}

/* ===== Adaptation à l'appareil : téléphone, tablette, ordinateur, grand écran ===== */
@media(min-width:1280px){:root{--dev:1.05}}
@media(min-width:1700px){:root{--dev:1.18}}
@media(min-width:2200px){:root{--dev:1.35}}
/* grande tablette / ordinateur : onglets en colonne à gauche */
@media(min-width:1000px) and (min-height:560px){
  #app{display:grid;grid-template-columns:5.4rem minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  #top{grid-column:2;grid-row:1}
  #banner{grid-column:2;grid-row:2}
  #body{grid-column:2;grid-row:3}
  #tabs{grid-column:1;grid-row:1/-1;flex-direction:column;justify-content:flex-start;gap:.25rem;border-top:0;border-right:1px solid var(--line);padding:.8rem .35rem}
  #tabs button{flex:none;padding:.75rem 0 .6rem;border-radius:.9rem}
  #tabs button.on{background:var(--accent-soft)}
  #tabs em{font-size:.74rem}
}
/* souris : survol */
@media(hover:hover) and (pointer:fine){
  .ib:hover,.pill:hover,#tabs button:hover{background:var(--surface2)}
  #tabs button.on:hover{background:var(--accent-soft)}
  .btn:hover{filter:brightness(.97)}
  .selrow:hover,.rowx:hover{background:var(--surface2)}
}
/* réglages sur 2 colonnes quand il y a la place */
@media(min-width:1000px){
  .sgrid{columns:2 22rem;column-gap:1.2rem;padding:0 .8rem}
  .sgrid .card{break-inside:avoid}
  .sgrid .sect,.sgrid .jump{column-span:all}
}
/* petits écrans en paysage : on gagne de la hauteur */
@media(max-height:480px) and (orientation:landscape){
  #top{padding-top:calc(env(safe-area-inset-top,0px) + .25rem);padding-bottom:.25rem}
  #tabs button{padding:.25rem 0 .2rem}#tabs em{display:none}
}

/* carte Outlook repliée */
details.msd summary{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:baseline}
details.msd .mut{font-size:.85rem}

/* bandeau étroit : titre sur plusieurs lignes */
.mband.wn{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--wl,2);overflow-wrap:break-word;word-break:normal;hyphens:auto;-webkit-hyphens:auto;line-height:1.25;padding-top:.06rem;padding-bottom:.06rem}

.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.2rem;max-height:40vh;overflow-y:auto;margin:.4rem 0}
.emo{font-size:1.6rem;line-height:1;padding:.35rem 0;border:0;background:transparent;border-radius:.5rem;cursor:pointer}
.emo:hover,.emo:active{background:var(--bg2,rgba(127,127,127,.2))}
.emcats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:.2rem}.emcats .chip{flex:none}
.catemo{font-size:1.2rem;padding:.2rem .5rem}

.olbox{max-height:50vh;overflow-y:auto}.olrow{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;font-size:.95rem}.olrow input{width:1.2rem;height:1.2rem}.olrow .dot{width:.8rem;height:.8rem;border-radius:50%;flex:none}

/* mode plein écran (œil) */
#focusbar{display:none}
body.focus #top,body.focus #tabs,body.focus #banner,body.focus #fab{display:none!important}
body.focus #app{display:flex;flex-direction:column}
body.focus #focusbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;position:fixed;z-index:30;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + .25rem) .6rem .25rem 1rem;pointer-events:none}
body.focus #focuslbl{font-weight:800;font-size:1.05rem;background:var(--surface);border-radius:999px;padding:.15rem .7rem;box-shadow:0 1px 6px rgba(0,0,0,.15);pointer-events:none;opacity:.92}
body.focus #focusbar .ib{pointer-events:auto;background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.2);border-radius:50%;opacity:.85}
body.focus #body{padding-top:calc(env(safe-area-inset-top,0px) + 3.1rem)}

.mband.wn{padding-left:.22rem;padding-right:.18rem;hyphenate-limit-chars:9 4 4;-webkit-hyphenate-limit-before:3;-webkit-hyphenate-limit-after:3}

.mband{align-self:start}
@media(max-width:699px){.mo2 .mband.wn{font-size:calc(.62rem*var(--bsc,1));padding-left:.15rem;padding-right:.1rem}}

/* Apparence */
.bgc.we:not(.today):not(.out),.tg-col.we:not(.today),.wd.we:not(.today),.mc.we:not(.today):not(.sel){background-color:var(--wec)}
.bgc.hol:not(.today):not(.out),.tg-col.hol:not(.today),.wd.hol:not(.today),.mc.hol:not(.today):not(.sel){background-color:var(--holc)}
.mn.hol:not(.today),.mc.hol .n,.dh.hol b,.wd.hol .wd-n{color:var(--danger)}
html.dst-big .mn{font-size:1rem}html.dst-big .mc .n{font-size:1.05rem}html.dst-big .dh b{font-size:1.5rem}html.dst-big .wd-n{font-size:1.9rem}
html.dst-circle .mn:not(.today){background:var(--surface2);border-radius:999px}
html.dst-circle .mc .n:not(.today){background:var(--surface2);border-radius:999px;padding:0 .35rem}
.lk-sw{display:flex;flex-wrap:wrap;gap:.5rem;margin:.35rem 0 .8rem}
.lk-c{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid var(--line);background:var(--c,var(--accent));display:grid;place-items:center;color:var(--muted);font-size:1rem;cursor:pointer;position:relative;padding:0}
.lk-c.on{outline:3px solid var(--accent);outline-offset:2px}
.lk-c.cust{background:var(--surface2);overflow:hidden}.lk-c.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.lk-prev{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:.4rem 0 .9rem}
.lk{display:flex;flex-direction:column;align-items:center;padding:.4rem 0;border-radius:10px;background:var(--surface);border:1px solid var(--line2)}
.lk small{font-size:.65rem;color:var(--muted);text-transform:uppercase}.lk .n{font-weight:800;font-size:1.1rem}
.lk.we{background-color:var(--wec,var(--surface))}.lk .n.hol{color:var(--danger)}.lk.today .n{color:var(--accent)}

/* Aide à l'adresse */
.adr{margin-top:.4rem}.adr small{display:block;margin-top:.35rem}
.adr-l{display:flex;flex-direction:column;gap:.25rem;border:1.5px solid var(--line);border-radius:.85rem;background:var(--surface);padding:.3rem}
.adr-l button{display:flex;gap:.55rem;align-items:flex-start;text-align:left;padding:.6rem .6rem;border-radius:.6rem;color:var(--text);font-weight:600;min-height:2.6rem}
.adr-l button:active,.adr-l button:hover{background:var(--accent-soft)}
.adr-l button svg{flex:none;margin-top:.15rem;color:var(--accent)}
.adr-on{display:inline-flex;gap:.4rem;align-items:center;color:var(--accent);font-weight:700;padding:.35rem .1rem}

/* Modèles et garde alternée */
.tpl-l{display:flex;flex-direction:column;gap:.4rem;margin:.5rem 0}
.tpl-i{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem .7rem;background:var(--surface)}
.dlgbox .gd{max-height:55vh;overflow:auto;margin:.2rem 0 .6rem;padding-right:.2rem}
.dlgbox .gd .g2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.gv{border:1.5px solid var(--line);border-radius:.8rem;padding:.6rem;margin:.5rem 0;background:var(--surface)}

/* Réglages compacts (1.16.3) */
.sgrid .card{padding:.7rem .8rem;margin:.45rem .7rem;border-radius:.9rem}
.sgrid .card h3{font-size:.95rem;margin:0 0 .35rem}
.sgrid .card p{margin:.3rem 0;font-size:.86rem}
.sgrid .btn{padding:.38rem .8rem;border-radius:.7rem;font-size:.86rem;font-weight:700;min-height:2.1rem}
.sgrid .btn.blk{display:inline-flex;width:auto;margin:.3rem .35rem 0 0}
.sgrid .btn .ic{width:1rem;height:1rem}
.sgrid .seg{padding:2px;border-radius:.7rem}
.sgrid .seg button{padding:.3rem .15rem;font-size:.8rem;border-radius:.55rem}
.sgrid .set-row{margin:.5rem 0}
.sgrid .set-row>.lbl,.sgrid .lbl{font-size:.7rem;margin-bottom:.22rem}
.sgrid .tgl-row{gap:.6rem;padding:.1rem 0}
.sgrid .tgl-row b{font-weight:650;font-size:.9rem}
.sgrid .tgl{width:2.6rem;height:1.55rem}
.sgrid .tgl:after{width:1.15rem;height:1.15rem;left:.2rem;top:.2rem}
.sgrid .tgl:has(input:checked):after{left:1.25rem}
.sgrid .in{min-height:2.2rem;padding:.3rem .6rem;border-radius:.65rem;font-size:.9rem}
.sgrid .catrow{gap:.4rem;margin:.25rem 0}
.sgrid .catrow input[type=color]{width:2rem;height:2rem;border-radius:.5rem}
.sgrid .chip{padding:.28rem .65rem;font-size:.8rem}
.sgrid .chip.ico{font-size:1.05rem;min-width:2rem;padding:.12rem .3rem}
.sgrid .lk-sw{gap:.4rem;margin:.25rem 0 .55rem}
.sgrid .lk-c{width:1.8rem;height:1.8rem}
.sgrid .lk-prev{margin:.3rem 0 .6rem}
.sgrid .lk{padding:.25rem 0}.sgrid .lk .n{font-size:1rem}
.sgrid .warn{font-size:.8rem;padding:.5rem .65rem}
.sgrid .tpl-i{padding:.35rem .55rem}
.sgrid .jump{gap:.3rem}

/* 1.16.4 sauvegarde en haut */
.sgrid #data-card .bk-more{margin-top:.5rem}
.sgrid #data-card .bk-more summary{cursor:pointer;color:var(--acc,#2563eb);font-weight:600;font-size:.88rem;padding:.3rem 0}
.sgrid #data-card .warn{margin-top:.3rem}

</style>
</head>
<body>
<div id="app">
  <div id="focusbar"><span id="focuslbl"></span><button class="ib" data-act="focus" aria-label="Revenir à l’affichage normal" data-ic="eyeoff"></button></div>
  <header id="top">
    <div class="ttl"><b id="t1"></b><small id="t2"></small></div>
    <div class="nav" id="nav">
      <button class="ib" data-act="prev" aria-label="Précédent" data-ic="left"></button>
      <button class="pill" data-act="today">Aujourd’hui</button>
      <button class="ib" data-act="next" aria-label="Suivant" data-ic="right"></button>
    </div>
    <button class="ib" data-act="focus" aria-label="Plein écran : masquer les boutons" data-ic="eye"></button>
    <button class="ib" data-act="print" aria-label="Imprimer" data-ic="print"></button>
    <button class="ib" data-act="help" aria-label="Mode d’emploi" data-ic="help"></button>
    <button class="ib" id="gearbtn" data-act="view" data-v="settings" aria-label="Réglages" data-ic="cog"></button>
  </header>
  <div id="banner"></div>
  <div id="body">
    <main id="main"></main>
    <aside id="side"></aside>
    <button id="fab" data-act="new" aria-label="Nouvel événement" data-ic="plus"></button>
  </div>
  <nav id="tabs">
    <button data-act="view" data-v="day"><span data-ic="day"></span><em>Jour</em></button>
    <button data-act="view" data-v="week"><span data-ic="week"></span><em>Semaine</em></button>
    <button data-act="view" data-v="month"><span data-ic="month"></span><em>Mois</em></button>
    <button data-act="view" data-v="fort"><span data-ic="fort"></span><em>2 sem.</em></button>
    <button data-act="view" data-v="search"><span data-ic="search"></span><em>Chercher</em></button>
  </nav>
</div>
<div id="sheet"></div>
<div id="dlg"></div>

const pad=n=>String(n).padStart(2,'0');

/* ---------- Dates (chaînes AAAA-MM-JJ, heure locale) ---------- */
const DL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const DS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const ML=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const WD=['SU','MO','TU','WE','TH','FR','SA'];
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const today=()=>ds(new Date());
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tmin=s=>{const a=s.split(':').map(Number);return a[0]*60+a[1]};
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const hm2=m=>m>=1440?'24:00':hm(m);
const dow=s=>pd(s).getDay();
const mondayOf=(s,ws)=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()-ws+7)%7));return ds(d)};
const addMonths=(s,n)=>{const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d)};
const fLong=s=>{const d=pd(s);return DL[d.getDay()]+' '+d.getDate()+' '+ML[d.getMonth()]};
const fLongY=s=>fLong(s)+' '+pd(s).getFullYear();
const fShort=s=>{const d=pd(s);return d.getDate()+' '+MS[d.getMonth()]};
const BASE='2000-01-01';
const stampOf=(d,t)=>diff(d,BASE)*1440+tmin(t);
const fromStamp=n=>{const days=Math.floor(n/1440);return{d:add(BASE,days),t:hm(n-days*1440)}};
function isoWeek(s){const d=pd(s);const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4,12);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function relDay(s){const n=diff(s,today());return n===0?'Aujourd’hui':n===1?'Demain':n===-1?'Hier':n>1?'Dans '+n+' jours':'Il y a '+(-n)+' jours'}

function matches(ev,d){

  case 'daily':return diff(d,ev.start)%n===0;
  case 'weekly':{
   const days=(r.days&&r.days.length)?r.days:[dow(ev.start)];
   if(!days.includes(dow(d)))return false;
   const w=Math.floor(diff(mondayOf(d,1),mondayOf(ev.start,1))/7);
   return w%n===0}
  case 'monthly':{
   const a=pd(ev.start),b=pd(d);const m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
   if(m<0||m%n)return false;
   const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
   return b.getDate()===Math.min(a.getDate(),last)}
  case 'yearly':{
   const a=pd(ev.start),b=pd(d);const y=b.getFullYear()-a.getFullYear();
   if(y<0||y%n||a.getMonth()!==b.getMonth())return false;
   const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
   return b.getDate()===Math.min(a.getDate(),last)}

}

  cur.push(it);cEnd=Math.max(cEnd,ee);

function gridHTML(days,hh,opts){

 const per=days.map(d=>segs(list,d));
 const anyAd=per.some(p=>p.ad.length);
 const t=today();
 let h='<div class="tg-wrap" id="tgw"><div class="tg'+(cols>1?' wk':'')+'" style="--cols:'+cols+';--hh:'+hh+'px;'+(opts.min?'--tgmin:'+opts.min+'px;':'')+'">';
 h+='<div class="tg-top">';
 if(cols>1){
  h+='<div class="tg-row"><div class="gut"></div>'+days.map(d=>'<button class="dh'+(d===t?' today':'')+dayCls(d)+'" title="'+esc(holName(d))+'" data-act="goday" data-date="'+d+'"><span>'+DS[dow(d)]+'</span><b>'+pd(d).getDate()+'</b></button>').join('')+'</div>';
 }
 if(anyAd){
  h+='<div class="tg-row"><div class="gut adlab">Journée</div>'+per.map(p=>'<div class="adc">'+p.ad.map(o=>'<button class="adchip" style="--c:'+catOf(o.ev.cat).color+'" data-act="open" data-o="'+reg(o)+'">'+evT(o.ev)+'</button>').join('')+'</div>').join('')+'</div>';
 }
 h+='</div>';
 h+='<div class="tg-body"><div class="tg-hours">'+Array.from({length:23},(_,i)=>'<span style="top:calc(var(--hh)*'+(i+1)+')">'+pad(i+1)+':00</span>').join('')+'</div>';
 days.forEach((d,i)=>{
  const items=layout(per[i].ts.map(x=>({o:x.o,s:x.s,e:x.e})));
  h+='<div class="tg-col'+(d===t?' today':'')+dayCls(d)+'" data-date="'+d+'">';
  for(const it of items){
   const o=it.o,ev=o.ev,dur=it.e-it.s,sm=dur<=50||(cols>1&&dur<=60);
   const top=it.s/1440*100,ht=Math.max(dur,20)/1440*100,w=100/it.cols,l=it.col*w;
   const tt=hm(it.s)+'–'+hm2(it.e);
   h+='<button class="ev'+(sm?' sm':'')+'" style="--c:'+catOf(ev.cat).color+';top:'+top+'%;height:'+ht+'%;left:calc('+l+'% + 2px);width:calc('+w+'% - 4px)" data-act="open" data-o="'+reg(o)+'"><b>'+evT(ev)+'</b>'+
    (sm?(cols===1?'<span class="tt">'+tt+'</span>':''):'<small>'+tt+'</small>'+(ev.place&&cols===1?'<small>'+esc(ev.place)+'</small>':''))+'</button>';
  }
  if(d===t)h+='<div class="nowline" style="top:'+(nowMin()/1440*100)+'%"></div>';
  h+='</div>';
 });
 h+='</div></div></div>';
 return{html:h,per};
}
function afterGrid(per,hh,days){
 const w=$('#tgw');if(!w)return;
 if(V.view+V.date+(isTablet()?'t':'p')+S.weekMode===lastKey)return;
 let focus=7*60;
 if(days.includes(today()))focus=Math.max(0,nowMin()-90);
 else{let m=1440;per.forEach(p=>p.ts.forEach(x=>{m=Math.min(m,x.s)}));if(m<1440)focus=Math.max(0,m-60)}
 w.scrollTop=focus/60*hh;
}

/* ---------- Vue mois ---------- */
function monthCells(cur){
 const first=cur.slice(0,8)+'01';
 const gs=mondayOf(first,S.weekStart);
 const dim=new Date(pd(first).getFullYear(),pd(first).getMonth()+1,0).getDate();
 const lead=(pd(first).getDay()-S.weekStart+7)%7;
 const rows=Math.ceil((lead+dim)/7);

function weekHead(){return Array.from({length:7},(_,i)=>(S.weekStart+i)%7)}
function monthViewDots(){

 let h='<div class="mo"><div class="mo-h">'+weekHead().map(d=>'<span>'+DS[d].replace('.','')+'</span>').join('')+'</div><div class="mo-g">';

 }

function inkOn(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)>150?'#10151c':'#ffffff'}
function monthView(){return S.monthMode==='dots'?monthViewDots():monthViewTitles()}
function fortStart(){if(!V.fs||V.date<V.fs||V.date>add(V.fs,13))V.fs=mondayOf(V.date,S.weekStart);return V.fs}
function monthViewTitles(fort,pr){
 const wk=fort==='wk';fort=!!fort;
 const mc=wk?{gs:mondayOf(V.date,S.weekStart),rows:1,month:null}:fort?{gs:fortStart(),rows:2,month:null}:monthCells(V.date);const {gs,rows,month}=mc;
 const end=add(gs,rows*7-1);const list=occs(gs,end);const t=today();
 const fs=parseFloat(getComputedStyle(document.documentElement).fontSize)||17;
 const mainH=pr?0:($('#main').clientHeight||600);
 const rowH=pr?627/rows:Math.max(fs*5,(mainH-fs*2.2)/rows);
 const tab=isTablet();
 const big=pr&&rows<=2;
 const bandH=pr?(big?20:17):fs*(fort?(tab?0.9:0.82):(tab?0.8:0.68))*1.46+1;
 const tFs=fort?(tab?0.86:0.76):(tab?0.74:0.62);
 const tlH=pr?(big?20:17):fs*tFs*1.25+1;
 const avail=pr?rowH-26:rowH-fs*1.55;
 let h='<div class="mo2'+(fort?' fort':'')+(pr?' pr':'')+(big?' big':'')+'" style="--rows:'+rows+'"><div class="mo2-h"><span></span>'+weekHead().map(d=>'<span>'+DS[d].replace('.','')+'</span>').join('')+'</div>';
 for(let w=0;w<rows;w++){
  const ws=add(gs,w*7),we=add(ws,6);
  const wk=isoWeek(add(ws,S.weekStart===1?3:4));
  const bands=[],timed=Array.from({length:7},()=>[]);
  for(const o of list){
   if(o.endDate<ws||o.date>we)continue;
   if(o.allDay||o.dur>0)bands.push({o,c0:Math.max(0,diff(o.date,ws)),c1:Math.min(6,diff(o.endDate,ws))});
   else{const c=diff(o.date,ws);if(c>=0&&c<=6)timed[c].push(o)}
  }
  bands.sort((a,b)=>a.o.ev.id<b.o.ev.id?-1:a.o.ev.id>b.o.ev.id?1:a.c0-b.c0);
  for(let i=bands.length-1;i>0;i--){const p=bands[i-1],q=bands[i];if(p.o.ev.id===q.o.ev.id&&p.o.allDay&&q.o.allDay&&q.c0===p.c1+1){p.c1=q.c1;p.o=Object.assign({},p.o,{endDate:q.o.endDate});bands.splice(i,1)}}
  bands.sort((a,b)=>a.c0-b.c0||(b.c1-b.c0)-(a.c1-a.c0)||a.o.ev.title.localeCompare(b.o.ev.title));
  const lanes=[];
  bands.forEach(b=>{let i=0;while(lanes[i]!==undefined&&lanes[i]>=b.c0)i++;lanes[i]=b.c1;b.lane=i});
  const anyT=timed.some(a=>a.length);
  /* bandeaux d'une seule colonne (étroits) : le titre passe sur 2-3 lignes au lieu d'être coupé */
  const cw=pr?(big?96:70):(((($('#main')||{}).clientWidth)||390)-fs*1.5)/7;
  const bfs0=pr?(big?14:11):fs*(fort?(tab?0.82:0.66):(tab?0.8:0.7));
  /* essais : d'abord taille normale, puis bandeaux compacts ; les bandeaux (multi-jours) passent avant les petits événements */
  const trySearch=(sc,resv)=>{
   const bfs=bfs0*sc,bandHs=bandH*sc;
   const cpl=Math.max(4,Math.floor((cw-bfs*0.6)/(bfs*0.66)));
   const budget=avail-(anyT?tlH*resv:0);
   let best=null;
   for(const [withIcon,cap] of (fort&&!pr?[[true,6],[true,5],[true,4],[true,3],[true,2],[false,4],[false,3],[false,2]]:[[true,3],[true,2],[false,2],[false,1]])){
    const lh=lanes.map(()=>1);
    const nis=[];
    const wls=bands.map((b,k)=>{
     nis[k]=false;
     if(b.c0!==b.c1)return 1;
     const tl=Array.from(b.o.ev.title).length;
     if(withIcon&&b.o.ev.icon&&tl>cpl*(cap-1))nis[k]=true;
     const n=tl+(withIcon&&b.o.ev.icon&&!nis[k]?2:0);
     const w=n>cpl?Math.min(cap,Math.ceil(n/cpl)):1;
     if(w>lh[b.lane])lh[b.lane]=w;return w;
    });
    let vis_=0,used_=0;
    const hh=l=>l>1?l*bfs*1.25+bfs*0.3+2:bandHs;
    while(vis_<lanes.length&&(vis_===0||used_+hh(lh[vis_])<=budget)){used_+=hh(lh[vis_]);vis_++}
    if(!best||vis_>best.vis)best={vis:vis_,used:used_,wls,nis,noIcon:!withIcon,sc};
    if(vis_===lanes.length)break;
   }
   return best;
  };
  let best=null;
  const scales=pr?[1]:[1,0.88,0.78];
  outer:for(const sc of scales){
   for(const resv of (anyT?[2,1,0]:[0])){
    const r=trySearch(sc,resv);
    if(!best||r.vis>best.vis)best=r;
    if(r.vis===lanes.length){best=r;break outer}
   }
  }
  bands.forEach((b,k)=>{b.wl=best.wls[k];b.ni=best.nis[k]});
  const vis=best.vis,used=best.used;
  const hid=Array(7).fill(0);
  const room=Math.max(0,avail-used);
  let fg='';
  for(let c=0;c<7;c++){
   const d=add(ws,c);
   fg+='<b class="mn'+(d===t?' today':'')+dayCls(d)+(month!==null&&pd(d).getMonth()!==month?' out':'')+'" style="grid-row:1;grid-column:'+(c+2)+'">'+(fort&&(pd(d).getDate()===1||(w===0&&c===0))?'<small>'+MS[pd(d).getMonth()]+'</small> ':'')+pd(d).getDate()+'</b>';
  }
  bands.forEach(b=>{
   if(b.lane>=vis){for(let c=b.c0;c<=b.c1;c++)hid[c]++;return}
   const o=b.o,col=catOf(o.ev.cat).color;
   fg+='<i class="mband'+(b.wl>1?' wn':'')+(o.date<ws?' cl':'')+(o.endDate>we?' cr':'')+'" data-date="'+o.date+'" style="grid-row:'+(2+b.lane)+';grid-column:'+(b.c0+2)+' / '+(b.c1+3)+';--c:'+col+';--ink:'+inkOn(col)+(best.sc<1?';--bsc:'+best.sc:'')+(b.wl>1?';--wl:'+b.wl:'')+'">'+((best.noIcon||b.ni)&&b.c0===b.c1?esc(o.ev.title):evT(o.ev))+'</i>';
  });
  timed.forEach((arr,c)=>{
   if(!arr.length)return;
   arr.sort((x,y)=>x.s-y.s);
   const L=Math.max(0,Math.floor(room/tlH));let ln=1;
   for(const t3 of [3,2]){if(arr.length*t3<=L){ln=t3;break}}
   if(pr)ln=Math.max(1,Math.min(6,Math.floor(L/arr.length)));
   const shown=Math.min(arr.length,Math.max(0,Math.floor(L/ln)));
   hid[c]+=arr.length-shown;
   if(!shown)return;
   fg+='<div class="mcol'+(ln===1&&!tab&&!fort&&!pr?' l1':'')+'" style="grid-row:'+(2+vis)+';grid-column:'+(c+2)+';--ln:'+ln+';font-size:'+tFs+'rem">'+arr.slice(0,shown).map(o=>'<i class="ml" data-date="'+o.date+'" style="--c:'+catOf(o.ev.cat).color+'">'+((tab||pr)?'<em>'+hm(o.s)+'</em> ':'')+(o.ev.icon?'<span class="ei">'+esc(o.ev.icon)+' </span>':'')+esc(o.ev.title)+'</i>').join('')+'</div>';
  });
  hid.forEach((n,c)=>{if(n>0)fg+='<span class="mhid" style="grid-row:1;grid-column:'+(c+2)+'">+'+n+'</span>'});
  let bg='<span class="wn">'+wk+'</span>';
  for(let c=0;c<7;c++){
   const d=add(ws,c);
   bg+='<button class="bgc'+(d===t?' today':'')+dayCls(d)+(month!==null&&pd(d).getMonth()!==month?' out':'')+'" data-act="selday" data-date="'+d+'" aria-label="'+fLong(d)+'"></button>';
  }
  h+='<div class="mw"><div class="mw-bg">'+bg+'</div><div class="mw-fg">'+fg+'</div></div>';
 }
 return{html:h+'</div>',fixed:false,after:()=>{if(pr)return;const m=$('#main').clientHeight;if(Math.abs(m-mainH)>4&&!V.re){V.re=1;try{render()}finally{V.re=0}}}};
}

/* ---------- Recherche ---------- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let SQ='';
function searchResults(q){
 q=norm(q).trim();if(!q)return '';
 const from=add(today(),-365),to=add(today(),730);
 const res=[];
 for(const ev of EV){
  if(!norm(ev.title+' '+ev.place+' '+ev.note).includes(q))continue;
  occsOf(ev,from,to).forEach(o=>res.push(o));
 }
 res.sort((a,b)=>a.date.localeCompare(b.date)||a.s-b.s);
 if(!res.length)return '<p class="empty">Aucun résultat.</p>';
 let h='',last='';
 res.slice(0,300).forEach(o=>{
  if(o.date!==last){last=o.date;h+='<div class="gh">'+fLongY(o.date)+' · '+relDay(o.date)+'</div>'}
  h+=rowHTML(o,o.date);
 });
 if(res.length>300)h+='<p class="empty">Seuls les 300 premiers résultats sont affichés.</p>';
 return h;
}
function searchView(){
 return{html:'<div class="sbox"><input id="q" class="in big" type="search" placeholder="Titre, lieu ou note…" value="'+esc(SQ)+'" autocomplete="off" enterkeyhint="search"></div><div class="sres" id="sres">'+searchResults(SQ)+'</div>',fixed:false,
  after:()=>{if(!SQ&&!/Mobi|Android|iPhone/.test(navigator.userAgent)){const q=$('#q');q&&q.focus()}}};
}

/* ---------- Bandeaux ---------- */
function bannerHTML(){
 let h='';
 if(demo)h+='<div class="bn demo"><span><b>Mode démo</b> · rien n’est enregistré</span><button data-act="exitdemo">Quitter la démo</button></div>';
 else if(EV.length&&V.view!=='settings'&&Date.now()>META.snooze){
  const never=!META.lastBackup;
  const days=never?0:Math.floor((Date.now()-META.lastBackup)/864e5);
  if(never||(META.dirtySince&&days>=7)){
   h+='<div class="bn"><span>💾 <b>'+(never?'Aucune sauvegarde faite.':'Dernière sauvegarde il y a '+days+' jours.')+'</b> Les appareils ne se synchronisent pas tout seuls.</span><button data-act="gobackup">Sauvegarder</button><button data-act="snooze">Plus tard</button></div>';
  }
 }
 return h;
}

/* ---------- Rendu principal ---------- */
function render(){

 const main=$('#main'),body=$('#body');
 const key=V.view+V.date+(isTablet()?'t':'p')+S.weekMode;
 const prevMain=main.scrollTop,tg=$('#tgw');
 const prevTg=tg?{t:tg.scrollTop,l:tg.scrollLeft}:null;
 let r;
 switch(V.view){
  case 'day':r=dayView();break;
  case 'week':r=weekView();break;
  case 'month':r=monthView();break;

  case 'search':r=searchView();break;
  default:r=settingsView();
 }
 main.innerHTML=r.html;main.classList.toggle('fixed',!!r.fixed);
 const same=key===lastKey;

  main.scrollTop=prevMain;

 }else if(!r.fixed)main.scrollTop=0;
 lastKey=key;
 const [t1,t2]=titles();$('#t1').textContent=t1;$('#t2').textContent=t2;{const fl=$('#focuslbl');if(fl)fl.textContent=t1+(t2?' · '+t2:'')}

 body.classList.toggle('nofab',!nav&&V.view!=='search');
 body.classList.toggle('mview',V.view==='fort'||(V.view==='month'&&S.monthMode!=='dots'));

 $('#banner').innerHTML=bannerHTML();

function go(view){V.view=view;render()}
function shift(n){
 if(V.view==='fort'){V.fs=add(fortStart(),14*n);V.date=add(V.date,14*n)}
 else if(V.view==='day')V.date=add(V.date,n);

 else if(V.view==='month')V.date=addMonths(V.date,n);
 render();

/* ---------- Connexion Outlook / Microsoft (envoi dans un sens : appli -> Outlook) ---------- */
/* Connexion officielle Microsoft (OAuth, code + PKCE), sans serveur : l'appli parle directement
   à Microsoft avec TON compte. Aucune donnée ne passe par un autre intermédiaire. */
const MS_CLIENT_ID='661cb213-42fd-400c-b81a-34a07b5c4046';                       /* identifiant public de l'application Microsoft (pas un secret) */
const MS_AUTH='https://login.microsoftonline.com/consumers/oauth2/v2.0';
const MS_SCOPE='Calendars.ReadWrite MailboxSettings.Read User.Read offline_access';
const MS_CAL_NAME='Agenda (appli)';
const GRAPH='https://graph.microsoft.com/v1.0';
const MS_PROP='String {4f1d8a3e-7b21-4c6e-9d11-0a6a2f5c7e01} Name AgendamKey';
let MSA=Object.assign({token:null,exp:0,refresh:null,calId:null,map:{},acct:'',last:0,err:'',n:0},ls.get(K.ms,{}));
const msSave=()=>ls.set(K.ms,MSA);
const msClientId=()=>String(S.msClientId||MS_CLIENT_ID||'').trim();
const msConnected=()=>!!MSA.refresh;
const msRedirect=()=>location.origin+location.pathname.replace(/index\.html$/,'');
let msBusy=false,msTimer=null;

const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const msRand=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));

async function msConnect(){
 const cid=msClientId();
 if(!cid){toast('Identifiant d’application Microsoft manquant');return}
 if(!window.crypto||!crypto.subtle){toast('Connexion impossible sur cet appareil (navigateur trop ancien)');return}
 const verifier=msRand(48),state=msRand(16);
 const challenge=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 ls.set(P+'msauth',{verifier,state,t:Date.now()});
 const p=new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:msRedirect(),response_mode:'query',scope:MS_SCOPE,state,code_challenge:challenge,code_challenge_method:'S256',prompt:'select_account'});
 location.href=MS_AUTH+'/authorize?'+p;
}
async function msTokenReq(params){
 const r=await fetch(MS_AUTH+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.access_token)throw Object.assign(new Error(j.error_description||j.error||'Erreur de connexion'),{code:j.error});
 MSA.token=j.access_token;MSA.exp=Date.now()+(j.expires_in||3600)*1000;
 if(j.refresh_token)MSA.refresh=j.refresh_token;
 MSA.err='';msSave();
}
/* Retour de la page de connexion Microsoft (?code=…&state=…) */
async function msHandleReturn(){
 const q=new URLSearchParams(location.search);
 if(!q.has('code')&&!q.has('error'))return false;
 const au=ls.get(P+'msauth',null);
 if(!au||q.get('state')!==au.state)return false;
 const clean=()=>{ls.del(P+'msauth');try{history.replaceState(null,'',msRedirect())}catch(e){}};
 if(q.has('error')){clean();toast('Connexion Outlook annulée');return true}
 try{
  await msTokenReq({client_id:msClientId(),grant_type:'authorization_code',code:q.get('code'),redirect_uri:msRedirect(),code_verifier:au.verifier,scope:MS_SCOPE});
  clean();
  try{const me=await msFetch('/me?$select=mail,userPrincipalName');MSA.acct=me.mail||me.userPrincipalName||'';msSave()}catch(e){}
  V.view='settings';render();
  toast('Outlook connecté. Touche « Envoyer maintenant ».',6000);
 }catch(e){clean();toast('Connexion Outlook impossible : '+e.message,6000)}
 return true;
}
async function msAccessToken(force){
 if(!force&&MSA.token&&MSA.exp>Date.now()+60000)return MSA.token;
 if(!MSA.refresh)throw new Error('Non connecté');
 try{await msTokenReq({client_id:msClientId(),grant_type:'refresh_token',refresh_token:MSA.refresh})}
 catch(e){
  if(e.code==='invalid_grant'||e.code==='interaction_required'){MSA.token=null;MSA.refresh=null;MSA.err='Reconnexion nécessaire';msSave()}
  throw e;
 }
 return MSA.token;
}
async function msFetch(path,opt){
 opt=opt||{};
 for(let k=0;k<2;k++){
  const t=await msAccessToken(k>0);
  const r=await fetch(path.startsWith('http')?path:GRAPH+path,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+t},opt.headers||{})}));
  if(r.status===401&&k===0)continue;
  if(r.status===204)return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error((j.error&&j.error.message)||('Erreur '+r.status)),{status:r.status});
  return j;
 }
}
async function msEnsureCal(){
 if(MSA.calId){
  try{await msFetch('/me/calendars/'+MSA.calId+'?$select=id');return MSA.calId}catch(e){if(e.status!==404)throw e;MSA.calId=null;MSA.map={}}
 }
 const l=await msFetch('/me/calendars?$select=id,name&$top=100');
 const f=(l.value||[]).find(c=>c.name===MS_CAL_NAME);
 if(f)MSA.calId=f.id;
 else{const c=await msFetch('/me/calendars',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:MS_CAL_NAME})});MSA.calId=c.id}
 msSave();return MSA.calId;
}
const hash32=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h>>>0)};
const msUTC=(d,m)=>{const [y,mo,da]=d.split('-').map(Number);return new Date(y,mo-1,da,0,m,0).toISOString().slice(0,19)};
function msPayload(o){
 const ev=o.ev;
 let start,end;
 if(o.allDay){start=add(o.date,0)+'T00:00:00';end=add(o.endDate,1)+'T00:00:00'}
 else{start=msUTC(o.date,o.s);end=msUTC(o.endDate,o.e)}
 const p={subject:(ev.icon?ev.icon+' ':'')+ev.title,isAllDay:!!o.allDay,
  start:{dateTime:start,timeZone:'UTC'},end:{dateTime:end,timeZone:'UTC'},
  location:{displayName:ev.place||''},body:{contentType:'text',content:ev.note||''},showAs:'busy'};
 if(ev.ocat)p.categories=[ev.ocat];else p.categories=[];
 if(ev.alarm!=null){p.isReminderOn=true;p.reminderMinutesBeforeStart=o.allDay?(ev.alarm>=1440?900:0):ev.alarm}
 else p.isReminderOn=false;
 return p;
}
async function msBatch(reqs){
 for(let tries=0;;tries++){
  const j=await msFetch('/$batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests:reqs})});
  const res=j.responses||[];
  const th=res.find(r=>r.status===429||r.status===503);
  if(th&&tries<2){const w=Math.min(20,(+((th.headers||{})['Retry-After']||'3')))*1000;await new Promise(r=>setTimeout(r,w));continue}
  return res;
 }
}
async function msSync(silent){
 if(demo){if(!silent)toast('Quitte d’abord le mode démo');return}
 if(!msConnected()){if(!silent)toast('Outlook n’est pas connecté');return}
 if(msBusy)return;
 msBusy=true;if(!silent){toast('Envoi vers Outlook…',4000);}
 let add_=0,upd=0,del=0,err=0;
 try{
  const cal=await msEnsureCal();
  const from=add(today(),-31),to=add(today(),366);
  const want={};
  for(const o of occs(from,to)){if(o.ev.src==='ol')continue;const p=msPayload(o);p.singleValueExtendedProperties=[{id:MS_PROP,value:o.ev.id+'|'+o.date}];want[o.ev.id+'|'+o.date]={cal:o.ev.ocal||cal,p,h:hash32(JSON.stringify(p.categories&&p.categories.length?p:Object.assign({},p,{categories:undefined})))}}
  const reqs=[];
  /* anti-doublons : si cet appareil ne connaît pas encore un événement, on regarde d'abord ce que les autres appareils ont déjà envoyé */
  const need=Object.keys(want).filter(k=>!MSA.map[k]);
  if(need.length){
   try{
    const found=await olFindOurs([...new Set(need.map(k=>want[k].cal))]);
    for(const k of need){
     const l=found.get(k);
     if(l&&l.length){MSA.map[k]={id:l[0].id,h:'',cal:l[0].cal};for(const x of l.slice(1))reqs.push({k,kind:'xdel',method:'DELETE',url:'/me/events/'+x.id})}
    }
   }catch(e){}
  }
  for(const k in want){
   const m=MSA.map[k];
   if(!m)reqs.push({k,kind:'add',method:'POST',url:'/me/calendars/'+want[k].cal+'/events',body:want[k].p,h:want[k].h,cal:want[k].cal});
   else if((m.cal||cal)!==want[k].cal){reqs.push({k,kind:'mvdel',method:'DELETE',url:'/me/events/'+m.id});reqs.push({k,kind:'add',method:'POST',url:'/me/calendars/'+want[k].cal+'/events',body:want[k].p,h:want[k].h,cal:want[k].cal})}
   else if(m.h!==want[k].h)reqs.push({k,kind:'upd',method:'PATCH',url:'/me/events/'+m.id,body:want[k].p,h:want[k].h,id:m.id});
  }
  for(const k in MSA.map)if(!want[k])reqs.push({k,kind:'del',method:'DELETE',url:'/me/events/'+MSA.map[k].id});
  for(let i=0;i<reqs.length;i+=20){
   const ch=reqs.slice(i,i+20);
   const res=await msBatch(ch.map((r,j)=>({id:String(j),method:r.method,url:r.url,headers:r.body?{'Content-Type':'application/json'}:undefined,body:r.body})));
   ch.forEach((r,j)=>{
    const x=res.find(z=>z.id===String(j))||{status:0};
    const ok=x.status>=200&&x.status<300;
    if(r.kind==='mvdel'||r.kind==='xdel'){}
    else if(r.kind==='add'){if(ok&&x.body&&x.body.id){MSA.map[r.k]={id:x.body.id,h:r.h,cal:r.cal};add_++}else err++}
    else if(r.kind==='upd'){if(ok){MSA.map[r.k].h=r.h;upd++}else if(x.status===404){delete MSA.map[r.k];err++}else err++}
    else{if(ok||x.status===404){delete MSA.map[r.k];del++}else err++}
   });
   msSave();
   if(!silent&&reqs.length>20)toast('Envoi vers Outlook… '+Math.min(i+20,reqs.length)+'/'+reqs.length,4000);
  }
  MSA.last=Date.now();MSA.err=err?(err+' élément(s) non envoyés'):'';msSave();
  if(!silent)toast(reqs.length?('Outlook à jour : '+add_+' ajouté'+(add_>1?'s':'')+', '+upd+' modifié'+(upd>1?'s':'')+', '+del+' supprimé'+(del>1?'s':'')+(err?' · '+err+' erreur(s)':'')):'Outlook déjà à jour',5000);
 }catch(e){
  MSA.err=e.message||'Erreur';msSave();
  if(!silent)toast('Envoi Outlook impossible : '+MSA.err,6000);
 }finally{msBusy=false;if(V.view==='settings')render()}
}

/* Catégories Outlook (liste du compte + celles déjà vues sur les événements) */
const OL_STD=['Catégorie rouge','Catégorie orange','Catégorie jaune','Catégorie verte','Catégorie bleue','Catégorie violette'];
function olCatList(){
 const set=new Set((MSA.cats||[]).map(c=>c.name));
 for(const e of EV)if(e.ocat)set.add(e.ocat);
 for(const n of olAppCats())if(![...set].some(x=>norm(x).trim()===norm(n).trim()))set.add(n);
 if(!set.size)OL_STD.forEach(n=>set.add(n));
 const hid=new Set(S.olHide||[]);
 return [...set].filter(n=>!hid.has('c:'+n));
}
/* catégories perso de l'appli (souvent venues d'Outlook à l'import) : proposées aussi comme catégories Outlook */
function olAppCats(){const std=new Set(DEF_CATS.map(c=>c.id));return S.cats.filter(c=>!std.has(c.id)&&c.id!=='-').map(c=>c.name)}
async function olCatsRefresh(){
 if(!msConnected()||demo)return false;
 let got=false;
 try{const c=await msFetch('/me/calendars?$select=id,name,canEdit&$top=100');MSA.cals=(c.value||[]).filter(x=>x.canEdit!==false).map(x=>({id:x.id,name:String(x.name||'').slice(0,80)}));msSave()}catch(e){}
 try{const j=await msFetch('/me/outlook/masterCategories');MSA.cats=(j.value||[]).map(c=>({name:String(c.displayName||'').slice(0,60),color:c.color||''})).filter(c=>c.name);MSA.catsFull=true;msSave();return true}
 catch(e){}
 /* repli (autorisation pas encore donnée) : catégories déjà utilisées sur tes événements Outlook */
 try{
  const seen=new Set();let url='/me/events?$select=categories&$top=500',n=0;
  while(url&&n<4){const j=await msFetch(url);for(const x of (j.value||[]))for(const c of (x.categories||[]))seen.add(String(c).slice(0,60));url=j['@odata.nextLink']||null;n++}
  if(seen.size){const old=new Map((MSA.cats||[]).map(c=>[c.name,c]));MSA.cats=[...seen].sort((a,b)=>a.localeCompare(b)).map(nm=>old.get(nm)||{name:nm,color:''});MSA.catsFull=false;msSave();return true}
 }catch(e){}
 return false;
}

/* événements envoyés par l'appli (marqués d'une clé), par calendrier */
async function olFindOurs(calIds){
 const out=new Map();
 for(const c of calIds){
  let url='/me/calendars/'+c+'/events?$select=id&$top=200&$expand='+encodeURIComponent("singleValueExtendedProperties($filter=id eq '"+MS_PROP+"')"),n=0;
  while(url&&n<25){
   const j=await msFetch(url);n++;
   for(const x of (j.value||[])){const p=(x.singleValueExtendedProperties||[])[0];if(!p||!p.value)continue;if(!out.has(p.value))out.set(p.value,[]);out.get(p.value).push({id:x.id,cal:c})}
   url=j['@odata.nextLink']||null;
  }
 }
 return out;
}
/* Nettoie les doublons du calendrier « Agenda (appli) » (créés avant la protection anti-doublons) */
async function olDedupe(){
 if(demo){toast('Quitte d’abord le mode démo');return}
 if(!msConnected()){toast('Connecte d’abord Outlook');return}
 if(msBusy)return;
 msBusy=true;toast('Recherche des doublons dans Outlook…',4000);
 try{
  const cal=await msEnsureCal();
  const groups=new Map();let url='/me/calendars/'+cal+'/events?$select=id,subject,start,end,isAllDay&$top=200&$expand='+encodeURIComponent("singleValueExtendedProperties($filter=id eq '"+MS_PROP+"')"),n=0,tot=0;
  while(url&&n<40){
   const j=await msFetch(url,{headers:{Prefer:'outlook.timezone="UTC"'}});n++;
   for(const x of (j.value||[])){tot++;const k=[x.subject,x.start&&x.start.dateTime,x.end&&x.end.dateTime,x.isAllDay].join('|');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}
   url=j['@odata.nextLink']||null;
  }
  const mapped=new Set(Object.values(MSA.map).map(m=>m.id));
  const del=[];
  for(const arr of groups.values()){
   if(arr.length<2)continue;
   arr.sort((a,b)=>(mapped.has(b.id)?2:0)+((b.singleValueExtendedProperties||[]).length?1:0)-((mapped.has(a.id)?2:0)+((a.singleValueExtendedProperties||[]).length?1:0)));
   del.push(...arr.slice(1).map(x=>x.id));
  }
  msBusy=false;
  if(!del.length){toast('Aucun doublon trouvé dans « '+MS_CAL_NAME+' » ('+tot+' événements vérifiés)',5000);return}
  const r=await ask({title:'Supprimer les doublons ?',text:del.length+' doublon'+(del.length>1?'s':'')+' trouvé'+(del.length>1?'s':'')+' dans le calendrier Outlook « '+MS_CAL_NAME+' » (même titre, même date, même heure). Un exemplaire de chaque est conservé. Les autres calendriers ne sont pas touchés ; les suppressions vont dans « Éléments supprimés » d’Outlook.',btns:[{label:'Supprimer les doublons',value:'y',cls:'pri'},{label:'Annuler',value:null}]});
  if(r!=='y')return;
  msBusy=true;let ok=0;
  for(let i=0;i<del.length;i+=20){
   const res=await msBatch(del.slice(i,i+20).map((id,j)=>({id:String(j),method:'DELETE',url:'/me/events/'+id})));
   ok+=res.filter(z=>(z.status>=200&&z.status<300)||z.status===404).length;
  }
  toast(ok+' doublon'+(ok>1?'s':'')+' supprimé'+(ok>1?'s':''),5000);
 }catch(e){toast('Nettoyage impossible : '+(e.message||'erreur'),6000)}
 finally{msBusy=false}
}

function loadH2C(){

}
function pdfFromJpeg(jpg,w,h,land){
 const enc=s=>new TextEncoder().encode(s),W=land?841.89:595.28,H=land?595.28:841.89;
 const parts=[],off=[];let len=0;
 const put=u=>{parts.push(u);len+=u.length};
 const obj=(n,body)=>{off[n]=len;put(enc(n+' 0 obj\n'));put(typeof body==='string'?enc(body):body);put(enc('\nendobj\n'))};
 put(enc('%PDF-1.4\n'));
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
 const cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
 obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
 off[5]=len;put(enc('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n'));put(jpg);put(enc('\nendstream\nendobj\n'));
 const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
 for(let n=1;n<=5;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
 put(enc(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF'));
 const out=new Uint8Array(len);let p=0;for(const u of parts){out.set(u,p);p+=u.length}
 return out;
}
async function printPDF(html,land,name){
 toast('Préparation du PDF…',5000);
 let shot;
 const fs0=document.documentElement.style.fontSize;
 try{
  await loadH2C();
  shot=document.createElement('div');shot.className='pz pzshot '+(land?'land':'port');shot.innerHTML=html;document.body.appendChild(shot);
  document.documentElement.style.fontSize='17px';
  await new Promise(r=>setTimeout(r,150));
  const cv=await html2canvas(shot,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:false});
  const b64=cv.toDataURL('image/jpeg',0.92).split(',')[1];
  const bin=atob(b64),jpg=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
  const pdf=pdfFromJpeg(jpg,cv.width,cv.height,land);
  const file=new File([pdf],name,{type:'application/pdf'});
  const r=await ask({title:'Impression prête',text:'Le PDF d’une page A4 est prêt. Touche le bouton, puis choisis « Imprimer » (ou Mail, Enregistrer dans Fichiers…).',btns:[{label:'Imprimer / Partager le PDF',value:'s',cls:'pri'},{label:'Annuler',value:null}]});
  if(r!=='s')return;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);
 }catch(e){toast('Impression impossible ici : '+(e&&e.message?e.message:'erreur'),6000)}
 finally{document.documentElement.style.fontSize=fs0;if(shot)shot.remove()}
}

function rotGenerate(r){
 const out=[],d0=pd(r.start),dEnd=new Date(d0);dEnd.setMonth(dEnd.getMonth()+r.months);
 const end=ds(dEnd);let si=0,left=r.steps[0].days,day=r.start,block=null;
 const flush=()=>{if(block){out.push(block);block=null}};
 const mk=(s,a,b,t1,t2,all)=>cleanEvent({id:uid(),title:s.lab,icon:s.icon||'',allDay:all,start:a,end:b,startTime:t1,endTime:t2,place:'',note:'Rotation : '+r.name,cat:r.cat,grp:r.id,rec:null,ex:[],alarm:null});
 while(day<end){
  const s=r.steps[si];
  if(s.work||r.showRest){
   if(s.work&&!s.allDay){flush();const night=tmin(s.et)<=tmin(s.st);out.push(mk(s,day,night?add(day,1):day,s.st,s.et,false))}
   else if(block&&block.title===s.lab&&block.end===add(day,-1)&&block._si===si)block.end=day;
   else{flush();block=mk(s,day,day,'09:00','10:00',true);block._si=si}
  }else flush();
  if(--left<=0){si=(si+1)%r.steps.length;left=r.steps[si].days;flush()}
  day=add(day,1);
 }
 flush();
 out.forEach(e=>{delete e._si});
 return out.filter(Boolean);
}

const xlDay=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const xlOk=(y,m,d)=>m>=1&&m<=12&&d>=1&&d<=31&&y>=1990&&y<=2100;
function xlTime(v){
 if(typeof v==='number'){
  if(v<0)return null;
  if(v<1)return Math.min(1439,Math.floor(v*1440+.5));
  if(v>=20000)return Math.min(1439,Math.floor((v-Math.floor(v))*1440+.5));
  return Number.isInteger(v)&&v<=24?(v%24)*60:null;
 }
 const s=String(v==null?'':v).trim().toLowerCase();if(!s)return null;
 const m=s.match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?(?:\s*:\s*\d{2})?\s*(am|pm)?/);
 if(!m)return null;
 let h=+m[1];const mi=+(m[2]||0);
 if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;
 if(h>24||mi>59)return null;return (h%24)*60+mi;
}
/* retourne {d:'AAAA-MM-JJ', t:minutes|null, n:numéro de jour Excel} */
function xlDate(v,us){
 if(typeof v==='number'){
  if(v<20000||v>80000)return null;
  const day=Math.floor(v),dt=new Date(XL_EPOCH+day*864e5);
  const t=Math.min(1439,Math.floor((v-day)*1440+.5));
  return{d:xlDay(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()),t:(v-day)>0.0005?t:null,n:day};
 }
 const s=String(v==null?'':v).trim();if(!s)return null;
 let m,y,mo,da;
 if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+m[1];mo=+m[2];da=+m[3]}
 else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let a=+m[1],b=+m[2];y=+m[3];if(y<100)y+=2000;if(us){mo=a;da=b}else{da=a;mo=b}}
 else return null;
 if(!xlOk(y,mo,da))return null;
 const rest=s.slice(m[0].length);const t=/\d/.test(rest)?xlTime(rest):null;
 return{d:xlDay(y,mo,da),t,n:Math.round((Date.UTC(y,mo-1,da)-XL_EPOCH)/864e5)};
}

 if(v===''||v==null)return null;

  if(v>=20000&&v<80000)return Math.max(0,Math.round(start.n*1440+(allDay?540:start.t)-v*1440));

}

  if(byName.has(n)){e.cat=byName.get(n);continue}

  if(create){
   let id=slug(e._cat),k=2;while(S.cats.some(c=>c.id===id))id=slug(e._cat)+'-'+k++;
   S.cats.push({id,name:e._cat.slice(0,30),color:((typeof MSA!=='undefined'&&(MSA.cats||[]).find(c=>norm(c.name).trim()===n)||{}).color&&OL_COL[(MSA.cats.find(c=>norm(c.name).trim()===n)||{}).color])||CAT_COL[(S.cats.length)%CAT_COL.length]});
   byName.set(n,id);e.cat=id;made++;
  }else e.cat=S.cats.some(c=>c.id==='autre')?'autre':S.cats[S.cats.length-1].id;
 }
 if(made)saveSet();
 return made;
}
async function readSheetFile(file){

 let wb;
 if(/\.(csv|tsv|txt)$/i.test(file.name)){
  const buf=await file.arrayBuffer();let txt;
  try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
  wb=XLSX.read(txt.replace(/^﻿/,''),{type:'string',raw:true});
 }else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
 let best=null;
 for(const n of wb.SheetNames){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!best||rows.length>best.rows.length)best={name:n,rows};
 }
 return best;
}

function pickImport(o){
 return new Promise(res=>{
  const items=o.items.slice().sort((a,b)=>a.e.start.localeCompare(b.e.start)||a.e.startTime.localeCompare(b.e.startTime));
  const on=new Set(items.map((_,i)=>i));let q='';
  const root=$('#sheet');
  const vis=()=>items.map((it,i)=>({it,i})).filter(x=>!q||norm(x.it.e.title+' '+x.it.e.place+' '+(x.it.e._cat||'')).includes(q));
  const row=x=>{const e=x.it.e;
   return '<button type="button" class="selrow'+(on.has(x.i)?' on':'')+'" data-pk="t" data-i="'+x.i+'"><span class="selck"></span><span class="selx"><b>'+evT(e)+(x.it.upd?' <span class="mut" style="font-weight:700;font-size:.78rem">· mis à jour</span>':'')+'</b><small>'+fShort(e.start)+(e.end!==e.start?' → '+fShort(e.end):'')+' · '+(e.allDay?'Journée':e.startTime+'–'+e.endTime)+(e.place?' · '+esc(e.place):'')+(e._cat?' · '+esc(e._cat):'')+'</small></span></button>'};
  const bits=()=>{
   const n=items.filter((_,i)=>on.has(i)).length;
   const b=$('#pk-ok');if(b){b.textContent='Importer ('+n+')';b.disabled=!n}
   const c=$('#pk-cnt');if(c)c.textContent=items.length+' événement'+(items.length>1?'s':'')+' · '+n+' coché'+(n>1?'s':'');
  };
  const draw=()=>{const l=$('#pk-list');if(l){const v=vis();l.innerHTML=v.length?v.map(row).join(''):'<p class="empty">Aucun événement avec cette recherche.</p>'}bits()};
  openSheet('<div class="sh-h"><b style="font-size:1.2rem;color:var(--text)">'+esc(o.title)+'</b><span class="sp1"></span><button class="x" data-pk="x" aria-label="Fermer">'+ic('x')+'</button></div>'+
   '<p class="mut" style="margin:0 0 .3rem">'+esc(o.intro||'')+'</p>'+
   '<div class="fld" style="margin:.4rem 0"><input class="in" id="pk-q" type="search" placeholder="Chercher dans la liste…" autocomplete="off"></div>'+
   '<div class="selbar"><span id="pk-cnt" class="mut"></span><span><button class="btn sm" data-pk="all">Tout cocher</button> <button class="btn sm" data-pk="none">Tout décocher</button></span></div>'+
   '<div id="pk-list"></div>'+
   '<div class="sticky-save"><button class="btn grow" data-pk="x">Annuler</button><button class="btn pri grow" id="pk-ok" data-pk="ok">Importer</button></div>','full');
  const cleanup=()=>{root.removeEventListener('click',h);root.removeEventListener('input',inp);mo.disconnect()};
  const h=e=>{
   const t=e.target.closest('[data-pk]');if(!t)return;const k=t.dataset.pk;
   if(k==='t'){const i=+t.dataset.i;if(on.has(i))on.delete(i);else on.add(i);t.classList.toggle('on',on.has(i));bits()}
   else if(k==='all'){vis().forEach(x=>on.add(x.i));draw()}
   else if(k==='none'){vis().forEach(x=>on.delete(x.i));draw()}
   else if(k==='x'){cleanup();closeSheet();res(null)}
   else if(k==='ok'){const out=items.filter((_,i)=>on.has(i));cleanup();closeSheet();res(out)}
  };
  const inp=e=>{if(e.target.id==='pk-q'){q=norm(e.target.value).trim();draw()}};
  const mo=new MutationObserver(()=>{if(!root.firstChild){cleanup();res(null)}});
  root.addEventListener('click',h);root.addEventListener('input',inp);mo.observe(root,{childList:true});
  draw();
 });

const htmlText=h=>{try{const d=new DOMParser().parseFromString(h,'text/html');return (d.body.textContent||'').replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim()}catch(e){return ''}};
function msConv(x,calName){
 if(x.isCancelled)return null;
 const allDay=!!x.isAllDay;
 let start,end,sm=540,em=600;
 const L=s=>new Date(String(s).replace(/\.\d+$/,'')+'Z');
 if(allDay){start=x.start.dateTime.slice(0,10);end=add(x.end.dateTime.slice(0,10),-1);if(end<start)end=start}
 else{const a=L(x.start.dateTime),b=L(x.end.dateTime);start=ds(a);end=ds(b);sm=a.getHours()*60+a.getMinutes();em=b.getHours()*60+b.getMinutes()}
 const body=x.body&&x.body.content?(x.body.contentType==='html'?htmlText(x.body.content):String(x.body.content).trim()):'';
 const ev={id:'ol-'+hash32(x.id),title:String(x.subject||'Sans titre').trim(),allDay,start,end,startTime:hm(sm),endTime:hm(em),place:(x.location&&x.location.displayName)||'',note:body,cat:'',icon:'',rec:null,ex:[],alarm:(!allDay&&x.isReminderOn&&x.reminderMinutesBeforeStart>=0)?x.reminderMinutesBeforeStart:null,src:'ol',ocat:String((x.categories&&x.categories[0])||'').slice(0,60),_cat:(x.categories&&x.categories[0])||calName};
 return ev;
}
