const olDiff=(a,b)=>['title','allDay','start','end','startTime','endTime','place','note','alarm','ocat'].some(k=>(a[k]==null?'':a[k])!==(b[k]==null?'':b[k]));
/* Regroupe les jours identiques (même titre, catégorie, lieu, notes…) en un seul événement sur plusieurs jours */
function mergeDays(list){
 const key=e=>[norm(e.title),e.icon||'',e.place||'',e.note||'',e._cat||e.cat||'',e.ocat||'',e.alarm==null?'':e.alarm,e.src||''].join('|');
 const g=new Map(),out=[];
 for(const e of list){
  if(!e.allDay||e.rec){out.push(e);continue}
  const k=key(e);if(!g.has(k))g.set(k,[]);g.get(k).push(e);
 }
 for(const arr of g.values()){
  arr.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
  let cur=null;
  for(const e of arr){
   if(cur&&e.start<=add(cur.end,1)){if(e.end>cur.end)cur.end=e.end;cur.mids.push(e.id,...(e.mids||[]))}
   else{cur=Object.assign({},e,{mids:[e.id].concat(e.mids||[])});out.push(cur)}
  }
 }
 for(const e of out)if(e.mids){e.mids=[...new Set(e.mids)];if(e.mids.length<2)delete e.mids}
 return out;
}
function mergeLocal(){
 const isImp=e=>/^(ol|xl)-/.test(e.id)&&e.allDay&&!e.rec;
 const a=EV.filter(isImp);if(a.length<2)return 0;
 const m=mergeDays(a);const n=a.length-m.length;if(n<=0)return 0;
 const rest=EV.filter(e=>!isImp(e));
 EV.length=0;EV.push(...rest,...m.map(cleanEvent).filter(Boolean));
 touch();render();return n;
}
async function olPull(calList,per,catFlag,silent){
 mergeLocal();await olCatsRefresh();
 const back={m1:31,m3:92,now:0,y1:366}[per]||31;
 const from=add(today(),-back),to=add(today(),366);
 let all=[];let n=0;
 try{
  for(const c of calList){
   if(!silent)toast('Lecture de « '+c.name+' »…',4000);
   let url='/me/calendars/'+c.id+'/calendarView?startDateTime='+encodeURIComponent(from+'T00:00:00Z')+'&endDateTime='+encodeURIComponent(to+'T00:00:00Z')+'&$top=200&$select=id,subject,start,end,isAllDay,location,body,categories,isReminderOn,reminderMinutesBeforeStart,isCancelled';
   while(url&&n<3000){
    const j=await msFetch(url,{headers:{Prefer:'outlook.timezone="UTC"'}});
    for(const x of (j.value||[])){const e=msConv(x,c.name);if(e){all.push(e);n++}}
    url=j['@odata.nextLink']||null;
   }
  }
 }catch(e){if(!silent)toast('Lecture Outlook impossible : '+e.message,6000);return}
 if(!all.length){if(!silent)toast('Aucun événement trouvé sur cette période');return}
 all=mergeDays(all);
 const byId=new Map(EV.map(e=>[e.id,e])),keys=new Set(EV.map(evKey)),seen=new Set();
 for(const l of EV)if(l.mids)for(const m of l.mids)if(!byId.has(m))byId.set(m,l);
 const fresh=[],upd=[];let dup=0;
 for(const e of all){
  if(seen.has(e.id))continue;seen.add(e.id);
  {const l=byId.get(e.id)||(e.mids||[]).map(m=>byId.get(m)).find(Boolean);if(l)e.id=l.id}
  if(byId.has(e.id)){if(olDiff(byId.get(e.id),e))upd.push(e)}
  else if(keys.has(evKey(e)))dup++;
  else fresh.push(e);
 }
 if(!fresh.length&&!upd.length){if(!silent)toast('Déjà à jour : rien de nouveau dans Outlook'+(dup?' ('+dup+' déjà présent'+(dup>1?'s':'')+')':''),5000);return}
 let F=fresh,U=upd;
 if(!silent){
  const pk=await pickImport({title:'Importer depuis Outlook',intro:(dup?dup+' déjà présent'+(dup>1?'s':'')+' (ignoré'+(dup>1?'s':'')+'). ':'')+'Décoche ce que tu ne veux pas. Ce qui a été supprimé dans Outlook n’est pas supprimé ici.',items:fresh.map(e=>({e,upd:false})).concat(upd.map(e=>({e,upd:true})))});
  if(!pk||!pk.length)return;
  F=pk.filter(x=>!x.upd).map(x=>x.e);U=pk.filter(x=>x.upd).map(x=>x.e);
 }
 const made=resolveCats(F.concat(U),catFlag);
 for(const e of U)Object.assign(byId.get(e.id),{title:e.title,allDay:e.allDay,start:e.start,end:e.end,startTime:e.startTime,endTime:e.endTime,place:e.place,note:e.note,alarm:e.alarm,ocat:e.ocat||'',mids:e.mids});
 EV.push(...F.map(e=>{const x=Object.assign({},e);delete x._cat;return cleanEvent(x)}).filter(Boolean));
 touch();render();
 toast((silent?'Outlook : ':'')+F.length+' ajouté'+(F.length>1?'s':'')+(U.length?' · '+U.length+' mis à jour':'')+(made?' · '+made+' catégorie'+(made>1?'s':'')+' créée'+(made>1?'s':''):''),5000);
}

function emoRecent(){
 /* récents (dernier utilisé d'abord) puis les plus utilisés dans l'agenda */
 const cnt={};for(const e of EV)if(e.icon)cnt[e.icon]=(cnt[e.icon]||0)+1;
 const used=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
 const seen=new Set(),out=[];
 for(const e of [...(S.emRecent||[]),...used]){if(!seen.has(e)){seen.add(e);out.push(e)}}
 return out.slice(0,40);
}
function emoRemember(e){
 if(!e)return;
 S.emRecent=[e,...(S.emRecent||[]).filter(x=>x!==e)].slice(0,24);saveSet();
}
/* Ouvre le sélecteur. Résultat : l'emoji choisi, 'none' (retirer), ou null (annulé). */
function pickEmoji(cur){
 return new Promise(res=>{
  const root=$('#dlg');
  const cats=['Récents',...EMO_CATS.map(c=>c[0])];
  const st={cat:emoRecent().length?'Récents':'Visages',q:''};
  const list=()=>{
   if(st.q){const q=norm(st.q).trim();return EMO_INDEX.filter(x=>x.k.includes(q)).map(x=>x.e).filter((e,i,a)=>a.indexOf(e)===i)}
   if(st.cat==='Récents')return emoRecent();
   return EMO_INDEX.filter(x=>x.c===st.cat).map(x=>x.e);
  };
  const grid=()=>{
   const l=list();
   return l.length?l.map(e=>'<button type="button" class="emo" data-em="'+esc(e)+'" aria-label="'+esc(e)+'">'+esc(e)+'</button>').join(''):'<p class="mut" style="grid-column:1/-1;margin:.6rem 0">'+(st.q?'Aucun emoji pour « '+esc(st.q)+' ». Tu peux aussi taper ton emoji directement dans le champ de l’événement.':'Rien ici pour le moment : les emojis que tu utilises apparaîtront ici.')+'</p>';
  };
  const draw=()=>{
   const g=$('#em-grid');if(g){g.innerHTML=grid();g.scrollTop=0}
   $$('#em-cats .chip').forEach(c=>c.classList.toggle('on',!st.q&&c.dataset.cat===st.cat));
  };
  const p=ask({title:'Choisir un emoji',html:
   '<input class="in" id="em-q" type="search" placeholder="Chercher : dentiste, gâteau, avion…" autocomplete="off" style="margin:.2rem 0 .5rem">'+
   '<div class="chips emcats" id="em-cats">'+cats.map(c=>'<button type="button" class="chip" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'+
   '<div id="em-grid" class="emgrid"></div>'+(cur?'<p class="mut" style="margin:.3rem 0 .1rem;font-size:.85rem">Actuel : <span style="font-size:1.3rem">'+esc(cur)+'</span></p>':''),
   btns:[{label:cur?'Aucun emoji (retirer)':'Fermer',value:cur?'none':null},{label:'Annuler',value:null}]});
  let chosen=null;
  const h=e=>{
   const b=e.target.closest('[data-em]');
   if(b){chosen=b.dataset.em;cleanup();const x=root.querySelector('[data-v="1"]');if(x)x.click();return}
   const c=e.target.closest('[data-cat]');
   if(c){st.cat=c.dataset.cat;st.q='';const q=$('#em-q');if(q)q.value='';draw()}
  };
  const inp=e=>{if(e.target.id==='em-q'){st.q=e.target.value;draw()}};
  const cleanup=()=>{root.removeEventListener('click',h);root.removeEventListener('input',inp)};
  root.addEventListener('click',h);root.addEventListener('input',inp);
  draw();
  p.then(v=>{cleanup();res(chosen!=null?chosen:v)});
 });
}

const lkRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');const n=parseInt(h,16);return isNaN(n)||h.length!==6?[0,0,0]:[n>>16&255,n>>8&255,n&255]};
const lkHex=r=>'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lkMix=(a,b,t)=>{const x=lkRgb(a),y=lkRgb(b);return lkHex(x.map((v,i)=>v*(1-t)+y[i]*t))};

const HOL_CACHE={};
function holidaysOf(y){
 if(HOL_CACHE[y])return HOL_CACHE[y];
 const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
 const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
 const easter=new Date(y,mo-1,da);const P=n=>ds(new Date(y,mo-1,da+n));
 const o={};const fx=(mm,dd,n)=>{o[y+'-'+pad(mm)+'-'+pad(dd)]=n};
 fx(1,1,'Jour de l’an');fx(5,1,'Fête du Travail');fx(5,8,'Victoire 1945');fx(7,14,'Fête nationale');fx(8,15,'Assomption');fx(11,1,'Toussaint');fx(11,11,'Armistice');fx(12,25,'Noël');
 o[P(0)]='Pâques';o[P(1)]='Lundi de Pâques';o[P(39)]='Ascension';o[P(49)]='Pentecôte';o[P(50)]='Lundi de Pentecôte';
 return HOL_CACHE[y]=o;
}

function ask(o){
 return new Promise(res=>{
  const root=$('#dlg');
  const btns=o.btns||[];
  root.innerHTML='<div class="ov dlgov"><div class="sh dlgbox" role="dialog" aria-modal="true"><h2 style="font-size:1.25rem">'+esc(o.title||'')+'</h2>'+(o.html?o.html:'<p style="margin:.3rem 0 .6rem">'+esc(o.text||'')+'</p>')+
   btns.map((b,i)=>'<button class="btn blk '+(b.cls||'')+'" data-v="'+i+'">'+esc(b.label)+'</button>').join('')+'</div></div>';
  const done=v=>{root.innerHTML='';root.onclick=null;res(v)};
  root.onclick=e=>{
   const b=e.target.closest('[data-v]');
   if(b){e.stopPropagation();done(btns[+b.dataset.v].value)}
   else if(e.target.classList.contains('ov')){e.stopPropagation();done(null)}
  };
 });
}

  if(r!=='y')return;
  EV=EV.filter(e=>e.id!==ev.id);
 }else{
  const r=await ask({title:'Supprimer un événement répété',text:'« '+ev.title+' » — '+fLong(CUR.date)+'.',btns:[
   {label:'Cette occurrence seulement',value:'one'},{label:'Celle-ci et les suivantes',value:'next'},{label:'Toute la série',value:'all',cls:'dng'},{label:'Annuler',value:null}]});

async function saveEditor(){

 if(!RX_D.test(b.start)||!RX_D.test(b.end)){toast('Date invalide');return}
 if(b.end<b.start){toast('La fin est avant le début');return}
 if(!b.allDay&&stampOf(b.end,b.endTime)<=stampOf(b.start,b.startTime)){toast('L’heure de fin doit être après le début');return}
 const ev0=ED.id?findEv(ED.id):null;
 let target=b.start,saved=null;
 const wantPhone=!!($('#f-phone')&&$('#f-phone').checked);
 if(!ev0){saved=cleanEvent(Object.assign({id:uid()},b));EV.push(saved)}
 else if(!ev0.rec){Object.assign(ev0,cleanEvent(Object.assign({},b,{id:ev0.id,grp:ev0.grp})));saved=ev0}
 else{
  const r=await ask({title:'Modifier un événement répété',text:'Appliquer les changements à :',btns:[{label:'Cette occurrence seulement',value:'one'},{label:'Toute la série',value:'all',cls:'pri'},{label:'Annuler',value:null}]});
  if(!r)return;
  if(r==='one'){
   if(!ev0.ex.includes(ED.occ))ev0.ex.push(ED.occ);
   saved=cleanEvent(Object.assign({},b,{id:uid(),rec:null,ex:[]}));EV.push(saved);
  }else{
   const shiftD=diff(b.start,ED.occ),ns=add(ev0.start,shiftD),dur=diff(b.end,b.start);
   const ex=ev0.ex.slice();
   Object.assign(ev0,cleanEvent(Object.assign({},b,{id:ev0.id,start:ns,end:add(ns,dur),ex})));
   target=ED.occ?add(ED.occ,shiftD):b.start;saved=ev0;
  }
 }
 S.lastCat=b.cat;S.askPhone=wantPhone;saveSet();touch();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 closeSheet();V.date=target;render();toast('Événement enregistré');

function onEditorChange(e){
 const id=e.target.id;if(!ED)return;
 const g=x=>$('#'+x);
 if(id==='f-allday'){
  const a=e.target.checked;
  $$('.timeonly').forEach(el=>el.classList.toggle('hide',a));
  const cur=g('f-alarm').value;g('f-alarm').innerHTML=alarmOpts(a,cur===''?null:+cur);
  return;
 }
 if(id==='f-rec'){recUI();return}
 if(id==='f-um'){g('f-until').classList.toggle('hide',e.target.value!=='until');return}
 if(['f-sd','f-st','f-ed','f-et'].includes(id)){
  const sn=ED.snap;const a=g('f-allday').checked;
  if(id==='f-sd'||id==='f-st'){
   const oldS=stampOf(sn.sd,a?'00:00':sn.st),oldE=stampOf(sn.ed,a?'00:00':sn.et),dur=oldE-oldS;
   const nsd=g('f-sd').value;if(!RX_D.test(nsd))return;
   const ns=stampOf(nsd,a?'00:00':(g('f-st').value||'09:00'));
   const fe=fromStamp(ns+dur);
   g('f-ed').value=fe.d;if(!a)g('f-et').value=fe.t;
  }else{
   const a2=a;
   if(RX_D.test(g('f-sd').value)&&RX_D.test(g('f-ed').value)){
    const s=stampOf(g('f-sd').value,a2?'00:00':(g('f-st').value||'09:00')),en=stampOf(g('f-ed').value,a2?'00:00':(g('f-et').value||'10:00'));

   }
  }
  ED.snap={sd:g('f-sd').value,st:g('f-st').value||'09:00',ed:g('f-ed').value,et:g('f-et').value||'10:00'};
 }
}

 const seg=(k,opts,val)=>'<div class="seg">'+opts.map(o=>'<button data-act="set" data-k="'+k+'" data-v="'+o[0]+'" class="'+(String(val)===String(o[0])?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
 const perm=('Notification' in window)?Notification.permission:'indisponible';
 let h='';
 h+=settingsJump();
 h+='<div class="card" id="data-card"><h3>💾 Sauvegarde</h3>'+
  '<p class="mut" style="margin:.1rem 0 .2rem">'+(META.lastBackup?'Dernière sauvegarde : <b>'+fmtDate(META.lastBackup)+'</b>':'<b>Aucune sauvegarde pour le moment.</b>')+'</p>'+
  '<button class="btn pri blk" data-act="bk-save">'+ic('down')+' Sauvegarder</button>'+
  '<button class="btn blk" data-act="bk-restore">'+ic('up')+' Restaurer</button>'+
  '<details class="bk-more"><summary>Comment ça marche ?</summary><div class="warn"><b>Les appareils ne se synchronisent pas tout seuls.</b>Pour retrouver ton agenda sur un autre téléphone : <b>Sauvegarder</b> ici, envoie le fichier « '+BACKUP_FILE+' » (mail, AirDrop, messagerie, cloud…), puis <b>Restaurer</b> sur l’autre appareil.'+(canShareFiles()?'<br><br><b>Sur iPhone</b> : choisis « Enregistrer dans Fichiers » puis ton dossier (iCloud Drive…). Le téléphone te reproposera le même dossier ensuite.':'')+'</div></details></div>';
 h+=sec('s-aff','Affichage et couleurs');
 h+='<div class="card"><h3>Affichage</h3>'+
  '<div class="set-row"><span class="lbl">Écran au démarrage</span>'+seg('start',[['day','Aujourd’hui'],['week','Semaine'],['month','Mois'],['fort','2 sem.']],S.start)+'</div>'+
  '<div class="set-row"><span class="lbl">Thème</span>'+seg('theme',[['auto','Auto'],['light','Clair'],['dark','Sombre']],S.theme)+'</div>'+
  '<div class="set-row"><span class="lbl">Taille du texte</span>'+seg('scale',[[1,'Normal'],[1.15,'Grand'],[1.3,'Très grand']],S.scale)+'</div>'+
  '<div class="set-row"><span class="lbl">Premier jour de la semaine</span>'+seg('weekStart',[[1,'Lundi'],[0,'Dimanche']],S.weekStart)+'</div>'+
  '<div class="set-row"><span class="lbl">Semaine sur téléphone</span>'+seg('weekMode',[['auto','Auto'],['list','Liste'],['grid','Grille']],S.weekMode)+'</div>'+
  '<div class="set-row"><span class="lbl">Vue mois</span>'+seg('monthMode',[['titles','Titres'],['dots','Points + liste']],S.monthMode)+'</div></div>';
 h+=lookCard(seg);
 h+=sec('s-agenda','Mon agenda');
 h+='<div class="card"><h3>Catégories</h3>'+S.cats.map((c,i)=>'<div class="catrow"><input type="color" value="'+c.color+'" data-cat="'+i+'" data-field="color" aria-label="Couleur"><input class="in" value="'+esc(c.name)+'" data-cat="'+i+'" data-field="name" maxlength="30" aria-label="Nom"><button type="button" class="chip ico catemo" data-act="catemo" data-i="'+i+'" title="Emoji par défaut de la catégorie" aria-label="Emoji par défaut">'+(c.icon?esc(c.icon):'🙂')+'</button><button class="x" data-act="delcat" data-i="'+i+'" aria-label="Supprimer la catégorie">'+ic('trash')+'</button></div>').join('')+
  '<button class="btn blk" data-act="addcat">'+ic('plus')+' Ajouter une catégorie</button></div>';
 h+=tplCard();
 h+=rotCard();
 h+=sec('s-cal','Calendrier du téléphone et autres calendriers')+phoneCard();
 h+=msCard();
 h+=importCard();
h+='<div class="card" id="ics-card">'+
'<h3>Fichier calendrier (.ics)</h3><p class="mut" style="margin-top:0">Pour échanger avec Google Agenda, Apple Calendrier, Outlook… Les rappels sont inclus.</p>'+
  '<button class="btn blk" data-act="ics-export">'+ic('down')+' Exporter tout (.ics)</button>'+
  '<button class="btn blk" data-act="ics-import">'+ic('up')+' Importer un fichier .ics</button></div>';
 h+=sec('s-rap','Rappels et adresse');
 h+='<div class="card"><h3>Rappels</h3>'+
  '<div class="tgl-row"><b>Afficher « À venir aujourd’hui » à l’ouverture</b><label class="tgl"><input type="checkbox" data-chg="remind"'+(S.remind?' checked':'')+'></label></div>'+
  '<div class="set-row"><label class="lbl" for="s-alarm">Rappel par défaut des nouveaux événements</label><select class="in" id="s-alarm" data-chg="defAlarm">'+alarmOpts(false,S.defAlarm)+'</select></div>'+
  '<div class="set-row"><span class="lbl">Notifications système</span>'+
  (perm==='granted'?'<p><b>Activées.</b> <span class="mut">Elles ne sonnent que si l’appli est ouverte ou récemment utilisée en arrière-plan.</span></p>'
   :perm==='denied'?'<p class="mut">Refusées dans les réglages du navigateur ou du téléphone. Il faut les réautoriser là-bas.</p>'
   :perm==='indisponible'?'<p class="mut">Non disponibles sur ce navigateur.</p>'
   :'<button class="btn blk" data-act="notif">'+ic('bell')+' Activer les notifications</button>')+
  '<div class="warn"><b>À savoir (honnêtement)</b>Sans serveur, une appli web ne peut pas réveiller le téléphone à une heure précise quand elle est fermée. Sur <b>iPhone</b>, les notifications n’existent que si l’appli est ajoutée à l’écran d’accueil (iOS 16.4 minimum) et n’arrivent qu’appli ouverte ou récente. Sur <b>Android</b>, c’est un peu mieux mais pas garanti. Pour des alarmes fiables, exporte tes événements en .ics et ouvre-les dans l’agenda natif du téléphone : les rappels y sont inclus.</div></div></div>';
 h+='<div class="card"><h3>Aide à l’adresse</h3><div class="tgl-row"><b>Proposer des adresses (France)</b><label class="tgl"><input type="checkbox" data-chg="adrAide"'+(S.adrAide?' checked':'')+'></label></div><p class="mut" style="margin:.3rem 0 0">Si activé, ce que tu tapes dans « Lieu » est envoyé au service public api-adresse.data.gouv.fr (Base Adresse Nationale : gratuit, sans pub, sans compte). Désactivé, l’appli ne contacte personne.</p></div>';
 h+=sec('s-aide','Aide et partage')+guideCard()+installCard()+ficheCard();
 h+='<div class="card"><h3>Démo et aide</h3>'+
  (demo?'<button class="btn blk" data-act="exitdemo">Quitter le mode démo</button>':'<button class="btn blk" data-act="demo">Voir le mode démo (données d’exemple)</button>')+
  '<button class="btn blk" data-act="help">'+ic('help')+' Mode d’emploi et historique</button>'+
  (installEv?'<button class="btn pri blk" data-act="install">Installer l’appli sur cet appareil</button>':'')+'</div>';
 h+='<div class="card"><h3>À propos</h3><p><b>AgenDam</b> · version '+APP_VERSION+'</p><p class="mut">Gratuit, sans publicité. Aucune donnée collectée : tout reste sur cet appareil.</p>'+
  '<button class="btn dng blk" data-act="wipe">'+ic('trash')+' Effacer toutes mes données</button></div>';
 h+=devCard()+'<div style="height:2rem"></div>';
 return{html:'<div class="sgrid">'+h+'</div>',fixed:false};
}

/* ---------- Aide ---------- */
function openHelp(hist){
 const d=(t,body,open)=>'<details'+(open?' open':'')+'><summary>'+t+'</summary>'+body+'</details>';
 let h='<div class="sh-h"><b style="font-size:1.2rem;color:var(--text)">Mode d’emploi</b><span class="sp1"></span><button class="x" data-act="close" aria-label="Fermer">'+ic('x')+'</button></div>';
 h+=d('Démarrer','<ul><li><b>Jour, Semaine, Mois, 2 sem., Chercher</b> : onglets en bas. <b>Réglages</b> : l’icône d’engrenage en haut à droite. Les flèches et « Aujourd’hui » en haut changent de période. Tu peux aussi glisser le doigt à gauche ou à droite.</li><li><b>+</b> (bouton rond) crée un événement. Dans la vue Jour, touche aussi un créneau vide pour en créer un à cette heure.</li><li>Touche un événement pour voir le détail, le modifier, le dupliquer, l’exporter ou le supprimer.</li><li>Dans le mois, touche un jour pour voir sa liste, touche « Ouvrir la journée » pour le détail heure par heure.</li></ul>',true);
 h+=d('Créer un événement','<ul><li><b>Titre, catégorie (couleur), lieu, note.</b> Les catégories se modifient dans Réglages.</li><li><b>Début et fin</b> : n’importe quelle durée, même sur plusieurs jours. Les boutons 30 min / 1 h / 2 h… règlent la fin d’un geste.</li><li><b>Journée entière</b> : pour un anniversaire, un congé, un voyage.</li><li><b>Rappel</b> : voir la section « Rappels ».</li></ul>');
 h+=d('Répétitions et rotations','<ul><li>Tous les jours, semaines (avec choix des jours), mois, ans, avec un intervalle (ex. toutes les 2 semaines) et une date de fin facultative.</li><li><b>Rotation travail / repos</b> : indique le nombre de jours travaillés puis de repos (ex. 3 puis 2). Le cycle part de la date de début et se répète. Pratique pour des horaires en rotation.</li><li>Modifier ou supprimer un événement répété : tu choisis « cette occurrence », « celle-ci et les suivantes » ou « toute la série ».</li></ul>');
 h+=d('Rappels et notifications','<ul><li><b>À l’ouverture</b> : un écran « À venir aujourd’hui » liste ce qu’il reste à faire dans la journée (désactivable dans Réglages).</li><li><b>Notifications</b> : elles s’affichent quand l’appli est ouverte ou récemment active. <b>Quand l’appli est fermée, aucun rappel ne sonne</b> : une appli web sans serveur ne peut pas le garantir, surtout sur iPhone (notifications possibles seulement depuis l’écran d’accueil, iOS 16.4 minimum).</li><li><b>Solution fiable</b> : exporte en .ics et ouvre le fichier avec l’agenda natif du téléphone, qui gère les alarmes lui-même.</li></ul>');
 h+=d('Plusieurs appareils et sauvegarde','<div class="warn"><b>Les appareils ne se synchronisent pas tout seuls.</b>Chaque appareil a sa propre copie de ton agenda.</div><ol><li>Appareil A : Réglages → <b>Sauvegarder (.json)</b>.</li><li>Envoie le fichier « '+BACKUP_FILE+' » à l’appareil B.</li><li>Appareil B : Réglages → <b>Restaurer</b>, puis choisis « Remplacer » ou « Fusionner ».</li></ol><p>Sauvegarde aussi régulièrement par sécurité : si tu vides les données du navigateur ou changes de téléphone, la sauvegarde est la seule copie. Le fichier porte toujours le même nom ; si ton téléphone en garde plusieurs, il ajoute « (1) », « (2) »… à la fin.</p>');
 h+=d('Connexion à Outlook','<ul><li>Réglages → <b>Outlook / Microsoft</b> → « Se connecter ». Tu t’identifies sur le site officiel de Microsoft : l’appli ne voit jamais ton mot de passe.</li><li>Elle crée un calendrier <b>« Agenda (appli) »</b> dans ton compte et y envoie tes événements (1 mois en arrière à 1 an en avant). Tes autres calendriers ne sont jamais touchés.</li><li><b>Sens unique</b> : appli → Outlook. Une modification faite dans Outlook sur ces événements est écrasée au prochain envoi.</li><li>Sur l’iPhone, ajoute ton compte Outlook dans Réglages → Calendrier → Comptes pour voir ce calendrier dans Calendrier.</li><li>La connexion expire au bout de quelques jours sans ouvrir l’appli : refais « Se connecter ».</li><li>Tu peux te déconnecter et supprimer ce calendrier à tout moment.</li></ul>');
 h+=d('Vue 2 semaines','<ul><li>L’onglet <b>2 sem.</b> montre deux semaines d’un coup : plus de place pour les titres, les emoji et les bandeaux que dans le mois.</li><li>Les flèches avancent de deux semaines. Touche un jour pour voir ses événements. Tu peux la choisir comme écran de démarrage dans Réglages.</li></ul>');
 h+=d('Emoji et vue Mois','<ul><li>Dans la fiche d’un événement, choisis un <b>emoji</b> (ou colle le tien) : il s’affiche devant le titre dans toutes les vues et part dans le .ics.</li><li>En vue <b>Mois</b>, un événement sur plusieurs jours de suite (ex. rotation 3 jours) forme un seul bandeau avec son nom complet. Touche un jour pour voir ses événements.</li><li>Les rendez-vous à heure fixe s’écrivent sur 1, 2 ou 3 lignes selon la place, avec une barre de la couleur de leur catégorie. « +2 » en haut d’une case = 2 événements de plus (touche la case).</li></ul>');
 h+=d('Rotations de travail','<ul><li>Dans <b>Réglages → Rotations de travail → Créer une rotation</b> : donne un nom, la date du premier jour, la durée, puis les <b>étapes</b> dans l’ordre (ex. 2 Matin, 2 Soir, 2 Nuit, 4 Repos).</li><li>Chaque étape a un nombre de jours, un type (travail ou repos), un emoji et, si tu veux, des heures (une fin avant le début = poste de nuit).</li><li>Des <b>modèles</b> (3 jours / 2 repos, matin / soir / nuit) te donnent un point de départ à modifier.</li><li>Tous les jours de la période apparaissent dans l’agenda comme des événements normaux : tu peux en changer un seul. « Modifier » la rotation recrée tous ses événements. « Supprimer » les retire.</li></ul>');
 h+=d('Catégorie Outlook','<ul><li>Connecté à Outlook, l’éditeur propose <b>Catégorie Outlook</b> : l’événement est rangé dans cette catégorie quand il est envoyé.</li><li><b>Calendrier Outlook</b> : choisis dans quel calendrier Outlook l’événement est envoyé. <b>Réglages → Outlook → Voir mes catégories et calendriers</b> : liste ce qu’Outlook renvoie et te laisse cacher ce que tu n’utilises pas.</li><li><b>Appli seulement</b> : pas de catégorie dans Outlook (la catégorie de l’appli reste).</li><li>Des doublons dans Outlook ? <b>Réglages → Outlook → Nettoyer les doublons dans Outlook</b> supprime les exemplaires en trop du calendrier « Agenda (appli) ».</li><li>Liste incomplète ? Déconnecte puis reconnecte Outlook une fois pour autoriser la lecture de tes catégories.</li></ul>');
 h+=d('Apparence (couleurs)','<ul><li><b>Réglages → Apparence</b> : couleur de l’appli, teinte du fond, couleur des week-ends, jours fériés en rouge et style des numéros de date.</li><li>L’aperçu en haut de la carte change immédiatement.</li><li>Le bouton du bas remet tout par défaut.</li></ul>');
 h+=d('Aide à l’adresse','<ul><li>Dans « Lieu », après 4 lettres, des adresses de France sont proposées : touche la bonne.</li><li>Facultatif et désactivé par défaut : à l’activation, ce que tu tapes dans « Lieu » est envoyé au service public Base Adresse Nationale. Rien d’autre ne sort de ton téléphone.</li><li>Adresse fausse, étrangère ou hors connexion : ton texte est gardé tel quel.</li></ul>');
 h+=d('Modèles et garde alternée','<ul><li><b>Modèle</b> : dans la fiche d’un événement, touche « Enregistrer comme modèle ». Ensuite, dans « Nouvel événement », touche le modèle : tout est rempli, tu changes seulement la date.</li><li><b>Garde alternée</b> : touche « Garde alternée… » (dans Nouvel événement ou Réglages → Modèles), choisis le rythme, les jours et heures de début et de fin, à partir de quand et jusqu’à quand. Les gardes sont créées d’un coup.</li><li><b>Vacances</b> : ajoute une période (du… au…) avec « Pas de garde », « Garde toute la période », « 1re moitié » ou « 2e moitié » : les gardes normales de la période sont remplacées.</li><li>Pour changer une seule garde, ouvre-la et choisis « Cette occurrence seulement ».</li><li>Gérer ou supprimer un modèle : Réglages → Modèles et garde alternée.</li></ul>');
 h+=d('Plein écran (œil)','<ul><li>Touche l’<b>œil</b> en haut : les boutons du haut et du bas disparaissent et le calendrier occupe tout l’écran.</li><li>Pour revenir, touche l’<b>œil barré</b> en haut à droite (ou la touche Échap sur ordinateur).</li><li>Glisser à gauche ou à droite change de mois/semaine/jour.</li></ul>');
 h+=d('Choisir un emoji','<ul><li>Dans l’éditeur d’un événement, touche <b>＋ Plus…</b> : catégories, recherche par mot (« dentiste », « avion »…) et tes emojis récents.</li><li>Tu peux aussi taper ou coller un emoji de ton clavier dans le champ.</li><li><b>Réglages → Catégories</b> : le bouton à côté du nom fixe l’emoji par défaut de la catégorie.</li></ul>');
 h+=d('Importer un autre calendrier (Outlook, Excel, CSV)','<ul><li><b>Réglages → Importer un autre calendrier</b>.</li><li><b>Depuis Outlook</b> (après connexion) : tu coches les calendriers à lire et la période ; une page liste ensuite tous les événements trouvés et tu coches ceux à ajouter (recherche, tout cocher / décocher) ; ils arrivent dans AgenDam, une catégorie par calendrier. Ça ne modifie rien dans Outlook. Option « Récupérer à l’ouverture » (carte Outlook) : l’appli relit seule les calendriers choisis lors du dernier import, au plus une fois toutes les 10 minutes. Ce qui est supprimé dans Outlook n’est pas supprimé ici, et ce qui vient d’Outlook n’est pas renvoyé dans « Agenda (appli) ».</li><li><b>Depuis un fichier Excel ou CSV</b> (.xlsx, .xls, .ods, .csv) : l’appli reconnaît les colonnes (titre, dates, heures, toute la journée, lieu, notes, catégorie, rappel). Corrige-les dans la fenêtre si besoin, puis une page liste les événements : décoche ceux que tu ne veux pas avant d’importer. Les dates sont lues en jour/mois/année (le format américain est reconnu quand il est évident).</li><li>Les doublons sont ignorés : tu peux réimporter le même fichier sans risque.</li><li>Dans Excel : une ligne par événement, une ligne d’en-têtes en haut. Tu peux exporter n’importe quel calendrier (Google Agenda, Outlook…) en CSV puis l’importer ici.</li></ul>');
 h+=d('Envoyer vers le calendrier du téléphone','<ul><li>Dans <b>Réglages → Calendrier du téléphone → Choisir les événements à envoyer</b> : filtre par période ou catégorie, décoche ce que tu ne veux pas, puis touche <b>Envoyer</b>.</li><li>Le téléphone affiche alors sa page « Ajouter » : <b>c’est lui qui te laisse choisir le calendrier</b> (iCloud, Outlook…).</li><li>Dans la fiche d’un événement, <b>Au calendrier</b> envoie cet événement seul. Dans l’éditeur, le bouton « Me proposer de l’ajouter au calendrier du téléphone » le fait juste après l’enregistrement.</li><li>C’est un envoi, pas une synchronisation : après une modification, l’appli te propose « Mettre à jour » pour renvoyer l’événement. Cette proposition s’active ou se désactive dans <b>Réglages</b> (ou événement par événement dans l’éditeur).</li><li>Sur <b>Android</b>, le téléphone ouvre en général Google Agenda ou l’agenda Samsung pour confirmer l’ajout.</li><li>Sur <b>ordinateur</b>, « Au calendrier » propose : <b>Outlook.com</b> (hotmail, live), <b>Outlook travail/école</b>, <b>Google Agenda</b> (l’événement arrive déjà rempli, il suffit d’enregistrer) ou le <b>fichier .ics</b> pour Outlook installé, <b>iCloud</b> ou Apple (iCloud n’a pas de lien direct : sur Mac le .ics s’ouvre dans Calendrier, sur PC dans Outlook). Pour plusieurs événements d’un coup, utilise le .ics.</li></ul>');
 h+=d('Aller à l’adresse d’un rendez-vous','<ul><li>Quand un événement a un <b>lieu</b> (champ « Lieu »), ouvre-le (le jour même, ou n’importe quand) : la ligne du lieu est cliquable.</li><li>Touche-la : choisis <b>Plans</b> (Apple), <b>Google Maps</b> ou <b>Waze</b> ; l’appli choisie s’ouvre avec l’adresse prête. Tu peux aussi <b>copier l’adresse</b>.</li><li>Plus l’adresse est complète (numéro, rue, ville), plus le résultat est précis.</li></ul>');
 h+=d('Ordinateur, tablette et grand écran','<ul><li>L’affichage s’adapte à l’appareil : téléphone (onglets en bas), tablette et ordinateur (onglets à gauche, mini-calendrier et journée à droite, réglages sur deux colonnes), grand écran (texte et grilles agrandis).</li><li><b>Raccourcis clavier</b> sur ordinateur : flèches ← → (période précédente / suivante), <b>T</b> aujourd’hui, <b>J</b> jour, <b>S</b> semaine, <b>M</b> mois, <b>D</b> 2 semaines, <b>C</b> ou <b>/</b> chercher, <b>N</b> nouvel événement, <b>P</b> imprimer, <b>?</b> aide.</li></ul>');
 h+=d('Imprimer','<ul><li>Touche l’icône <b>imprimante</b> en haut. Depuis Jour, Semaine, Mois ou 2 sem., elle imprime la vue affichée ; depuis les autres écrans, elle te demande <b>quoi imprimer</b>. <b>Une seule page</b> par impression.</li><li><b>Sur iPhone et iPad</b> : l’appli prépare un <b>PDF d’une page A4</b> ; touche « Imprimer / Partager le PDF », puis <b>Imprimer</b> dans le menu (ou Mail, Enregistrer dans Fichiers…). Sur ordinateur et Android, la fenêtre d’impression s’ouvre directement.</li><li>Le jour s’imprime en <b>portrait</b> (avec lieu et notes) ; la semaine, le mois et les 2 semaines en <b>paysage</b>, avec l’heure devant chaque rendez-vous.</li><li>Si une case est trop chargée, « +2 » indique les événements qui ne rentrent pas : passe alors par la vue Jour.</li><li>Sur <b>iPhone</b> : si rien ne s’ouvre, touche Partager puis « Imprimer », ou « Enregistrer dans Fichiers » pour faire un PDF.</li></ul>');
 h+=d('Ajouter à l’agenda du téléphone','<ul><li>Réglages → <b>Ajouter à mon agenda</b>. Sur <b>iPhone</b>, choisis « Calendrier » puis « Tout ajouter ». Sur <b>Android</b>, ouvre le fichier avec Google Agenda ou Outlook.</li><li>C’est un <b>envoi unique</b>, pas une synchronisation : refais-le après une modification (les événements déjà présents sont mis à jour par l’agenda, selon l’appli). L’intérêt : les rappels de l’agenda natif sont fiables, même appli fermée.</li></ul>');
 h+=d('Import et export .ics','<ul><li><b>Exporter</b> : crée un fichier .ics (calendrier standard) avec tes événements, leurs répétitions et leurs rappels. Les rotations sont exportées jour par jour (environ 14 mois).</li><li><b>Importer</b> : lis un fichier .ics venant de Google Agenda, Apple, Outlook… Les événements déjà présents ne sont pas dupliqués. Les fuseaux horaires sont lus comme heure locale.</li></ul>');

 }else{
  const ids=new Set(EV.map(e=>e.id));let n=0;
  b.events.forEach(e=>{const i=EV.findIndex(x=>x.id===e.id);if(i>=0)EV[i]=e;else{EV.push(e);n++}});

 if(ev.allDay){os=ev.start;oe=add(ev.end,1);gs=ymd(ev.start);ge=ymd(add(ev.end,1))}
 else{os=dt(ev.start,tmin(ev.startTime));oe=dt(ev.end,tmin(ev.endTime));gs=icsDT(ev.start,tmin(ev.startTime));ge=icsDT(ev.end,tmin(ev.endTime))}

 return [
  ['Outlook.com (hotmail, live, outlook)','https://outlook.live.com/calendar/0/deeplink/compose?'+o],
  ['Outlook travail ou école (Microsoft 365)','https://outlook.office.com/calendar/0/deeplink/compose?'+o],
  ['Google Agenda','https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t)+'&dates='+gs+'/'+ge+'&location='+encodeURIComponent(ev.place||'')+'&details='+encodeURIComponent(ev.note||'')]
 ];
}

const atTime=(d,m)=>{const x=pd(d);x.setMinutes(m);return x};
function notify(title,body,tag){
 toast('🔔 '+title+(body?' · '+body:''),9000);
 try{
  if('Notification' in window&&Notification.permission==='granted'){
   const opt={body,tag,icon:'icons/icon-192.png',badge:'icons/icon-192.png'};

  }

function updateNow(){
 const n=nowMin();$$('.nowline').forEach(l=>{l.style.top=(n/1440*100)+'%'});
}
function tick(){
 updateNow();
 if(demo)return;
 const n=Date.now(),t0=today();
 const fired=ls.get(K.fired,{});let ch=false;
 for(const o of occs(add(t0,-1),add(t0,2))){
  if(o.ev.alarm==null)continue;
  const base=o.allDay?atTime(o.date,540):atTime(o.date,o.s);
  const at=base.getTime()-o.ev.alarm*60000;
  const end=atTime(o.endDate,o.allDay?1440:o.e).getTime();
  const key=o.ev.id+'|'+o.date;
  if(n>=at&&n-at<30*60000&&n<end&&!fired[key]){
   fired[key]=n;ch=true;
   notify(o.ev.title,(o.allDay?'Journée entière':hm(o.s)+' – '+hm2(o.e))+(o.ev.place?' · '+o.ev.place:''),key);
  }
 }
 for(const k in fired)if(n-fired[k]>4*864e5){delete fired[k];ch=true}
 if(ch)ls.set(K.fired,fired);
}

  case 'rot-del':rotDel(el.dataset.id);break;
  case 'rot-save':rotSave();break;
  case 'rot-add':rotRead();ROT.steps.push({lab:'Repos',days:1,work:false,allDay:true,st:'07:00',et:'19:00',icon:''});rotDraw();break;
  case 'rot-rm':rotRead();ROT.steps.splice(+el.dataset.i,1);rotDraw();break;
  case 'rot-up':{rotRead();const i=+el.dataset.i,x=ROT.steps.splice(i,1)[0];ROT.steps.splice(i-1,0,x);rotDraw();break}
  case 'rot-preset':{rotRead();const p=ROT_PRESETS.find(q=>q.k===el.dataset.k);ROT.steps=JSON.parse(JSON.stringify(p.steps));ROT.name=p.name;rotDraw();break}
  case 'sel-open':selOpen();break;
  case 'sel-t':selToggle(el.dataset.id);break;
  case 'sel-cat':selCat(el.dataset.id);break;
  case 'sel-all':selAll(true);break;
  case 'sel-none':selAll(false);break;
  case 'sel-send':selSend();break;
  case 'ics-add':if(demo){toast('Quitte d’abord le mode démo');break}exportICS(false,EV.slice());break;
  case 'ics-import':$('#fi-ics').value='';$('#fi-ics').click();break;
  case 'gobackup':V.view='settings';render();setTimeout(()=>{const c=$('#data-card');c&&c.scrollIntoView({block:'start'})},60);break;
  case 'snooze':META.snooze=Date.now()+864e5;saveMeta();render();break;
  case 'demo':enterDemo();break;
  case 'exitdemo':exitDemo();break;
  case 'install':if(installEv){installEv.prompt();installEv=null;render()}break;
  case 'ms-connect':msConnect();break;
  case 'ms-sync':msSync(false);break;
  case 'ms-import':msImport();break;
  case 'ol-manage':olManage();break;
  case 'ol-dedupe':olDedupe();break;
  case 'pickocal':$$('#f-ocal .chip').forEach(c=>c.classList.toggle('on',c===el));break;
  case 'ms-pull':msPullNow();break;
  case 'xl-import':$('#fi-xl').value='';$('#fi-xl').click();break;
  case 'ms-disc':msDisconnect();break;
  case 'ms-saveid':{const v=($('#ms-cid')||{}).value||'';if(/^[0-9a-f-]{36}$/i.test(v.trim())){S.msClientId=v.trim();saveSet();render();toast('Identifiant enregistré')}else toast('Identifiant invalide (36 caractères avec des tirets)');break}
  case 'wipe':{
   const r=await ask({title:'Tout effacer ?',text:'Tous tes événements et réglages seront supprimés de cet appareil. Pense à sauvegarder avant. Action irréversible.',btns:[{label:'Effacer définitivement',value:'y',cls:'dng'},{label:'Annuler',value:null}]});
   if(r==='y'){[K.data,K.set,K.meta,K.fired,K.ms].forEach(ls.del);MSA={token:null,exp:0,refresh:null,calId:null,map:{},acct:'',last:0,err:'',n:0};S=Object.assign({},DEF_SET,{cats:DEF_CATS.map(c=>Object.assign({},c))});META={lastBackup:null,dirtySince:null,snooze:0,seen:false,lastRemind:0};EV=[];demo=false;setTheme();V.view='day';V.date=today();render();toast('Données effacées')}
   break}
  case 'welcome-start':closeSheet();META.seen=true;saveMeta();break;
  case 'welcome-demo':closeSheet();META.seen=true;saveMeta();enterDemo();break;
 }
}
function welcome(){
 let h='<h2>Bienvenue 👋</h2><p style="margin:.3rem 0 .6rem">Un agenda simple, lisible et <b>privé</b> : jour, semaine, mois, en gros caractères. Gratuit, sans publicité.</p><ul style="padding-left:1.2rem;margin:.3rem 0 .8rem"><li>Rien ne quitte ton appareil : aucune donnée collectée.</li><li>Fonctionne sans connexion une fois installée.</li><li><b>Plusieurs appareils ?</b> Ils ne se synchronisent pas tout seuls : sauvegarde (.json) puis restaure sur l’autre.</li></ul><div class="btns"><button class="btn pri grow" data-act="welcome-start">Commencer</button><button class="btn grow" data-act="welcome-demo">Voir la démo</button></div><button class="btn blk" data-act="help">Mode d’emploi</button>';
 openSheet(h);
}

/* ---------- Écouteurs ---------- */
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const t=e.target,tag=t&&t.tagName;
 if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
 if(SHEET_OPEN||$('#dlg').innerHTML)return;
 const k=e.key.toLowerCase();
 const B={arrowleft:'prev',arrowright:'next',t:'today',n:'new',p:'print'};
 const Vw={j:'day',s:'week',m:'month',d:'fort'};
 if(B[k]){e.preventDefault();const b=document.querySelector('[data-act='+B[k]+']');if(b)b.click()}
 else if(Vw[k]){e.preventDefault();go(Vw[k])}
 else if(k==='/'||k==='c'){e.preventDefault();go('search')}
 else if(k==='?'||k==='h'){e.preventDefault();openHelp()}
});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(t){act(t.dataset.act,t,e);return}
 const col=e.target.closest('.tg-col');
 if(col&&!e.target.closest('.ev')&&!SHEET_OPEN){
  const r=col.getBoundingClientRect();
  const m=Math.min(1380,Math.floor((e.clientY-r.top)/r.height*48)*30);
  openEditor({date:col.dataset.date,startMin:m});return;
 }
 if(e.target.classList&&e.target.classList.contains('ov')&&e.target.parentElement.id==='sheet')closeSheet();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id&&t.id.indexOf('f-')===0){onEditorChange(e);return}
 if(t.id&&/^rs-(type|all)-/.test(t.id)){rotRead();rotDraw();return}
 if(t.id==='sel-per'){SEL.per=t.value;selRefilter();return}
 if(t.dataset.chg==='askPhone'){S.askPhone=t.checked;saveSet();return}
 if(t.dataset.chg==='remind'){S.remind=t.checked;saveSet();return}
 if(t.dataset.chg==='defAlarm'){S.defAlarm=t.value===''?null:+t.value;saveSet();return}
 if(t.dataset.chg==='adrAide'){S.adrAide=t.checked;saveSet();return}
 if(t.dataset.look){setSetting(t.dataset.look,t.value);return}
 if(t.dataset.cat!=null&&t.dataset.field==='color'){S.cats[+t.dataset.cat].color=t.value;saveSet();render();return}
 if(t.id==='fi-json'&&t.files[0]){restoreFile(t.files[0]);return}
 if(t.id==='fi-ics'&&t.files[0]){importICS(t.files[0]);return}
 if(t.id==='fi-xl'&&t.files[0]){importSheet(t.files[0]);return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='sel-q'){SEL.q=t.value;selRefilter();return}
 if(t.id==='f-place'){adrInput(t);return}
 if(t.id==='q'){SQ=t.value;const r=$('#sres');if(r)r.innerHTML=searchResults(SQ);return}
 if(t.dataset.cat!=null&&t.dataset.field==='name'){S.cats[+t.dataset.cat].name=t.value.slice(0,30)||'Sans nom';saveSet()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#dlg').innerHTML){$('#dlg').innerHTML='';return}if(SHEET_OPEN){closeSheet();return}if(document.body.classList.contains('focus')){document.body.classList.remove('focus');render()}}
 if(e.key==='Enter'&&e.target.id==='f-title'){e.preventDefault();saveEditor()}
});
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now()},{passive:true});
document.addEventListener('touchend',e=>{
 if(SHEET_OPEN||!['day','month','fort'].includes(V.view)&&!(V.view==='week'&&!$('#tgw')))return;
 if(e.target.closest&&e.target.closest('.tg-wrap')&&$('#tgw').scrollWidth>$('#tgw').clientWidth+2)return;
 if(!e.target.closest||!e.target.closest('#main'))return;
 const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
 if(Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-tt<600)shift(dx<0?1:-1);
},{passive:true});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'){
  tick();olAuto();
  if(V.date!==today()&&V.view==='day'&&diff(today(),V.date)===1)V.date=today();
  if(S.remind&&!demo&&Date.now()-META.lastRemind>60*60*1000&&!SHEET_OPEN)showUpcoming(false);
  render();
 }
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(V.view==='settings')render()});
window.addEventListener('appinstalled',()=>{installEv=null});
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.theme==='auto')setTheme()})}catch(e){}

/* ---------- Démarrage ---------- */
function registerSW(){
 if(!('serviceWorker' in navigator)||!(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return;
 const hadController=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js').then(reg=>{
  swReg=reg;
  const watch=w=>{w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nouvelle version disponible',15000,{label:'Mettre à jour',fn:()=>w.postMessage('skipWaiting')})})};
  if(reg.waiting&&navigator.serviceWorker.controller)toast('Nouvelle version disponible',15000,{label:'Mettre à jour',fn:()=>reg.waiting.postMessage('skipWaiting')});
  reg.addEventListener('updatefound',()=>watch(reg.installing));
 }).catch(()=>{});
 let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||!hadController)return;reloaded=true;location.reload()});
}
async function init(){
 setTheme();fillIcons(document);
 loadData();
 const q=new URLSearchParams(location.search);
 const pv=q.get('view');
 V.view=['day','week','month','fort'].includes(pv)?pv:(['week','month','fort'].includes(S.start)?S.start:'day');
 await msHandleReturn();
 if(q.get('demo')==='1'){demo=true;EV=demoData()}
 render();
 registerSW();
 setInterval(tick,30000);tick();
 setTimeout(()=>{if(!demo&&!S.mergeDone){S.mergeDone=1;saveSet();const n=mergeLocal();if(n)toast(n+' jour'+(n>1?'s':'')+' identique'+(n>1?'s':'')+' regroupé'+(n>1?'s':'')+' (événements importés)',5000)}},1200);
 setTimeout(olAuto,1500);
 if(!demo){
  if(!META.seen&&!EV.length){setTimeout(welcome,300);META.ver=APP_VERSION;saveMeta()}
  else if(META.ver!==APP_VERSION)setTimeout(()=>{if(!SHEET_OPEN)whatsNew()},400);
  else if(S.remind)setTimeout(()=>{if(!SHEET_OPEN)showUpcoming(false)},500);
 }
}
init();
window.__agd={get EV(){return EV},get S(){return S},V,version:APP_VERSION};
})();


</script>
